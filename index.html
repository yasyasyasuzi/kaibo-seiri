<style>
:root{
  --navy:#1B2540;--sub:#646C80;--faint:#9AA1B2;--line:#E7EAF1;
  --b1:#2747B8;--b2:#3E63D6;--band:#EEF2FC;--bandline:#DCE4F8;
  --or:#E0702A;--or-bg:#FDF1E9;--ok-bg:#EEF2FC;
  --grad:linear-gradient(135deg,var(--b1),var(--b2));
  --ease:cubic-bezier(.33,.9,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--navy);font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:15px;line-height:1.75;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto}
h1,h2,.palt{font-feature-settings:"palt";letter-spacing:.01em}

/* header */
.hd{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.hd svg{width:26px;height:26px;display:block}

/* hero */
.hero{text-align:center;padding:34px 20px 6px}
.eyebrow{margin:0;font-size:12.5px;font-weight:700;color:var(--b1);letter-spacing:.06em}
h1{margin:6px 0 0;font-size:30px;font-weight:800;line-height:1.3;display:inline-flex;align-items:flex-start;gap:4px}
h1 .bulb{width:22px;height:22px;margin-top:-4px;flex:none}
.lead{margin:8px 0 0;font-size:13.5px;color:var(--sub)}
.flow{display:flex;justify-content:center;align-items:flex-start;gap:6px;list-style:none;margin:26px 0 0;padding:0}
.flow li{width:92px;font-size:12px;line-height:1.5;color:var(--navy)}
.flow .st{display:block;font-size:10px;font-weight:700;color:var(--b1);letter-spacing:.08em;margin-bottom:6px}
.flow .dot{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;border:1.5px solid var(--bandline);color:var(--b1);font-weight:800;font-size:15px}
.flow li:first-child .dot{background:var(--grad);color:#fff;border-color:transparent}
.flow .ar{width:14px;margin-top:38px;color:var(--faint);font-size:12px;flex:none}

/* tabs (only fixed element) */
.tabs{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.4) blur(8px);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);margin-top:28px}
.tabs .wrap{display:flex}
.tab{flex:1;height:46px;font-size:14px;font-weight:500;color:var(--sub);position:relative}
.tab[aria-selected="true"]{color:var(--navy);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2.5px;border-radius:2px;background:var(--grad)}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--or);color:#fff;font-size:11px;font-weight:700;line-height:18px;vertical-align:1px}
.badge[hidden]{display:none}

/* tools */
.tools{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sum{flex:1;min-width:0;font-size:12.5px;color:var(--sub)}
.sum b{color:var(--navy);font-weight:700;font-size:14px}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub)}
.sw i{width:34px;height:20px;border-radius:10px;background:#D5DAE5;position:relative;transition:background .25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .25s var(--ease)}
.sw[aria-pressed="true"] i{background:var(--b2)}
.sw[aria-pressed="true"] i::after{transform:translateX(14px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);font-size:12.5px;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--grad);color:#fff;font-weight:700}

/* bands */
.band{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--band);border-top:1px solid var(--bandline);border-bottom:1px solid var(--bandline)}
.ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--b2);color:var(--b1);font-size:13px;font-weight:700;flex:none}
.bn{flex:1;min-width:0;font-size:15px;font-weight:700;font-feature-settings:"palt"}
.bn small{font-size:11px;font-weight:500;color:var(--sub);margin-right:6px}
.cnt{font-size:12px;color:var(--sub)}
.rt{min-width:46px;text-align:right;font-size:12.5px;font-weight:700;color:var(--b1)}
.rt.none{color:var(--faint);font-weight:500}

/* rows */
.item{border-bottom:1px solid var(--line);scroll-margin-top:56px}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;text-align:left}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bandline);font-size:12px;font-weight:700;color:var(--b1);flex:none;margin-top:1px}
.qt{flex:1;min-width:0;font-size:15px;line-height:1.65;font-feature-settings:"palt"}
.mk{width:18px;flex:none;margin-top:5px;font-size:13px;font-weight:800;text-align:center}
.mk.ok::before{content:"○";color:var(--b2)}
.mk.ng::before{content:"×";color:var(--or)}
.chev{width:10px;height:10px;flex:none;margin-top:9px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:transform 1s var(--ease)}
.item.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.item.open .num{background:var(--grad);color:#fff;border-color:transparent}
.body{overflow:hidden}
.inner{padding:0 16px 18px 56px}

/* choices */
.chs{list-style:none;margin:0;padding:0}
.ch{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 0;text-align:left;border-top:1px solid var(--line);font-size:14.5px;line-height:1.6;transition:color .3s,opacity .3s}
.chs li:first-child .ch{border-top:0}
.cn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #CCD3E2;font-size:12px;font-weight:700;color:var(--sub);flex:none;transition:all .3s}
.ch:active .cn{border-color:var(--b2)}
.done .ch{cursor:default;opacity:.45}
.done .ch.is-ok,.done .ch.is-ng{opacity:1}
.ch.is-ok{color:var(--b1);font-weight:700}
.ch.is-ok .cn{background:var(--grad);border-color:transparent;color:#fff}
.ch.is-ng{color:var(--or);font-weight:700}
.ch.is-ng .cn{background:var(--or);border-color:transparent;color:#fff}

/* result */
.res{overflow:hidden}
.res-in{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.vd{display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:800;font-feature-settings:"palt"}
.vd.ok{color:var(--b1)}
.vd.ng{color:var(--or)}
.vd span{font-size:12.5px;font-weight:500;color:var(--sub)}
.ex{margin:6px 0 0;font-size:14px;line-height:1.75}
.oth{margin:12px 0 0;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.06em}
.ot{list-style:none;margin:4px 0 0;padding:0}
.ot li{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.65;color:var(--sub)}
.ot .cn{width:20px;height:20px;font-size:10.5px;border-width:1px;margin-top:1px}
.acts{display:flex;align-items:center;gap:20px;margin-top:14px;padding-right:60px}
.retry{font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.next{height:40px;padding:0 20px;border-radius:20px;background:var(--grad);color:#fff;font-size:14px;font-weight:700}
.end{font-size:13px;color:var(--sub)}

.empty{padding:40px 24px;text-align:center;color:var(--sub);font-size:14px}
.empty .ic{margin:0 auto 10px;width:40px;height:40px;font-size:18px}
.note{padding:22px 20px 0;font-size:11.5px;line-height:1.7;color:var(--faint);text-align:center}
.clear{display:block;margin:14px auto 0;font-size:12px;color:var(--faint);text-decoration:underline;text-underline-offset:3px}

/* footer */
.ft{padding:36px 16px calc(36px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--faint)}

/* to top */
.top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(27,37,64,.12);display:grid;place-items:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
.top.on{opacity:1;transform:none;pointer-events:auto}
.top::before{content:"";width:9px;height:9px;border-left:2px solid var(--b1);border-top:2px solid var(--b1);transform:rotate(45deg);margin-top:4px}
</style>
</head>

<header class="hd"><div class="wrap" style="width:100%">

<section class="hero">
  <p class="eyebrow">あん摩マッサージ指圧師 国家試験対策</p>

<nav class="tabs" role="tablist"><div class="wrap">
  <button class="tab" role="tab" data-t="a">解剖学</button>

</div></nav>

<main class="wrap">
  <div class="tools">
    <div class="sum" id="sum"></div>

  </div>

  <div id="list"></div>
  <p class="note">問題はすべてオリジナル。標準的な教科書に沿っています。<br>解いた記録はこの端末のブラウザにだけ保存されます。</p>

</main>

<footer class="ft"></footer>
<button class="top" id="top" aria-label="上へ戻る"></button>

<script>
/* 問題データ: [問題文, [選択肢4つ], 正解の番号(0始まり), 正解の理由, [各選択肢の短い説明(正解は空)]] */
const F=[
{"id":"a1","g":"a","k":"骨","name":"骨格系","q":[["骨の「長さ」の成長に関わる部位はどれか。",["骨膜","骨端軟骨","骨髄","関節軟骨"],1,"骨端軟骨(骨端板)でつくられた軟骨が骨に置きかわり、骨が長くなる。成長が終わると骨端線として残る。",["骨膜は骨の「太さ」の成長に関わる。","","骨髄は血液をつくる場所。","関節軟骨は関節面を覆い、動きをなめらかにする。"]],["左右一対(2個)ある頭蓋の骨はどれか。",["前頭骨","頭頂骨","後頭骨","蝶形骨"],1,"頭頂骨は左右に1個ずつある。側頭骨も一対。",["前頭骨は1個。","","後頭骨は1個。","蝶形骨は1個。"]],["横突孔をもつ椎骨はどれか。",["頸椎","胸椎","腰椎","仙骨"],0,"頸椎の横突起には横突孔があり、椎骨動脈が通る。",["","胸椎の特徴は、肋骨と関節する肋骨窩。","腰椎に横突孔はない。","仙骨には前・後仙骨孔があり、仙骨神経が出る。"]],["上腕骨にある構造はどれか。",["肘頭","大結節","大転子","烏口突起"],1,"大結節は上腕骨の上端外側にあり、棘上筋・棘下筋・小円筋が付く。",["肘頭は尺骨。","","大転子は大腿骨。","烏口突起は肩甲骨。"]],["手根骨はどれか。",["距骨","踵骨","立方骨","有鉤骨"],3,"有鉤骨は8個ある手根骨のひとつ。手のひら側に鉤(フック)がある。",["距骨は足根骨。","踵骨は足根骨(かかとの骨)。","立方骨は足根骨。",""]],["成人の骨の数はおよそどれか。",["約100個","約200個","約300個","約400個"],1,"成人の骨は約200個(206個とされることが多い)。",["約100個では少なすぎる。","","約300個ではない(新生児は骨が多いが、成長とともに癒合して減る)。","約400個ではない。"]],["骨の無機質で最も多いものはどれか。",["リン酸カルシウム","炭酸カリウム","塩化ナトリウム","硫酸マグネシウム"],0,"骨の無機質の主成分はリン酸カルシウム(ヒドロキシアパタイト)で、骨の硬さをつくる。",["","骨の主成分ではない。","骨の主成分ではない。","骨の主成分ではない。"]],["新しい骨をつくる細胞はどれか。",["破骨細胞","骨細胞","骨芽細胞","軟骨細胞"],2,"骨芽細胞が骨基質をつくり、やがて骨基質に埋もれて骨細胞になる。",["破骨細胞は骨を壊す(吸収する)。","骨細胞は骨基質の中にあり、骨を維持する。","","軟骨細胞は軟骨をつくる。"]],["骨単位(オステオン)の中心を縦に走る管はどれか。",["フォルクマン管","脊柱管","ハバース管","栄養孔"],2,"ハバース管は骨単位の中心を縦に走り、血管や神経が通る。",["フォルクマン管はハバース管どうしや骨膜とを横につなぐ。","脊柱管は椎孔が連なってできる管で、脊髄が通る。","","栄養孔は骨の表面にある、血管が入る孔。"]],["骨膜を骨に固定している線維はどれか。",["弾性線維","細網線維","プルキンエ線維","シャーピー線維"],3,"シャーピー線維は骨膜から骨の中へ入り込み、骨膜を骨にしっかり付ける。",["弾性線維は血管壁などに多く、伸び縮みする。","細網線維はリンパ節などの網目をつくる。","プルキンエ線維は心臓の刺激伝導系。",""]],["種子骨はどれか。",["距骨","鎖骨","舟状骨","膝蓋骨"],3,"膝蓋骨は大腿四頭筋の腱の中にできる、人体で最大の種子骨。",["距骨は足根骨。","鎖骨は長骨。","舟状骨は手根骨・足根骨にある短骨。",""]],["含気骨(中に空洞をもつ骨)はどれか。",["頭頂骨","後頭骨","上顎骨","下顎骨"],2,"上顎骨には上顎洞がある。前頭骨・篩骨・蝶形骨・側頭骨も含気骨。",["頭頂骨に副鼻腔はない。","後頭骨に副鼻腔はない。","","下顎骨に副鼻腔はない。"]],["前頭骨と左右の頭頂骨の間にある縫合はどれか。",["矢状縫合","鱗状縫合","ラムダ縫合","冠状縫合"],3,"冠状縫合は前頭骨と左右の頭頂骨の間を横に走る。",["矢状縫合は左右の頭頂骨の間。","鱗状縫合は頭頂骨と側頭骨の間。","ラムダ縫合は頭頂骨と後頭骨の間。",""]],["大泉門がある位置はどれか。",["後頭骨と左右の頭頂骨の間","前頭骨と左右の頭頂骨の間","左右の鼻骨の間","左右の上顎骨の間"],1,"大泉門は前頭骨と左右の頭頂骨の間にあるひし形のすき間で、1歳半〜2歳ごろに閉じる。",["後頭骨と頭頂骨の間にあるのは小泉門。","","泉門ではない。","泉門ではない。"]],["下顎骨と関節をつくる骨はどれか。",["側頭骨","上顎骨","蝶形骨","頬骨"],0,"顎関節は下顎骨の下顎頭と側頭骨の下顎窩でできる。",["","上顎骨とは関節しない。","蝶形骨とは関節しない。","頬骨とは関節しない。"]],["第1頸椎(環椎)の特徴はどれか。",["歯突起がある","棘突起が長い","椎体がない","横突孔がない"],2,"環椎は椎体がなく、前弓と後弓でできた輪の形をしている。",["歯突起があるのは第2頸椎(軸椎)。","棘突起が長いのは第7頸椎(隆椎)。","","環椎にも横突孔がある。"]],["真肋はどれか。",["第1〜7肋骨","第8〜10肋骨","第11〜12肋骨","第1〜12肋骨"],0,"第1〜7肋骨は肋軟骨を通して直接胸骨とつながる真肋。",["","第8〜10肋骨は仮肋(上の肋軟骨を介してつながる)。","第11〜12肋骨は胸骨とつながらない浮遊肋。","すべてが真肋ではない。"]],["胸骨角の高さで胸骨とつながる肋骨はどれか。",["第1肋骨","第2肋骨","第3肋骨","第4肋骨"],1,"胸骨角(胸骨柄と胸骨体の境)の横に第2肋骨が付く。肋骨を数える目安になる。",["第1肋骨は胸骨柄の上部に付く。","","第3肋骨は胸骨角より下。","第4肋骨は胸骨角より下。"]],["肩甲骨にある構造はどれか。",["大結節","外側上顆","鉤状突起","肩峰"],3,"肩峰は肩甲棘の外側の端で、肩の先端をつくる。",["大結節は上腕骨。","外側上顆は上腕骨。","鉤状突起は尺骨。",""]],["鎖骨と関節をつくる骨の組み合わせはどれか。",["胸骨と上腕骨","上腕骨と肩甲骨","胸骨と肩甲骨","第1胸椎と肩甲骨"],2,"鎖骨は内側で胸骨(胸鎖関節)、外側で肩甲骨の肩峰(肩鎖関節)と関節する。",["鎖骨は上腕骨と関節しない。","鎖骨は上腕骨と関節しない。","","鎖骨は胸椎と関節しない。"]],["前腕の骨で、母指側にあるのはどれか。",["尺骨","橈骨","上腕骨","腓骨"],1,"橈骨は前腕の母指側、尺骨は小指側にある。",["尺骨は小指側。","","上腕骨は上腕の骨。","腓骨は下腿の外側の骨。"]],["尺骨にある構造はどれか。",["橈骨粗面","小結節","鉤状突起","内側上顆"],2,"鉤状突起は尺骨上端の前方の突起で、上腕骨の滑車と関節をつくる。",["橈骨粗面は橈骨。","小結節は上腕骨。","","内側上顆は上腕骨。"]],["寛骨をつくらない骨はどれか。",["仙骨","坐骨","恥骨","腸骨"],0,"寛骨は腸骨・坐骨・恥骨の3つが癒合した骨。仙骨は脊柱の一部。",["","坐骨は寛骨の一部。","恥骨は寛骨の一部。","腸骨は寛骨の一部。"]],["坐骨にある構造はどれか。",["坐骨結節","上前腸骨棘","恥骨結合面","大転子"],0,"坐骨結節は座ったときに体重を支える部分で、ハムストリングが起こる。",["","上前腸骨棘は腸骨。","恥骨結合面は恥骨。","大転子は大腿骨。"]],["女性の骨盤の特徴はどれか。",["骨盤腔が漏斗状","骨盤上口がハート形","恥骨下角が大きい","仙骨の幅が狭い"],2,"女性の骨盤は出産に適し、恥骨下角が大きく(鈍角に近い)、骨盤腔が広い。",["漏斗状は男性の特徴。女性は円筒状。","ハート形は男性の骨盤上口。女性は横に広い楕円形。","","仙骨の幅が狭いのは男性の特徴。"]],["大腿骨にある構造はどれか。",["小転子","脛骨粗面","内果","外果"],0,"小転子は大腿骨上部の内側後方にあり、腸腰筋が付く。",["","脛骨粗面は脛骨。","内果は脛骨。","外果は腓骨。"]],["外果(外くるぶし)をつくる骨はどれか。",["脛骨","踵骨","距骨","腓骨"],3,"外果は腓骨の下端、内果は脛骨の下端。",["脛骨は内果をつくる。","踵骨はかかとの骨。","距骨は足根骨で、くるぶしをつくらない。",""]],["足根骨の数はどれか。",["5個","7個","8個","14個"],1,"足根骨は距骨・踵骨・舟状骨・立方骨・内側・中間・外側楔状骨の7個。",["5個は中足骨の数。","","8個は手根骨の数。","14個は片足の趾骨の数。"]],["手の母指(親指)の指骨の数はどれか。",["1個","2個","3個","4個"],1,"母指は基節骨と末節骨の2個。ほかの指は基節骨・中節骨・末節骨の3個。",["1個ではない。","","3個は母指以外の指。","4個ではない。"]],["脊柱の生理的弯曲で、後ろに弯曲する(後弯)部位はどれか。",["頸椎","腰椎","胸椎","頸椎と腰椎"],2,"脊柱は頸部と腰部で前弯、胸部と仙骨部で後弯する。",["頸椎は前弯。","腰椎は前弯。","","頸椎と腰椎はどちらも前弯。"]]]},
{"id":"a2","g":"a","k":"関","name":"関節・靱帯","q":[["球関節はどれか。",["肩関節","腕尺関節","上橈尺関節","母指の手根中手関節"],0,"肩関節は上腕骨頭(球)と肩甲骨の関節窩でできる球関節で、よく動く。",["","腕尺関節は蝶番関節。","上橈尺関節は車軸関節。","母指の手根中手関節は鞍関節。"]],["膝関節の関節包の中にある靱帯はどれか。",["内側側副靱帯","膝蓋靱帯","前十字靱帯","腸脛靱帯"],2,"前・後十字靱帯は関節包の中にあり、脛骨が前後にずれるのを防ぐ。",["内側側副靱帯は関節の内側を補強する、関節包の外の靱帯。","膝蓋靱帯は膝蓋骨と脛骨粗面をつなぐ、関節包の外の靱帯。","","腸脛靱帯は大腿の外側を走る筋膜の厚い部分。"]],["大腿骨頭と寛骨臼をつなぎ、股関節の中にある靱帯はどれか。",["腸骨大腿靱帯","恥骨大腿靱帯","大腿骨頭靱帯","坐骨大腿靱帯"],2,"大腿骨頭靱帯は関節の中にあり、骨頭へ向かう細い血管が通る。",["腸骨大腿靱帯は関節包を前から補強する、強い靱帯。","恥骨大腿靱帯は関節包の前下方を補強する。","","坐骨大腿靱帯は関節包の後方を補強する。"]],["椎体の後面を縦に走る靱帯はどれか。",["後縦靱帯","前縦靱帯","黄色靱帯","棘上靱帯"],0,"後縦靱帯は椎体の後面(脊柱管の前壁)を縦に走る。",["","前縦靱帯は椎体の前面を走る。","黄色靱帯は上下の椎弓の間をつなぐ。","棘上靱帯は棘突起の先端をつなぐ。"]],["足関節の外側にある靱帯はどれか。",["三角靱帯","底側踵舟靱帯","前距腓靱帯","後十字靱帯"],2,"前距腓靱帯は外果(外くるぶし)の前にあり、足首を内側にひねる捻挫で最も傷みやすい。",["三角靱帯は足関節の内側。","底側踵舟靱帯は足底にあり、土踏まずを支える。","","後十字靱帯は膝関節の靱帯。"]],["関節腔に面し、滑液を分泌する膜はどれか。",["線維膜","関節軟骨","骨膜","滑膜"],3,"関節包の内側の滑膜が滑液を分泌し、関節の動きをなめらかにし軟骨を養う。",["線維膜は関節包の外側の丈夫な層。","関節軟骨は膜ではなく、関節面を覆う軟骨。","骨膜は骨の表面を覆う膜。",""]],["関節円板がある関節はどれか。",["肩関節","顎関節","肘関節","股関節"],1,"顎関節には関節円板があり、関節腔を上下に分ける。胸鎖関節にもある。",["肩関節にあるのは関節唇。","","肘関節に関節円板はない。","股関節にあるのは関節唇。"]],["関節半月がある関節はどれか。",["肘関節","足関節","膝関節","肩関節"],2,"膝関節には内側半月と外側半月があり、衝撃をやわらげる。",["肘関節に半月はない。","足関節に半月はない。","","肩関節に半月はない。"]],["車軸関節はどれか。",["肩関節","正中環軸関節","股関節","膝関節"],1,"正中環軸関節は軸椎の歯突起を軸に環椎が回る車軸関節。上橈尺関節も車軸関節。",["肩関節は球関節。","","股関節は臼状関節(球関節の一種)。","膝関節は蝶番関節の一種。"]],["楕円関節(顆状関節)はどれか。",["正中環軸関節","肩関節","腕尺関節","橈骨手根関節"],3,"橈骨手根関節は楕円形の関節面どうしでできる楕円関節で、屈伸と内転・外転ができる。",["正中環軸関節は車軸関節。","肩関節は球関節。","腕尺関節は蝶番関節。",""]],["関節窩が深く、臼状関節とよばれるのはどれか。",["股関節","肩関節","肘関節","膝関節"],0,"股関節は寛骨臼が深く骨頭を包み込む臼状関節で、安定性が高い。",["","肩関節は関節窩が浅い球関節。","肘関節は複関節。","膝関節は蝶番関節の一種。"]],["平面関節はどれか。",["椎間関節","股関節","正中環軸関節","肩関節"],0,"椎間関節は平らな関節面どうしが少し滑り合う平面関節。肩鎖関節も平面関節。",["","股関節は臼状関節。","正中環軸関節は車軸関節。","肩関節は球関節。"]],["線維性の連結はどれか。",["椎間円板による連結","恥骨結合","頭蓋の縫合","肩関節"],2,"頭蓋の縫合は骨どうしが線維性結合組織でつながる、ほとんど動かない連結。",["椎間円板による連結は軟骨性の連結。","恥骨結合は軟骨性の連結。","","肩関節は滑膜をもつ関節(滑膜性の連結)。"]],["軟骨性の連結はどれか。",["恥骨結合","頭蓋の縫合","歯と歯槽の連結(釘植)","肘関節"],0,"恥骨結合は左右の恥骨が線維軟骨でつながる軟骨性の連結。",["","頭蓋の縫合は線維性の連結。","釘植は線維性の連結。","肘関節は滑膜性の連結。"]],["肩関節で、浅い関節窩の縁を広げている構造はどれか。",["関節半月","関節円板","関節唇","滑液包"],2,"関節唇は関節窩の縁を囲む線維軟骨で、関節窩を深くする。",["関節半月は膝関節にある。","関節円板は顎関節や胸鎖関節にある。","","滑液包は摩擦を減らす袋で、関節窩を広げない。"]],["烏口鎖骨靱帯がつなぐ組み合わせはどれか。",["烏口突起と肩峰","烏口突起と上腕骨","烏口突起と鎖骨","胸骨と鎖骨"],2,"烏口鎖骨靱帯は肩甲骨の烏口突起と鎖骨をつなぎ、肩鎖関節を安定させる。",["烏口突起と肩峰をつなぐのは烏口肩峰靱帯。","烏口突起と上腕骨をつなぐのは烏口上腕靱帯。","","胸骨と鎖骨をつなぐのは胸鎖靱帯。"]],["肘関節に含まれない関節はどれか。",["腕尺関節","下橈尺関節","上橈尺関節","腕橈関節"],1,"肘関節は腕尺関節・腕橈関節・上橈尺関節の3つからなる複関節。下橈尺関節は手首側にある。",["腕尺関節は肘関節の一部。","","上橈尺関節は肘関節の一部。","腕橈関節は肘関節の一部。"]],["橈骨頭を取り巻いて支える靱帯はどれか。",["尺側側副靱帯","橈骨輪状靱帯","烏口上腕靱帯","屈筋支帯"],1,"橈骨輪状靱帯は橈骨頭を輪のように囲み、尺骨につなぎとめる。",["尺側側副靱帯は肘の内側を補強する。","","烏口上腕靱帯は肩関節の靱帯。","屈筋支帯は手首の手のひら側にある。"]],["手根管の屋根をつくる靱帯はどれか。",["屈筋支帯","伸筋支帯","橈骨輪状靱帯","三角靱帯"],0,"屈筋支帯(横手根靱帯)が手根骨の上にかかり、手根管をつくる。",["","伸筋支帯は手首の手の甲側にある。","橈骨輪状靱帯は肘にある。","三角靱帯は足関節の内側にある。"]],["手根管を通る神経はどれか。",["尺骨神経","橈骨神経","筋皮神経","正中神経"],3,"正中神経は指の屈筋腱とともに手根管を通る。ここで圧迫されるのが手根管症候群。",["尺骨神経は手根管の外(ギヨン管)を通る。","橈骨神経は手根管を通らない。","筋皮神経は手根管を通らない(前腕で外側前腕皮神経になる)。",""]],["仙腸関節をつくる骨の組み合わせはどれか。",["仙骨と坐骨","仙骨と腸骨","腸骨と恥骨","仙骨と尾骨"],1,"仙腸関節は仙骨と腸骨の耳状面でできる、ほとんど動かない関節。",["仙骨と坐骨は関節しない。","","腸骨と恥骨は寛骨として癒合している。","仙骨と尾骨の連結は仙腸関節ではない。"]],["大坐骨孔を通る筋はどれか。",["梨状筋","内閉鎖筋","大殿筋","腸腰筋"],0,"梨状筋は大坐骨孔を通り、孔を上下に分ける。下を坐骨神経が通る。",["","内閉鎖筋は小坐骨孔を通る。","大殿筋は大坐骨孔を通らない。","腸腰筋は鼡径靱帯の下(筋裂孔)を通る。"]],["膝関節の外側側副靱帯がつなぐ組み合わせはどれか。",["大腿骨と腓骨頭","大腿骨と脛骨の内側","膝蓋骨と脛骨粗面","脛骨と腓骨"],0,"外側側副靱帯は大腿骨の外側上顆と腓骨頭をつなぎ、膝の外側を補強する。",["","大腿骨と脛骨の内側をつなぐのは内側側副靱帯。","膝蓋骨と脛骨粗面をつなぐのは膝蓋靱帯。","外側側副靱帯ではない。"]],["内側半月が付着している靱帯はどれか。",["外側側副靱帯","膝蓋靱帯","内側側副靱帯","腸脛靱帯"],2,"内側半月は内側側副靱帯と付着しているため動きにくく、損傷しやすい。",["外側側副靱帯は外側半月とは付着しない。","膝蓋靱帯は半月に付着しない。","","腸脛靱帯は半月に付着しない。"]],["後十字靱帯の主な働きはどれか。",["脛骨の後方へのずれを防ぐ","脛骨の前方へのずれを防ぐ","膝の内側への開きを防ぐ","膝蓋骨の外側へのずれを防ぐ"],0,"後十字靱帯は大腿骨に対して脛骨が後ろにずれるのを防ぐ。",["","脛骨の前方へのずれを防ぐのは前十字靱帯。","膝の内側が開くのを防ぐのは内側側副靱帯。","後十字靱帯の働きではない。"]],["足の縦アーチを支えるのに働くものはどれか。",["前距腓靱帯","膝蓋靱帯","足底腱膜","黄色靱帯"],2,"足底腱膜は踵骨から足趾に張り、弓の弦のように縦アーチを支える。",["前距腓靱帯は足関節の外側を補強する。","膝蓋靱帯は膝にある。","","黄色靱帯は脊柱にある。"]],["弾性線維を多く含み、黄色く見える靱帯はどれか。",["黄色靱帯","後縦靱帯","前縦靱帯","棘間靱帯"],0,"黄色靱帯は弾性線維が豊富で、上下の椎弓をつなぎ、脊柱がまっすぐに戻るのを助ける。",["","後縦靱帯は主に膠原線維でできる。","前縦靱帯は主に膠原線維でできる。","棘間靱帯は棘突起の間をつなぐ。"]],["首を左右に回す(回旋)動きの多くを担う関節はどれか。",["環椎後頭関節","顎関節","環軸関節","胸鎖関節"],2,"環軸関節は首の回旋の多くを担う。",["環椎後頭関節は主にうなずく(前後屈)動き。","顎関節は口の開閉。","","胸鎖関節は鎖骨の動き。"]],["椎間円板の中心部にあるものはどれか。",["線維輪","関節半月","関節唇","髄核"],3,"椎間円板は中心のゼリー状の髄核と、それを囲む線維輪からなる。",["線維輪は髄核を囲む外側の部分。","関節半月は膝関節にある。","関節唇は肩関節・股関節にある。",""]],["口を大きく開けたとき、下顎頭はどう動くか。",["前方へ移動する","後方へ移動する","まったく動かない","上方へ移動する"],0,"口を大きく開けると、下顎頭は回転しながら関節結節の方へ前に滑り出る。",["","後方へは移動しない。","回転と前方移動が起こる。","上方へは移動しない。"]]]},
{"id":"a3","g":"a","k":"筋","name":"筋系","q":[["筋皮神経が支配する筋はどれか。",["上腕三頭筋","上腕二頭筋","三角筋","円回内筋"],1,"上腕二頭筋は筋皮神経支配。烏口腕筋・上腕筋も同じ。",["上腕三頭筋は橈骨神経。","","三角筋は腋窩神経。","円回内筋は正中神経。"]],["回旋筋腱板(ローテーターカフ)をつくる筋はどれか。",["大円筋","棘上筋","大胸筋","広背筋"],1,"回旋筋腱板は棘上筋・棘下筋・小円筋・肩甲下筋の4つの腱でできる。",["大円筋は含まれない(小円筋と混同しやすい)。","","大胸筋は含まれない。","広背筋は含まれない。"]],["股関節を曲げる(屈曲する)主な筋はどれか。",["大殿筋","中殿筋","腸腰筋","大内転筋"],2,"腸腰筋(腸骨筋+大腰筋)は股関節の最も強い屈筋。",["大殿筋は股関節を伸ばす(伸展)。","中殿筋は脚を外へ開く(外転)。","","大内転筋は脚を閉じる(内転)。"]],["大腿四頭筋のうち、股関節と膝関節の両方をまたぐ筋はどれか。",["大腿直筋","外側広筋","内側広筋","中間広筋"],0,"大腿直筋は骨盤(下前腸骨棘)から起こるので、膝を伸ばすだけでなく股関節も曲げる。",["","外側広筋は大腿骨から起こり、膝関節だけをまたぐ。","内側広筋は大腿骨から起こり、膝関節だけをまたぐ。","中間広筋は大腿骨から起こり、膝関節だけをまたぐ。"]],["下腿三頭筋が停止する部位はどれか。",["脛骨粗面","踵骨隆起","第5中足骨粗面","距骨"],1,"腓腹筋とヒラメ筋はアキレス腱(踵骨腱)となって踵骨隆起に付く。",["脛骨粗面には大腿四頭筋が膝蓋靱帯を介して付く。","","第5中足骨粗面には短腓骨筋が付く。","距骨には筋が付かない。"]],["表情筋を支配する神経はどれか。",["三叉神経","副神経","舌下神経","顔面神経"],3,"表情筋はすべて顔面神経が支配する。",["三叉神経は咀嚼筋を支配する(運動枝は下顎神経)。","副神経は胸鎖乳突筋と僧帽筋を支配する。","舌下神経は舌の筋を支配する。",""]],["咀嚼筋はどれか。",["口輪筋","頬筋","咬筋","顎二腹筋"],2,"咀嚼筋は咬筋・側頭筋・内側翼突筋・外側翼突筋の4つ。",["口輪筋は表情筋。","頬筋は表情筋。","","顎二腹筋は舌骨上筋。"]],["横隔膜で食道が通る孔はどれか。",["大動脈裂孔","食道裂孔","大静脈孔","筋裂孔"],1,"食道は横隔膜の食道裂孔を通って腹腔へ入る。",["大動脈裂孔は大動脈と胸管が通る。","","大静脈孔は下大静脈が通る。","筋裂孔は鼡径靱帯の下にあり、腸腰筋が通る。"]],["肩甲骨を引き上げる(挙上する)筋はどれか。",["肩甲挙筋","小胸筋","前鋸筋","広背筋"],0,"肩甲挙筋は頸椎の横突起から起こり、肩甲骨の上角を引き上げる。僧帽筋上部も同じ働き。",["","小胸筋は肩甲骨を前下方に引く。","前鋸筋は肩甲骨を前に引き(外転)、上方回旋する。","広背筋は肩関節を内転・伸展する。"]],["前鋸筋を支配する神経はどれか。",["肩甲背神経","長胸神経","胸背神経","腋窩神経"],1,"前鋸筋は長胸神経が支配する。麻痺すると肩甲骨の内側縁が浮き上がる(翼状肩甲)。",["肩甲背神経は菱形筋と肩甲挙筋を支配する。","","胸背神経は広背筋を支配する。","腋窩神経は三角筋と小円筋を支配する。"]],["肩関節を外転する主な筋はどれか。",["広背筋","大胸筋","三角筋","大円筋"],2,"三角筋(中部)は肩関節を外転する主な筋。外転の初めは棘上筋も働く。",["広背筋は内転・伸展・内旋。","大胸筋は内転・屈曲・内旋。","","大円筋は内転・伸展・内旋。"]],["肘関節を伸ばす筋はどれか。",["上腕筋","腕橈骨筋","上腕二頭筋","上腕三頭筋"],3,"上腕三頭筋は肘関節を伸ばす主な筋(橈骨神経支配)。",["上腕筋は肘を曲げる。","腕橈骨筋は肘を曲げる。","上腕二頭筋は肘を曲げ、前腕を回外する。",""]],["前腕を回外する筋はどれか。",["円回内筋","方形回内筋","回外筋","長橈側手根伸筋"],2,"回外筋と上腕二頭筋が前腕を回外する。",["円回内筋は回内。","方形回内筋は回内。","","長橈側手根伸筋は手関節を背屈・橈屈する。"]],["橈骨神経が支配する筋はどれか。",["腕橈骨筋","長掌筋","母指対立筋","尺側手根屈筋"],0,"腕橈骨筋は肘を曲げる筋だが、橈骨神経支配である点に注意。",["","長掌筋は正中神経。","母指対立筋は正中神経。","尺側手根屈筋は尺骨神経。"]],["尺骨神経が支配する筋はどれか。",["橈側手根屈筋","円回内筋","尺側手根屈筋","長母指伸筋"],2,"前腕の屈筋のうち、尺側手根屈筋と深指屈筋の尺側半分が尺骨神経支配。",["橈側手根屈筋は正中神経。","円回内筋は正中神経。","","長母指伸筋は橈骨神経。"]],["母指対立筋を支配する神経はどれか。",["尺骨神経","正中神経","橈骨神経","筋皮神経"],1,"母指球の筋(短母指外転筋・母指対立筋・短母指屈筋の浅頭)は主に正中神経支配。",["尺骨神経は母指内転筋などを支配する。","","橈骨神経は手の内在筋を支配しない。","筋皮神経は手の筋を支配しない。"]],["指を広げる(外転する)筋はどれか。",["掌側骨間筋","虫様筋","背側骨間筋","母指内転筋"],2,"背側骨間筋は指を中指から遠ざける(外転)。掌側骨間筋は指を寄せる(内転)。",["掌側骨間筋は指を閉じる(内転)。","虫様筋はMP関節を曲げ、指の関節を伸ばす。","","母指内転筋は母指を寄せる。"]],["体幹を前に曲げる主な筋はどれか。",["脊柱起立筋","腰方形筋","腹直筋","大殿筋"],2,"腹直筋は恥骨から胸郭の前面へ走り、体幹を前に曲げる。",["脊柱起立筋は体幹を伸ばす(反らす)。","腰方形筋は体幹を横に曲げる。","","大殿筋は股関節を伸ばす。"]],["腹壁の筋のうち、最も深い層にあるのはどれか。",["外腹斜筋","腹横筋","内腹斜筋","腹直筋"],1,"側腹部の筋は浅い順に外腹斜筋・内腹斜筋・腹横筋。",["外腹斜筋は最も浅い層。","","内腹斜筋は中間の層。","腹直筋は前腹部を縦に走る筋。"]],["大殿筋を支配する神経はどれか。",["下殿神経","上殿神経","坐骨神経","大腿神経"],0,"大殿筋は下殿神経が支配する。",["","上殿神経は中殿筋・小殿筋・大腿筋膜張筋を支配する。","坐骨神経はハムストリングなどを支配する。","大腿神経は大腿四頭筋などを支配する。"]],["片脚立ちで反対側の骨盤が下がる(トレンデレンブルグ徴候)とき、弱っている筋はどれか。",["大腿四頭筋","腸腰筋","中殿筋","前脛骨筋"],2,"立っている脚の中殿筋が弱いと、骨盤を水平に保てず反対側が下がる。",["大腿四頭筋は膝を伸ばす筋。","腸腰筋は股関節を曲げる筋。","","前脛骨筋は足首を背屈する筋。"]],["縫工筋が起こる部位はどれか。",["上前腸骨棘","下前腸骨棘","坐骨結節","恥骨結節"],0,"縫工筋は上前腸骨棘から起こり、脛骨の内側(鵞足)に付く、人体で最も長い筋。",["","下前腸骨棘からは大腿直筋が起こる。","坐骨結節からはハムストリングが起こる。","恥骨結節は鼡径靱帯が付く部分。"]],["ハムストリングに含まれる筋はどれか。",["半腱様筋","薄筋","大腿直筋","縫工筋"],0,"ハムストリングは大腿二頭筋・半腱様筋・半膜様筋。",["","薄筋は内転筋群。","大腿直筋は大腿四頭筋の一部。","縫工筋は含まれない。"]],["鵞足をつくる筋の組み合わせはどれか。",["薄筋・大腿二頭筋・半腱様筋","縫工筋・大腿直筋・半膜様筋","縫工筋・薄筋・半腱様筋","大腿筋膜張筋・薄筋・半膜様筋"],2,"縫工筋・薄筋・半腱様筋の腱が脛骨の内側上部に並んで付き、ガチョウの足の形に見える。",["大腿二頭筋は腓骨頭に付く。","大腿直筋と半膜様筋は含まれない。","","大腿筋膜張筋と半膜様筋は含まれない。"]],["大腿神経が支配する筋はどれか。",["大腿四頭筋","大腿二頭筋","前脛骨筋","大殿筋"],0,"大腿神経は大腿四頭筋・縫工筋などを支配する。",["","大腿二頭筋は坐骨神経。","前脛骨筋は深腓骨神経。","大殿筋は下殿神経。"]],["足関節を背屈する(つま先を上げる)主な筋はどれか。",["前脛骨筋","ヒラメ筋","腓腹筋","後脛骨筋"],0,"前脛骨筋は足関節を背屈し、足を内反させる。",["","ヒラメ筋は底屈する。","腓腹筋は底屈する。","後脛骨筋は底屈・内反する。"]],["前脛骨筋を支配する神経はどれか。",["浅腓骨神経","脛骨神経","深腓骨神経","大腿神経"],2,"下腿の前面の筋(前脛骨筋・長母趾伸筋・長趾伸筋)は深腓骨神経支配。",["浅腓骨神経は長腓骨筋・短腓骨筋を支配する。","脛骨神経は下腿の後面の筋を支配する。","","大腿神経は下腿の筋を支配しない。"]],["足を外反させる筋はどれか。",["前脛骨筋","長腓骨筋","後脛骨筋","ヒラメ筋"],1,"長腓骨筋・短腓骨筋は足を外反させ、底屈も助ける。",["前脛骨筋は背屈・内反。","","後脛骨筋は底屈・内反。","ヒラメ筋は底屈。"]],["膝関節と足関節の両方をまたぐ筋はどれか。",["ヒラメ筋","腓腹筋","前脛骨筋","長腓骨筋"],1,"腓腹筋は大腿骨から起こるので、足の底屈だけでなく膝を曲げるのにも働く。",["ヒラメ筋は脛骨・腓骨から起こり、足関節だけをまたぐ。","","前脛骨筋は脛骨から起こり、足関節だけをまたぐ。","長腓骨筋は腓骨から起こり、足関節だけをまたぐ。"]],["脊柱起立筋を支配する神経はどれか。",["脊髄神経の前枝","脊髄神経の後枝","副神経","肋間神経"],1,"固有背筋(脊柱起立筋など)は脊髄神経の後枝が支配する。",["前枝は体幹の前・側面や四肢の筋を支配する。","","副神経は胸鎖乳突筋と僧帽筋を支配する。","肋間神経は胸神経の前枝で、肋間筋などを支配する。"]]]},
{"id":"a4","g":"a","k":"神","name":"神経系","q":[["外側直筋を支配し、眼球を外側へ向ける脳神経はどれか。",["動眼神経","滑車神経","顔面神経","外転神経"],3,"外転神経(第VI脳神経)は外側直筋だけを支配する。",["動眼神経は上・下・内側直筋、下斜筋、上眼瞼挙筋などを支配する。","滑車神経は上斜筋を支配する。","顔面神経は表情筋を支配する。",""]],["脊髄神経はいくつあるか。",["12対","24対","31対","33対"],2,"頸神経8・胸神経12・腰神経5・仙骨神経5・尾骨神経1の合計31対。",["12対は脳神経の数。","24対という区分はない。","","33対ではない。頸椎は7個だが、頸神経は8対ある点に注意。"]],["腕神経叢から出る神経はどれか。",["横隔神経","正中神経","大腿神経","坐骨神経"],1,"腕神経叢(C5〜T1)からは正中・尺骨・橈骨・筋皮・腋窩神経などが出る。",["横隔神経は頸神経叢から出る。","","大腿神経は腰神経叢から出る。","坐骨神経は仙骨神経叢から出る。"]],["脳脊髄液をつくる部位はどれか。",["くも膜顆粒","脈絡叢","硬膜","松果体"],1,"脳脊髄液は脳室の脈絡叢でつくられ、くも膜下腔を流れる。",["くも膜顆粒は脳脊髄液を静脈(硬膜静脈洞)へ戻す、吸収の場。","","硬膜は脳を包む最も外側の膜。","松果体はメラトニンを分泌する。"]],["交感神経の節前ニューロンの細胞体があるのはどこか。",["脳幹","仙髄","胸髄と上部の腰髄","脊髄の前角"],2,"交感神経は胸髄〜上部腰髄の側角から出る(胸腰系)。",["脳幹から出る自律神経は副交感神経(III・VII・IX・X)。","仙髄から出るのは副交感神経。","","前角には骨格筋を動かす運動ニューロンがある。"]],["中枢神経で髄鞘をつくる細胞はどれか。",["シュワン細胞","稀突起膠細胞(オリゴデンドロサイト)","星状膠細胞(アストロサイト)","小膠細胞(ミクログリア)"],1,"中枢神経の髄鞘は稀突起膠細胞が、末梢神経の髄鞘はシュワン細胞がつくる。",["シュワン細胞は末梢神経の髄鞘をつくる。","","星状膠細胞は神経細胞を支え、血液脳関門に関わる。","小膠細胞は異物を取り込む(食作用)。"]],["脳脊髄膜のうち、最も内側で脳の表面に密着する膜はどれか。",["軟膜","くも膜","硬膜","骨膜"],0,"脳脊髄膜は外側から硬膜・くも膜・軟膜の順。軟膜は脳の表面にぴったり付く。",["","くも膜は中間。","硬膜は最も外側。","骨膜は脳脊髄膜ではない。"]],["脳脊髄液が流れる空間はどれか。",["硬膜外腔","硬膜下腔","胸膜腔","くも膜下腔"],3,"脳脊髄液はくも膜と軟膜の間のくも膜下腔を流れ、脳と脊髄を守る。",["硬膜外腔は脊柱管で硬膜の外側にあり、脂肪や静脈がある。","硬膜下腔には脳脊髄液は流れない。","胸膜腔は肺の周りの空間。",""]],["一次運動野がある部位はどれか。",["上側頭回","中心後回","中心前回","後頭葉"],2,"中心溝のすぐ前の中心前回に一次運動野がある。",["上側頭回には聴覚野がある。","中心後回には一次体性感覚野がある。","","後頭葉には視覚野がある。"]],["視覚野がある大脳の葉はどれか。",["前頭葉","頭頂葉","側頭葉","後頭葉"],3,"視覚野は後頭葉(鳥距溝の周り)にある。",["前頭葉には運動野などがある。","頭頂葉には体性感覚野などがある。","側頭葉には聴覚野などがある。",""]],["運動性言語中枢(ブローカ野)がある大脳の葉はどれか。",["側頭葉","頭頂葉","前頭葉","後頭葉"],2,"ブローカ野は前頭葉にあり、損傷すると話すことが難しくなる(運動性失語)。",["側頭葉にあるのは感覚性言語中枢(ウェルニッケ野)。","頭頂葉にはない。","","後頭葉には視覚野がある。"]],["間脳に含まれるのはどれか。",["視床","中脳","橋","延髄"],0,"間脳は視床と視床下部などからなる。",["","中脳は脳幹。","橋は脳幹。","延髄は脳幹。"]],["脳幹に含まれないものはどれか。",["中脳","橋","延髄","小脳"],3,"脳幹は中脳・橋・延髄からなる。小脳は脳幹の後ろにあるが、脳幹には含めない。",["中脳は脳幹の一部。","橋は脳幹の一部。","延髄は脳幹の一部。",""]],["中脳水道がつないでいる部位はどれか。",["左右の側脳室","側脳室と第3脳室","第3脳室と第4脳室","第4脳室とくも膜下腔"],2,"中脳水道は中脳の中を通り、第3脳室と第4脳室をつなぐ。",["左右の側脳室は直接はつながらない。","側脳室と第3脳室は室間孔でつながる。","","第4脳室とくも膜下腔は正中口・外側口でつながる。"]],["脊髄の後根を通る線維はどれか。",["感覚(求心性)線維","運動(遠心性)線維","交感神経の節後線維","副交感神経の節後線維"],0,"後根は感覚線維、前根は運動線維が通る(ベル・マジャンディの法則)。",["","運動線維は前根を通る。","節後線維は後根を通らない。","節後線維は後根を通らない。"]],["錐体路(皮質脊髄路)の大部分が左右に交叉する部位はどれか。",["延髄","橋","中脳","脊髄"],0,"錐体路の線維の大部分は延髄の下部(錐体交叉)で反対側へ移る。",["","橋では交叉しない。","中脳では交叉しない。","交叉しなかった一部の線維は脊髄で交叉するが、大部分は延髄。"]],["舌の前3分の2の味覚を伝える脳神経はどれか。",["三叉神経","顔面神経","舌咽神経","舌下神経"],1,"舌の前3分の2の味覚は顔面神経(鼓索神経)が伝える。",["三叉神経は舌の前3分の2の一般感覚(触覚など)を伝える。","","舌咽神経は舌の後ろ3分の1の味覚を伝える。","舌下神経は舌を動かす運動神経。"]],["顔の皮膚の感覚を伝える脳神経はどれか。",["顔面神経","三叉神経","舌咽神経","迷走神経"],1,"三叉神経は眼神経・上顎神経・下顎神経の3枝で顔の感覚を伝える。",["顔面神経は表情筋を動かす(顔の皮膚感覚は伝えない)。","","舌咽神経は咽頭や舌の後部の感覚。","迷走神経は内臓の感覚など。"]],["胸部・腹部の内臓に広く分布する脳神経はどれか。",["迷走神経","舌咽神経","副神経","舌下神経"],0,"迷走神経(第X脳神経)は頸部から胸腹部の内臓まで広く分布する副交感神経を含む。",["","舌咽神経は咽頭・舌の後部などに分布する。","副神経は胸鎖乳突筋と僧帽筋を支配する。","舌下神経は舌の筋を支配する。"]],["舌の筋を動かす脳神経はどれか。",["舌咽神経","顔面神経","舌下神経","三叉神経"],2,"舌下神経(第XII脳神経)が舌の筋を支配する。",["舌咽神経は舌の後部の感覚や味覚。","顔面神経は舌の前部の味覚。","","三叉神経は咀嚼筋などを支配する。"]],["瞳孔を小さくする副交感神経の線維を含む脳神経はどれか。",["動眼神経","顔面神経","舌咽神経","迷走神経"],0,"動眼神経の副交感線維が瞳孔括約筋と毛様体筋を支配する。",["","顔面神経の副交感線維は涙腺・顎下腺・舌下腺へ。","舌咽神経の副交感線維は耳下腺へ。","迷走神経の副交感線維は胸腹部の内臓へ。"]],["耳下腺の分泌に関わる副交感神経の線維を含む脳神経はどれか。",["顔面神経","舌咽神経","動眼神経","副神経"],1,"耳下腺は舌咽神経の副交感線維が支配する。",["顔面神経は顎下腺・舌下腺・涙腺を支配する。","","動眼神経は瞳孔と毛様体筋。","副神経に副交感線維はない。"]],["頸神経叢の枝はどれか。",["長胸神経","大後頭神経","小後頭神経","肩甲上神経"],2,"小後頭神経は頸神経叢の皮枝で、耳の後ろの皮膚に分布する。",["長胸神経は腕神経叢の枝。","大後頭神経は第2頸神経の後枝で、神経叢には含まれない。","","肩甲上神経は腕神経叢の枝。"]],["上腕骨の後面を、骨に沿ってらせん状に走る神経はどれか。",["腋窩神経","尺骨神経","正中神経","橈骨神経"],3,"橈骨神経は上腕骨の橈骨神経溝に沿って走るため、上腕骨の骨折で傷つきやすい。",["腋窩神経は上腕骨の外科頸の周りを回る。","尺骨神経は内側上顆の後ろを通る。","正中神経は上腕の内側を下る。",""]],["腰神経叢から出る神経はどれか。",["閉鎖神経","陰部神経","上殿神経","坐骨神経"],0,"閉鎖神経は腰神経叢から出て、閉鎖孔を通り大腿の内転筋群を支配する。",["","陰部神経は仙骨神経叢から出る。","上殿神経は仙骨神経叢から出る。","坐骨神経は仙骨神経叢から出る。"]],["坐骨神経が分かれてできる2つの神経はどれか。",["上殿神経と下殿神経","大腿神経と閉鎖神経","脛骨神経と伏在神経","脛骨神経と総腓骨神経"],3,"坐骨神経はふつう膝窩の上で脛骨神経と総腓骨神経に分かれる。",["上殿神経と下殿神経は仙骨神経叢の枝で、坐骨神経の枝ではない。","大腿神経と閉鎖神経は腰神経叢の枝。","伏在神経は大腿神経の枝。",""]],["腓骨頭のすぐ下を回り込み、圧迫されると下垂足を起こす神経はどれか。",["脛骨神経","大腿神経","総腓骨神経","伏在神経"],2,"総腓骨神経は腓骨頭の下で皮膚の近くを通るため、圧迫で麻痺しやすい。足を上げられなくなる(下垂足)。",["脛骨神経は膝窩の中央を下る。","大腿神経は大腿の前面にある。","","伏在神経は下腿の内側の皮膚感覚。"]],["仙髄から出る副交感神経はどれか。",["大内臓神経","迷走神経","陰部神経","骨盤内臓神経"],3,"骨盤内臓神経(S2〜S4)は膀胱・直腸・生殖器などに分布する副交感神経。",["大内臓神経は交感神経。","迷走神経は脳幹から出る。","陰部神経は会陰の感覚と運動を担う体性神経。",""]],["交感神経の節前線維が、脊髄神経から交感神経幹へ入るときに通る部分はどれか。",["後根","灰白交通枝","白交通枝","後枝"],2,"節前線維は有髄なので白く見え、白交通枝を通って交感神経幹へ入る。",["後根は感覚線維の通り道。","灰白交通枝は無髄の節後線維が脊髄神経へ戻る道。","","後枝は背部の筋と皮膚に分布する枝。"]],["脊髄の灰白質の前角にある細胞はどれか。",["後根神経節の感覚ニューロン","運動ニューロン","交感神経の節前ニューロン","稀突起膠細胞"],1,"前角には骨格筋を動かす運動ニューロン(α・γ運動ニューロン)の細胞体がある。",["感覚ニューロンの細胞体は脊髄の外の後根神経節にある。","","交感神経の節前ニューロンは側角にある。","稀突起膠細胞は神経細胞ではない(髄鞘をつくる細胞)。"]]]},
{"id":"a5","g":"a","k":"循","name":"循環器系","q":[["左心房と左心室の間にある弁はどれか。",["三尖弁","大動脈弁","僧帽弁","肺動脈弁"],2,"僧帽弁(二尖弁)は左心房と左心室の間にあり、血液の逆流を防ぐ。",["三尖弁は右心房と右心室の間。","大動脈弁は左心室と大動脈の間。","","肺動脈弁は右心室と肺動脈の間。"]],["冠状動脈が起こる部位はどれか。",["上行大動脈の起始部","大動脈弓","下行大動脈","肺動脈"],0,"左右の冠状動脈は大動脈弁のすぐ上(上行大動脈の根もと)から出て、心臓を養う。",["","大動脈弓からは腕頭動脈・左総頸動脈・左鎖骨下動脈が出る。","下行大動脈からは肋間動脈などが出る。","肺動脈は静脈血を肺へ送る血管。"]],["大動脈弓から直接出る動脈はどれか。",["右鎖骨下動脈","左鎖骨下動脈","右総頸動脈","椎骨動脈"],1,"大動脈弓からは、腕頭動脈・左総頸動脈・左鎖骨下動脈の3本が出る。",["右鎖骨下動脈は腕頭動脈から分かれる。","","右総頸動脈は腕頭動脈から分かれる。","椎骨動脈は鎖骨下動脈の枝。"]],["門脈に注ぐ静脈はどれか。",["腎静脈","肝静脈","奇静脈","脾静脈"],3,"門脈は脾静脈・上腸間膜静脈などが合流してでき、肝臓へ入る。",["腎静脈は下大静脈に注ぐ。","肝静脈は肝臓から出て下大静脈に注ぐ。","奇静脈は上大静脈に注ぐ。",""]],["胸管が注ぐ部位はどれか。",["右静脈角","左静脈角","上大静脈","下大静脈"],1,"胸管は下半身と左上半身のリンパを集め、左静脈角(左内頸静脈と左鎖骨下静脈の合流部)に注ぐ。",["右静脈角には右リンパ本幹が注ぐ。","","上大静脈には直接注がない。","下大静脈には注がない。"]],["心尖の位置はおよそどこか。",["右第5肋間で鎖骨中線上","左第5肋間で鎖骨中線のやや内側","左第2肋間の胸骨のすぐ横","剣状突起の真下"],1,"心尖は左第5肋間、鎖骨中線のやや内側にあり、ここで心尖拍動を触れる。",["心臓の多くは正中より左にある。","","左第2肋間の胸骨のすぐ横は肺動脈弁の音を聴く位置。","心尖ではない。"]],["心臓の壁の3層のうち、最も厚いのはどれか。",["心内膜","心膜腔","心外膜","心筋層"],3,"心臓の壁は内側から心内膜・心筋層・心外膜。心筋層が最も厚い。",["心内膜は内側を覆う薄い膜。","心膜腔は層ではなく、心膜の間のすき間。","心外膜は外側を覆う薄い膜(臓側心膜)。",""]],["心臓の4つの部屋のうち、壁が最も厚いのはどれか。",["右心房","左心室","右心室","左心房"],1,"左心室は全身へ血液を送り出すため、壁が最も厚い。",["心房の壁は薄い。","","右心室は肺へ送るだけなので左心室より薄い。","心房の壁は薄い。"]],["肺静脈が注ぐ部屋はどれか。",["右心房","左心室","右心室","左心房"],3,"肺で酸素を受け取った血液は、肺静脈を通って左心房に戻る。",["右心房には上・下大静脈が注ぐ。","左心室からは大動脈が出る。","右心室からは肺動脈が出る。",""]],["冠状静脈洞が開く部屋はどれか。",["左心室","左心房","右心室","右心房"],3,"心臓の静脈血は冠状静脈洞に集まり、右心房に注ぐ。",["左心室ではない。","左心房ではない。","右心室ではない。",""]],["腱索がつないでいるものはどれか。",["心房と心室","動脈弁と乳頭筋","房室弁と乳頭筋","大動脈と肺動脈"],2,"腱索は房室弁(僧帽弁・三尖弁)と乳頭筋をつなぎ、弁が心房側へめくれるのを防ぐ。",["心房と心室をつなぐものではない。","動脈弁(大動脈弁・肺動脈弁)には腱索はない。","","大動脈と肺動脈をつなぐものではない。"]],["胎児の心臓で、卵円孔がつないでいるのはどれか。",["肺動脈と大動脈","右心室と左心室","右心房と左心房","臍静脈と下大静脈"],2,"卵円孔は胎児の右心房と左心房の間の孔で、生まれた後に閉じて卵円窩になる。",["肺動脈と大動脈をつなぐのは動脈管。","左右の心室の間は通常つながっていない。","","臍静脈と下大静脈をつなぐのは静脈管。"]],["胎児の動脈管がつないでいるのはどれか。",["右心房と左心房","肺動脈と大動脈","臍静脈と門脈","大動脈と上大静脈"],1,"動脈管は肺動脈と大動脈をつなぎ、使われていない肺を避けて血液を流す。生後に閉じて動脈管索になる。",["右心房と左心房の間は卵円孔。","","臍静脈と門脈をつなぐ管ではない。","大動脈と上大静脈はつながらない。"]],["胎児で、胎盤から酸素の多い血液を運ぶ血管はどれか。",["臍動脈","臍静脈","肺動脈","肺静脈"],1,"臍静脈(1本)が胎盤から酸素と栄養の多い血液を胎児へ運ぶ。",["臍動脈(2本)は胎児から胎盤へ血液を戻す。","","胎児の肺動脈の血液の多くは動脈管へ流れる。","胎児の肺はガス交換をしない。"]],["動脈の壁で、平滑筋が多く最も厚い層はどれか。",["内膜","中膜","外膜","弁"],1,"動脈の中膜は平滑筋と弾性線維が多く、血管の太さを調節する。",["内膜は内皮細胞で覆われた薄い層。","","外膜は結合組織の層。","弁は層ではない。"]],["四肢の静脈にみられ、動脈にはない構造はどれか。",["弾性板","内皮細胞","平滑筋","静脈弁"],3,"四肢の静脈には静脈弁があり、血液の逆流を防ぐ。",["弾性板は動脈によく発達している。","内皮細胞は動脈にもある。","平滑筋は動脈にもある。",""]],["外頸動脈の枝はどれか。",["眼動脈","顔面動脈","前大脳動脈","椎骨動脈"],1,"外頸動脈は顔面動脈・浅側頭動脈・顎動脈などを出し、顔や頭の表面を養う。",["眼動脈は内頸動脈の枝。","","前大脳動脈は内頸動脈の枝。","椎骨動脈は鎖骨下動脈の枝。"]],["脳底動脈をつくる血管はどれか。",["左右の内頸動脈","左右の椎骨動脈","左右の外頸動脈","左右の総頸動脈"],1,"左右の椎骨動脈が橋の下で合流し、脳底動脈になる。",["内頸動脈は大脳動脈輪に加わるが、脳底動脈はつくらない。","","外頸動脈は脳に入らない。","総頸動脈は首で内頸・外頸動脈に分かれる。"]],["鎖骨下動脈が第1肋骨の外側縁を越えると、名前は何に変わるか。",["橈骨動脈","上腕動脈","腋窩動脈","腕頭動脈"],2,"鎖骨下動脈→腋窩動脈→上腕動脈と名前が変わる。",["橈骨動脈は上腕動脈の枝。","上腕動脈は腋窩動脈の続き。","","腕頭動脈は大動脈弓から出る。"]],["上腕動脈が肘の下で分かれてできる2本の動脈はどれか。",["橈骨動脈と尺骨動脈","腋窩動脈と上腕深動脈","前骨間動脈と後骨間動脈","浅掌動脈弓と深掌動脈弓"],0,"上腕動脈は肘窩の下で橈骨動脈と尺骨動脈に分かれる。",["","腋窩動脈は上腕動脈より上流。","骨間動脈は尺骨動脈の枝。","掌動脈弓は手のひらにある。"]],["腹腔動脈の枝はどれか。",["脾動脈","腎動脈","上腸間膜動脈","精巣動脈"],0,"腹腔動脈は左胃動脈・総肝動脈・脾動脈の3本に分かれる。",["","腎動脈は腹大動脈から直接出る。","上腸間膜動脈は腹大動脈から直接出る。","精巣動脈は腹大動脈から直接出る。"]],["外腸骨動脈が鼡径靱帯の下をくぐると、名前は何に変わるか。",["内腸骨動脈","大腿動脈","膝窩動脈","大腿深動脈"],1,"外腸骨動脈は鼡径靱帯の下を通ると大腿動脈になる。",["内腸骨動脈は骨盤内を養う別の枝。","","膝窩動脈は大腿動脈の続き。","大腿深動脈は大腿動脈の枝。"]],["足背動脈は、どの動脈が続いたものか。",["後脛骨動脈","腓骨動脈","前脛骨動脈","大腿深動脈"],2,"前脛骨動脈が足首を越えて足背動脈になる。",["後脛骨動脈は内果の後ろを通り、足底へ向かう。","腓骨動脈は後脛骨動脈の枝。","","大腿深動脈は大腿を養う。"]],["大伏在静脈が注ぐ静脈はどれか。",["膝窩静脈","大腿静脈","外腸骨静脈","下大静脈"],1,"大伏在静脈は下肢の内側を上り、鼡径部で大腿静脈に注ぐ。",["膝窩静脈に注ぐのは小伏在静脈。","","外腸骨静脈には直接注がない。","下大静脈には直接注がない。"]],["上大静脈をつくる静脈はどれか。",["左右の腕頭静脈","左右の内頸静脈","左右の鎖骨下静脈","奇静脈と半奇静脈"],0,"左右の腕頭静脈が合流して上大静脈になる。",["","内頸静脈は鎖骨下静脈と合流して腕頭静脈になる。","鎖骨下静脈は内頸静脈と合流して腕頭静脈になる。","奇静脈は上大静脈に注ぐが、上大静脈をつくる本流ではない。"]],["脾臓の働きはどれか。",["古くなった赤血球を壊す","インスリンを分泌する","胆汁をつくる","尿をつくる"],0,"脾臓は古い赤血球を壊し、リンパ球による免疫にも働く。",["","インスリンは膵臓。","胆汁は肝臓でつくられる。","尿は腎臓でつくられる。"]],["胸腺で成熟するリンパ球はどれか。",["T細胞","B細胞","NK細胞","形質細胞"],0,"T細胞は骨髄でつくられ、胸腺で成熟する(TはThymus=胸腺の頭文字)。",["","B細胞は骨髄で成熟する。","NK細胞は胸腺で成熟するリンパ球ではない。","形質細胞はB細胞が変化した細胞。"]],["肺循環で、酸素を多く含む血液が流れる血管はどれか。",["肺静脈","肺動脈","上大静脈","門脈"],0,"肺で酸素を受け取った血液は肺静脈を流れる。肺循環では動脈に静脈血、静脈に動脈血が流れる。",["","肺動脈には酸素の少ない血液が流れる。","上大静脈は全身からの静脈血。","門脈は消化管からの静脈血。"]],["前室間枝を出す動脈はどれか。",["右冠状動脈","内胸動脈","左冠状動脈","肺動脈"],2,"左冠状動脈は前室間枝(前下行枝)と回旋枝に分かれる。",["右冠状動脈は主に右心室などを養い、後室間枝を出すことが多い。","内胸動脈は胸壁の前面を下る。","","肺動脈は心臓を養わない。"]],["大腿動脈の続きで、膝の裏を走る動脈はどれか。",["腓骨動脈","前脛骨動脈","後脛骨動脈","膝窩動脈"],3,"大腿動脈は内転筋管を通って膝の裏へ出ると膝窩動脈になる。",["腓骨動脈は後脛骨動脈の枝。","前脛骨動脈は膝窩動脈の枝。","後脛骨動脈は膝窩動脈の枝。",""]]]},
{"id":"a6","g":"a","k":"呼","name":"呼吸器系","q":[["右肺の肺葉の数はどれか。",["2葉","3葉","4葉","5葉"],1,"右肺は上葉・中葉・下葉の3葉。左肺は上葉・下葉の2葉。",["2葉は左肺。","","4葉ではない。","5葉は左右の合計。"]],["右主気管支の特徴はどれか。",["左より細く長い","左より太く短く、傾斜が急","左より細く、水平に近い","左右で差はない"],1,"右主気管支は太く短く、垂直に近い。そのため誤って吸い込んだ異物は右に入りやすい。",["細く長いのは左主気管支。","","水平に近いのは左主気管支。","左右で形が違う。"]],["声帯がある器官はどれか。",["咽頭","鼻腔","気管","喉頭"],3,"声帯(声帯ひだ)は喉頭にあり、甲状軟骨の内側に位置する。",["咽頭は食べ物と空気の共通の通り道。","鼻腔は空気を温め、湿らせる。","気管は喉頭に続く管。",""]],["ガス交換が行われる場所はどれか。",["気管","終末細気管支","胸膜腔","肺胞"],3,"肺胞の壁と毛細血管の間で、酸素と二酸化炭素が交換される。",["気管は空気の通り道。","終末細気管支は空気を運ぶ部分で、ガス交換はしない。","胸膜腔は胸膜の間のすき間。",""]],["横隔膜を支配する神経はどれか。",["迷走神経","肋間神経","副神経","横隔神経"],3,"横隔神経(C3〜C5、主にC4)が横隔膜を動かす。",["迷走神経は内臓に分布する副交感神経。","肋間神経は肋間筋を支配する。","副神経は胸鎖乳突筋と僧帽筋を支配する。",""]],["副鼻腔はどれか。",["鼻涙管","上顎洞","耳管","鼓室"],1,"副鼻腔は上顎洞・前頭洞・篩骨洞・蝶形骨洞の4つ。上顎洞が最も大きい。",["鼻涙管は涙の通り道。","","耳管は中耳と咽頭をつなぐ管。","鼓室は中耳の空間。"]],["鼻腔の外側の壁から突き出る、3つのひだ状の構造はどれか。",["鼻中隔","鼻甲介","声帯ひだ","口蓋垂"],1,"上・中・下の鼻甲介が鼻腔の表面積を広げ、空気を温め湿らせる。",["鼻中隔は鼻腔を左右に分ける壁。","","声帯ひだは喉頭にある。","口蓋垂は口の奥に垂れ下がる部分。"]],["においを感じる受容器がある部位はどれか。",["鼻腔の天井付近","下鼻道","咽頭","喉頭"],0,"嗅上皮は鼻腔の天井付近(上鼻甲介の周り)にあり、嗅神経が篩板を通って脳へ向かう。",["","下鼻道には鼻涙管が開く。","咽頭に嗅覚の受容器はない。","喉頭に嗅覚の受容器はない。"]],["耳管が開口する部位はどれか。",["咽頭鼻部","咽頭口部","咽頭喉頭部","喉頭"],0,"耳管は咽頭鼻部(上咽頭)の側壁に開き、中耳の気圧を外と同じに保つ。",["","咽頭口部は口の奥の部分。","咽頭喉頭部は喉頭の後ろの部分。","喉頭には開かない。"]],["喉頭の軟骨のうち、完全な輪の形をしているのはどれか。",["輪状軟骨","甲状軟骨","披裂軟骨","喉頭蓋軟骨"],0,"輪状軟骨は喉頭の軟骨で唯一、完全な輪の形をしており、下に気管が続く。",["","甲状軟骨は前が出っ張った板状で、後ろは開いている。","披裂軟骨は小さな三角錐状で、声帯を動かす。","喉頭蓋軟骨は木の葉の形。"]],["飲み込むとき、喉頭の入り口をふさぐ構造はどれか。",["口蓋垂","軟口蓋","声帯ひだ","喉頭蓋"],3,"喉頭蓋は飲み込むときに喉頭の入り口にふたをし、食べ物が気管へ入るのを防ぐ。",["口蓋垂は鼻への通り道をふさぐのを助ける。","軟口蓋は鼻咽頭への通り道をふさぐ。","声帯ひだは発声に働く。",""]],["喉頭の筋(声帯を動かす筋)を支配する神経はどれか。",["舌下神経","顔面神経","反回神経","横隔神経"],2,"反回神経は迷走神経の枝で、喉頭の筋の大部分を支配する。傷つくと声がかすれる。",["舌下神経は舌の筋を支配する。","顔面神経は表情筋を支配する。","","横隔神経は横隔膜を支配する。"]],["気管軟骨の形はどれか。",["完全な輪の形","後ろが開いたU字形","前が開いたU字形","1枚の板状"],1,"気管軟骨は後ろが開いたU字形で、後壁は平滑筋などの膜でできて食道と接する。",["完全な輪は輪状軟骨。","","前が開いているのではない。","板状ではない。"]],["左肺にあって、右肺にない構造はどれか。",["水平裂","心切痕","斜裂","肺門"],1,"左肺は心臓がある分だけ前縁がくぼみ(心切痕)、その下に小舌がある。",["水平裂は右肺だけにある。","","斜裂は左右どちらにもある。","肺門は左右どちらにもある。"]],["肺門を通るものはどれか。",["肺動脈","胸管","食道","横隔神経"],0,"肺門を通って、主気管支・肺動脈・肺静脈・気管支動脈・神経などが出入りする。",["","胸管は縦隔を通る。","食道は縦隔を通り、肺門には入らない。","横隔神経は肺門の前を通り、肺門には入らない。"]],["肺そのものを養う(栄養血管となる)動脈はどれか。",["肺動脈","肋間動脈","気管支動脈","内胸動脈"],2,"気管支動脈が肺の組織に酸素と栄養を送る。肺動脈はガス交換のための血管(機能血管)。",["肺動脈はガス交換に使う血液を運ぶ(機能血管)。","肋間動脈は胸壁を養う。","","内胸動脈は胸壁の前面を養う。"]],["肺の表面を直接覆う膜はどれか。",["壁側胸膜","心膜","臓側胸膜","腹膜"],2,"臓側胸膜(肺胸膜)が肺の表面を覆い、肺門で折り返して壁側胸膜になる。",["壁側胸膜は胸壁の内面や横隔膜の上面を覆う。","心膜は心臓を包む。","","腹膜は腹部の臓器を包む。"]],["肺胞で表面活性物質(サーファクタント)をつくる細胞はどれか。",["I型肺胞上皮細胞","肺胞マクロファージ","II型肺胞上皮細胞","杯細胞"],2,"II型肺胞上皮細胞がサーファクタントを分泌し、肺胞がしぼむのを防ぐ。",["I型肺胞上皮細胞は薄く平らで、ガス交換の場をつくる。","肺胞マクロファージは異物を取り込む。","","杯細胞は気道で粘液を分泌する。"]],["気管の内面を覆う上皮はどれか。",["多列線毛上皮","単層扁平上皮","重層扁平上皮","移行上皮"],0,"気管・気管支は多列線毛上皮で覆われ、線毛の動きでほこりなどを喉へ送り出す。",["","単層扁平上皮は肺胞や血管の内面など。","重層扁平上皮は皮膚や食道など。","移行上皮は膀胱や尿管など。"]],["縦隔にないものはどれか。",["心臓","食道","肺","気管"],2,"縦隔は左右の肺(胸膜腔)の間の空間で、心臓・食道・気管・大血管などがある。",["心臓は縦隔にある。","食道は縦隔にある。","","気管は縦隔にある。"]],["肺尖の位置はどこか。",["鎖骨よりやや上","第4肋骨の高さ","剣状突起の高さ","横隔膜のすぐ上"],0,"肺尖は鎖骨より少し上まで出ている。",["","第4肋骨より上にある。","剣状突起の高さは肺の下部。","横隔膜のすぐ上は肺底。"]],["右肺の上葉と中葉を分ける裂はどれか。",["斜裂","肺門","心切痕","水平裂"],3,"右肺は水平裂で上葉と中葉に、斜裂で中葉(と上葉)と下葉に分かれる。",["斜裂は下葉とその上の葉を分ける。","肺門は血管などの出入り口。","心切痕は左肺のくぼみ。",""]],["気道の順序として正しいのはどれか。",["主気管支→気管→葉気管支→区域気管支","気管→葉気管支→主気管支→区域気管支","気管→区域気管支→葉気管支→主気管支","気管→主気管支→葉気管支→区域気管支"],3,"気道は気管→主気管支→葉気管支→区域気管支→細気管支…と枝分かれしていく。",["気管が主気管支より先。","主気管支が葉気管支より先。","区域気管支は葉気管支の先。",""]],["左右の声帯ひだの間のすき間はどれか。",["前庭裂","声門裂","梨状陥凹","喉頭口"],1,"声門裂は左右の声帯ひだの間のすき間で、ここを息が通るときに声が出る。",["前庭裂は声帯ひだの上の前庭ひだの間。","","梨状陥凹は喉頭の両脇のくぼみで、咽頭にある。","喉頭口は喉頭の入り口。"]],["胸郭をつくらない骨はどれか。",["鎖骨","肋骨","胸骨","胸椎"],0,"胸郭は12個の胸椎・12対の肋骨・1個の胸骨でできる。",["","肋骨は胸郭の一部。","胸骨は胸郭の一部。","胸椎は胸郭の一部。"]],["横隔膜の右側が左側より高い主な理由はどれか。",["下に肝臓があるため","上に心臓があるため","右肺が小さいため","右側の筋が厚いため"],0,"右側の横隔膜は下にある肝臓に押し上げられ、左より高い。",["","心臓は左寄りにあり、左側をむしろ押し下げる。","右肺は左肺より大きい。","理由ではない。"]],["咽頭扁桃(アデノイド)がある部位はどれか。",["咽頭の上壁","口蓋の両脇","舌の付け根","喉頭の中"],0,"咽頭扁桃は咽頭鼻部の上壁(後上壁)にある。",["","口蓋の両脇にあるのは口蓋扁桃。","舌の付け根にあるのは舌扁桃。","喉頭の中に扁桃はない。"]],["喉頭隆起(のどぼとけ)をつくる軟骨はどれか。",["甲状軟骨","輪状軟骨","披裂軟骨","気管軟骨"],0,"甲状軟骨は喉頭で最も大きい軟骨で、前に突き出た部分が喉頭隆起。",["","輪状軟骨は甲状軟骨の下にある。","披裂軟骨は喉頭の後ろにある小さな軟骨。","気管軟骨は喉頭の下に続く。"]],["胸膜腔の中にあるものはどれか。",["少量の漿液","空気","血液","脳脊髄液"],0,"胸膜腔には少量の漿液があり、呼吸のときの摩擦を減らす。",["","空気は正常では入っていない(入ると気胸)。","血液は正常では入っていない。","脳脊髄液は脳と脊髄の周り。"]],["鼻腔を左右に分ける壁はどれか。",["篩板","鼻甲介","口蓋","鼻中隔"],3,"鼻中隔は軟骨と骨(篩骨・鋤骨)でできた壁で、鼻腔を左右に分ける。",["篩板は鼻腔の天井で、嗅神経が通る。","鼻甲介は鼻腔の外側の壁から突き出るひだ。","口蓋は鼻腔の床(口との境)。",""]]]},
{"id":"a7","g":"a","k":"消","name":"消化器系","q":[["胃に続く小腸の最初の部分はどれか。",["空腸","回腸","十二指腸","盲腸"],2,"小腸は十二指腸→空腸→回腸の順に続く。",["空腸は十二指腸の次。","回腸は小腸の最後で、大腸につながる。","","盲腸は大腸の最初の部分。"]],["総胆管と膵管が開口する部位はどれか。",["大十二指腸乳頭","小十二指腸乳頭","幽門","回盲口"],0,"総胆管と膵管は合流し、十二指腸下行部の大十二指腸乳頭(ファーター乳頭)に開く。",["","小十二指腸乳頭には副膵管が開く。","幽門は胃の出口。","回盲口は回腸と大腸の境。"]],["腹膜後器官はどれか。",["膵臓","空腸","横行結腸","胃"],0,"膵臓は後腹壁に固定された腹膜後器官。腎臓や十二指腸の大部分も同じ。",["","空腸は腸間膜をもつ腹膜内器官。","横行結腸は結腸間膜をもつ腹膜内器官。","胃は腹膜に包まれた腹膜内器官。"]],["耳下腺管が開口する部位はどれか。",["舌下小丘","上顎第2大臼歯に向かい合う頬の粘膜","舌下ひだ","口蓋扁桃のそば"],1,"耳下腺管は咬筋の表面を通って頬筋を貫き、上顎第2大臼歯の向かいの頬粘膜に開く。",["舌下小丘には顎下腺管と大舌下腺管が開く。","","舌下ひだには小舌下腺管が開く。","口蓋扁桃のそばには開かない。"]],["肝門を通らないものはどれか。",["門脈","肝静脈","肝管","固有肝動脈"],1,"肝静脈は肝臓の後面から出て、直接下大静脈に注ぐ。肝門は通らない。",["門脈は肝門から肝臓に入る。","","肝管は肝門から出る。","固有肝動脈は肝門から肝臓に入る。"]],["永久歯の数(親知らずを含む)はどれか。",["20本","28本","32本","36本"],2,"永久歯は上下左右8本ずつで計32本。乳歯は20本。",["20本は乳歯の数。","28本は親知らず(第3大臼歯)を除いた数。","","36本ではない。"]],["歯で最も硬い部分はどれか。",["象牙質","エナメル質","セメント質","歯髄"],1,"エナメル質は歯冠の表面を覆い、人体で最も硬い組織。",["象牙質は歯の大部分をつくるが、エナメル質より柔らかい。","","セメント質は歯根の表面を覆う。","歯髄は歯の中心の神経や血管がある部分。"]],["最も大きい唾液腺はどれか。",["口唇腺","顎下腺","舌下腺","耳下腺"],3,"耳下腺は耳の前下方にある最大の唾液腺。",["口唇腺は小さな唾液腺。","顎下腺は耳下腺より小さい。","舌下腺は三大唾液腺で最も小さい。",""]],["食道の筋層の特徴として正しいのはどれか。",["全体が平滑筋","全体が横紋筋","上部は横紋筋、下部は平滑筋","上部は平滑筋、下部は横紋筋"],2,"食道の上部は横紋筋、下部は平滑筋で、中部は両方が混じる。",["上部は横紋筋。","下部は平滑筋。","","逆。"]],["胃の入り口の部分はどれか。",["噴門","幽門","胃底","胃角"],0,"噴門は食道から胃への入り口、幽門は胃から十二指腸への出口。",["","幽門は胃の出口。","胃底は噴門より上にふくらんだ部分。","胃角は小弯の折れ曲がった部分。"]],["胃の筋層の特徴はどれか。",["1層","2層","3層","横紋筋でできている"],2,"胃の筋層は内斜走・中輪走・外縦走の3層。ほかの消化管は内輪・外縦の2層が基本。",["1層ではない。","2層はほかの消化管の基本形。","","胃の筋層は平滑筋。"]],["小腸の粘膜にあり、表面積を大きくしている構造はどれか。",["結腸ヒモ","腹膜垂","結腸膨起","絨毛"],3,"小腸の粘膜には輪状ひだ・絨毛・微絨毛があり、吸収の面積を広げている。",["結腸ヒモは大腸の特徴。","腹膜垂は大腸の特徴。","結腸膨起(ハウストラ)は大腸の特徴。",""]],["パイエル板(集合リンパ小節)が多くみられる部位はどれか。",["食道","十二指腸","空腸","回腸"],3,"パイエル板は回腸に多く、腸の免疫に働く。",["食道にはみられない。","十二指腸には少ない。","空腸には少ない。",""]],["十二指腸がC字形に囲んでいる臓器はどれか。",["膵頭","脾臓","胆嚢","左腎"],0,"十二指腸はC字形に曲がり、そのくぼみに膵頭が入っている。",["","脾臓は左上腹部にある。","胆嚢は肝臓の下面にある。","左腎は左の後腹壁にある。"]],["虫垂が付いている部位はどれか。",["盲腸","回腸","上行結腸","S状結腸"],0,"虫垂は盲腸の下端(後内側)から出ている。",["","回腸は盲腸につながる小腸。","上行結腸は盲腸の続き。","S状結腸は下行結腸の続き。"]],["大腸にあって、小腸にない構造はどれか。",["絨毛","輪状ひだ","結腸ヒモ","パイエル板"],2,"結腸ヒモは縦走筋が3本の帯に集まったもので、大腸の特徴。",["絨毛は小腸の特徴。","輪状ひだは小腸の特徴。","","パイエル板は回腸に多い。"]],["大腸の順序として正しいのはどれか。",["盲腸→上行結腸→下行結腸→横行結腸→S状結腸→直腸","盲腸→横行結腸→上行結腸→下行結腸→S状結腸→直腸","盲腸→上行結腸→横行結腸→下行結腸→S状結腸→直腸","盲腸→上行結腸→横行結腸→S状結腸→下行結腸→直腸"],2,"大腸は盲腸から始まり、右下腹部から時計回りに腹部を一周して直腸へ続く。",["横行結腸が下行結腸より先。","上行結腸が横行結腸より先。","","下行結腸がS状結腸より先。"]],["腸間膜をもたず、後腹壁に固定されている部分はどれか。",["横行結腸","上行結腸","S状結腸","空腸"],1,"上行結腸と下行結腸は後腹壁に固定され、腸間膜をもたない。",["横行結腸は横行結腸間膜をもつ。","","S状結腸はS状結腸間膜をもつ。","空腸は腸間膜をもつ。"]],["自分の意思で締めることができる括約筋はどれか。",["内肛門括約筋","オッディ括約筋","幽門括約筋","外肛門括約筋"],3,"外肛門括約筋は横紋筋で、自分の意思で締められる(陰部神経支配)。",["内肛門括約筋は平滑筋で、意思では動かせない。","オッディ括約筋は総胆管の出口の平滑筋。","幽門括約筋は平滑筋。",""]],["肝臓の前面で、右葉と左葉の境の目印となる構造はどれか。",["肝鎌状間膜","小網","大網","肝門"],0,"肝臓の前上面では、肝鎌状間膜の付着部で右葉と左葉に分ける。",["","小網は肝臓と胃・十二指腸の間の腹膜。","大網は胃から垂れ下がる腹膜。","肝門は肝臓の下面にある血管などの出入り口。"]],["胆嚢がある位置はどれか。",["膵尾の先","胃の後面","脾臓の内側","肝臓の下面"],3,"胆嚢は肝臓の下面(胆嚢窩)にあり、胆汁をためて濃縮する。",["膵尾の先には脾臓がある。","胃の後面には膵臓がある。","脾臓の内側に胆嚢はない。",""]],["総肝管と胆嚢管が合流してできる管はどれか。",["膵管","総胆管","副膵管","肝静脈"],1,"総肝管と胆嚢管が合流して総胆管になり、十二指腸へ向かう。",["膵管は膵臓の中を通る。","","副膵管は小十二指腸乳頭に開く。","肝静脈は血管で、胆汁の通り道ではない。"]],["肝小葉の中心にあるものはどれか。",["小葉間動脈","小葉間静脈","中心静脈","小葉間胆管"],2,"肝小葉の中心には中心静脈があり、血液は周りから中心静脈へ流れる。",["小葉間動脈は肝小葉の間(グリソン鞘)にある。","小葉間静脈は肝小葉の間(グリソン鞘)にある。","","小葉間胆管は肝小葉の間(グリソン鞘)にある。"]],["胃から垂れ下がり、腸の前を覆う腹膜はどれか。",["大網","小網","腸間膜","肝鎌状間膜"],0,"大網は胃の大弯から前掛けのように垂れ下がり、腸の前を覆う。",["","小網は胃の小弯と肝臓の間。","腸間膜は小腸を後腹壁につなぐ。","肝鎌状間膜は肝臓を前腹壁につなぐ。"]],["膵尾が接している臓器はどれか。",["脾臓","肝臓","十二指腸","膀胱"],0,"膵臓は膵頭・膵体・膵尾に分かれ、膵尾は左側で脾臓に接する。",["","肝臓には接しない。","十二指腸に接するのは膵頭。","膀胱には接しない。"]],["味蕾がない舌乳頭はどれか。",["有郭乳頭","茸状乳頭","糸状乳頭","葉状乳頭"],2,"糸状乳頭は最も数が多いが、味蕾はなく触覚に関わる。",["有郭乳頭には味蕾が多い。","茸状乳頭には味蕾がある。","","葉状乳頭には味蕾がある。"]],["消化管の壁の層を内側から並べたものとして正しいのはどれか。",["粘膜→筋層→粘膜下組織→漿膜","粘膜→粘膜下組織→筋層→漿膜","漿膜→筋層→粘膜下組織→粘膜","粘膜下組織→粘膜→筋層→漿膜"],1,"消化管の壁は内側から粘膜・粘膜下組織・筋層・漿膜(または外膜)の順。",["粘膜下組織は粘膜のすぐ外。","","これは外側からの順。","粘膜が最も内側。"]],["粘膜下神経叢(マイスナー神経叢)がある層はどれか。",["粘膜上皮","漿膜","筋層の間","粘膜下組織"],3,"マイスナー神経叢は粘膜下組織に、アウエルバッハ神経叢は筋層(輪走筋と縦走筋の間)にある。",["粘膜上皮にはない。","漿膜にはない。","筋層の間にあるのはアウエルバッハ神経叢。",""]],["胆嚢の働きはどれか。",["インスリンを分泌する","胆汁をつくる","消化酵素をつくる","胆汁をためて濃くする"],3,"胆嚢は肝臓でつくられた胆汁をためて濃くし、食事のときに十二指腸へ送り出す。",["インスリンは膵臓から出る。","胆汁をつくるのは肝臓。","消化酵素をつくるのは膵臓など。",""]],["小腸のうち、最も長い部分はどれか。",["十二指腸","空腸","盲腸","回腸"],3,"十二指腸に続く小腸のうち、前の約5分の2が空腸、後ろの約5分の3が回腸。",["十二指腸は短い。","空腸は回腸より短い。","盲腸は大腸。",""]]]},
{"id":"a8","g":"a","k":"泌","name":"泌尿・生殖器系","q":[["腎臓について正しいのはどれか。",["腹膜内器官である","腎錐体は皮質にある","腎門は外側を向く","右腎は左腎よりやや低い"],3,"右腎は上に肝臓があるため、左腎より少し低い位置にある。",["腎臓は腹膜後器官。","腎錐体は髄質にある。","腎門は内側を向き、血管や尿管が出入りする。",""]],["ネフロン(腎単位)に含まれないものはどれか。",["糸球体","集合管","遠位尿細管","ボウマン嚢"],1,"ネフロンは腎小体(糸球体+ボウマン嚢)と尿細管からなる。集合管は含めない。",["糸球体は腎小体の一部。","","遠位尿細管は尿細管の一部。","ボウマン嚢は腎小体の一部。"]],["膀胱三角をつくる3点はどれか。",["尿管口と内・外尿道口","左右の尿管口と外尿道口","左右の腎門と内尿道口","左右の尿管口と内尿道口"],3,"膀胱三角は左右の尿管口と内尿道口を結ぶ三角で、粘膜にひだがない。",["尿管口は左右2つ。外尿道口は膀胱にない。","外尿道口は尿道の出口で、膀胱にはない。","腎門は腎臓にある。",""]],["精子がつくられる場所はどれか。",["精巣上体","精嚢","精細管","前立腺"],2,"精子は精巣の精細管でつくられる。",["精巣上体では精子が成熟し、蓄えられる。","精嚢は精液の一部となる分泌液を出す。","","前立腺は精液の一部となる分泌液を出す。"]],["受精がふつう行われる場所はどれか。",["卵巣","卵管膨大部","子宮体部","子宮頸部"],1,"受精はふつう卵管膨大部で起こり、受精卵は子宮へ運ばれて着床する。",["卵巣は卵子を育て、排卵する。","","子宮体部は着床する場所。","子宮頸部は子宮の出口側。"]],["腎臓を包む被膜を内側から並べたものとして正しいのはどれか。",["腎筋膜→脂肪被膜→線維被膜","脂肪被膜→線維被膜→腎筋膜","線維被膜→脂肪被膜→腎筋膜","線維被膜→腎筋膜→脂肪被膜"],2,"腎臓は内側から線維被膜・脂肪被膜・腎筋膜(ゲロタ筋膜)に包まれる。",["これは外側からの順。","線維被膜が腎臓にじかに接する。","","脂肪被膜は線維被膜と腎筋膜の間。"]],["腎小体がある部位はどれか。",["髄質","皮質","腎盤","腎門"],1,"腎小体(糸球体+ボウマン嚢)は腎臓の皮質にある。",["髄質には腎錐体があり、尿細管の一部や集合管が走る。","","腎盤は尿を集める部分。","腎門は血管や尿管の出入り口。"]],["腎乳頭から出た尿を最初に受け止める部分はどれか。",["腎盤","腎杯","尿管","膀胱"],1,"尿は腎乳頭→腎杯→腎盤→尿管→膀胱と流れる。",["腎盤は腎杯の次。","","尿管は腎盤の次。","膀胱は尿管の次。"]],["尿管の内面を覆う上皮はどれか。",["移行上皮","単層円柱上皮","単層扁平上皮","重層扁平上皮"],0,"尿管や膀胱は移行上皮で覆われ、尿がたまって伸びると上皮が薄くなる。",["","単層円柱上皮は胃や腸など。","単層扁平上皮は肺胞や血管の内面など。","重層扁平上皮は皮膚や食道など。"]],["膀胱がある位置はどれか。",["恥骨結合のすぐ後ろ","直腸の後ろ","臍の高さ","腎臓のすぐ下"],0,"膀胱は骨盤の中で恥骨結合のすぐ後ろにある。",["","膀胱は直腸の前にある。","空の膀胱は骨盤の中にあり、臍の高さではない。","腎臓のすぐ下ではない(尿管でつながる)。"]],["成人女性の尿道の長さはおよそどれか。",["約1cm","約3〜4cm","約10cm","約20cm"],1,"女性の尿道は約3〜4cmと短く、膀胱炎などの尿路感染を起こしやすい。",["約1cmではない。","","約10cmではない。","約20cmは男性の尿道に近い(約16〜20cm)。"]],["膀胱のすぐ下で、男性の尿道を取り囲む器官はどれか。",["精嚢","精巣上体","前立腺","陰嚢"],2,"前立腺は膀胱の下で尿道を取り囲むため、大きくなると尿が出にくくなる。",["精嚢は膀胱の後ろにある。","精巣上体は精巣の上後方にある。","","陰嚢は精巣を入れる袋。"]],["精子の通り道の順序として正しいのはどれか。",["精巣→精巣上体→精管→射精管→尿道","精巣→精管→精巣上体→射精管→尿道","精巣→精巣上体→射精管→精管→尿道","精巣上体→精巣→精管→射精管→尿道"],0,"精子は精巣でつくられ、精巣上体で成熟し、精管・射精管を通って尿道へ出る。",["","精巣上体が精管より先。","精管が射精管より先。","精巣が最初。"]],["精索に含まれるものはどれか。",["精管","尿管","前立腺","膀胱"],0,"精索には精管・精巣動脈・蔓状静脈叢・神経などが含まれる。",["","尿管は腎臓から膀胱へ向かい、精索には含まれない。","前立腺は膀胱の下にある。","膀胱は骨盤内にある。"]],["女性で鼡径管を通るものはどれか。",["卵管","子宮円索","尿管","卵巣動脈"],1,"女性の鼡径管には子宮円索が通る(男性では精索)。",["卵管は骨盤内にある。","","尿管は鼡径管を通らない。","卵巣動脈は鼡径管を通らない(卵巣提索の中を通る)。"]],["精巣が体の外(陰嚢の中)にある理由として正しいのはどれか。",["血液が多く流れるようにするため","ホルモンを分泌しやすくするため","尿道に近づけるため","精子の形成に体温より低い温度が適するため"],3,"精子の形成は体温より低い温度が適しており、陰嚢の中で温度が保たれる。",["理由ではない。","ホルモン分泌のためではない。","理由ではない。",""]],["子宮がある位置はどれか。",["恥骨結合と膀胱の間","膀胱と直腸の間","直腸と仙骨の間","腎臓の下"],1,"子宮は骨盤の中で、前の膀胱と後ろの直腸の間にある。",["恥骨結合のすぐ後ろは膀胱。","","直腸の後ろは仙骨で、子宮はない。","腎臓の下ではない。"]],["女性の腹膜腔で最も低い位置にあるくぼみはどれか。",["膀胱子宮窩","網嚢","直腸子宮窩(ダグラス窩)","横隔膜の下"],2,"直腸子宮窩は子宮と直腸の間のくぼみで、腹膜腔で最も低いため液体がたまりやすい。",["膀胱子宮窩は子宮の前にあり、ダグラス窩より浅い。","網嚢は胃の後ろの空間。","","横隔膜の下は高い位置。"]],["子宮の壁の3層のうち、最も厚いのはどれか。",["子宮内膜","子宮筋層","子宮外膜","子宮頸管"],1,"子宮の壁は内膜・筋層・外膜からなり、平滑筋の筋層が最も厚い。",["子宮内膜は月経周期で厚さが変わるが、筋層より薄い。","","子宮外膜は腹膜で薄い。","子宮頸管は層ではなく、子宮頸部の内腔。"]],["月経のときにはがれ落ちる部分はどれか。",["子宮外膜","子宮内膜の基底層","子宮筋層","子宮内膜の機能層"],3,"月経では子宮内膜の機能層がはがれ落ち、基底層から再生する。",["外膜ははがれない。","基底層は残り、そこから内膜が再生する。","筋層ははがれない。",""]],["正常な子宮の向きはどれか。",["前傾後屈","後傾後屈","前傾前屈","まっすぐ縦向き"],2,"子宮はふつう前傾前屈で、膀胱の上に前へ倒れるような向きにある。",["正常ではない。","後傾後屈は正常ではない向き。","","まっすぐではない。"]],["排卵の直前の、成熟した卵胞はどれか。",["原始卵胞","黄体","グラーフ卵胞(成熟卵胞)","白体"],2,"卵胞は原始卵胞から育ち、成熟したものをグラーフ卵胞とよぶ。",["原始卵胞は最も未熟な卵胞。","黄体は排卵後にできる。","","白体は黄体が退化したあとの組織。"]],["排卵後の卵胞が変化してできるものはどれか。",["白体","原始卵胞","黄体","卵丘"],2,"排卵後の卵胞は黄体になり、プロゲステロンを分泌する。",["白体は黄体が退化したあとの組織。","原始卵胞は未熟な卵胞。","","卵丘は成熟卵胞の中で卵子を包む部分。"]],["卵管の、卵巣側の端にある指のような突起はどれか。",["子宮口","卵管峡部","卵管采","卵巣門"],2,"卵管采は卵管漏斗の縁にあり、排卵された卵子を受け取る。",["子宮口は子宮の出入り口。","卵管峡部は子宮に近い細い部分。","","卵巣門は卵巣の血管の出入り口。"]],["腟の内面を覆う上皮はどれか。",["多列線毛上皮","単層円柱上皮","移行上皮","重層扁平上皮"],3,"腟は摩擦に強い重層扁平上皮で覆われる。",["多列線毛上皮は気道。","単層円柱上皮は子宮内膜など。","移行上皮は尿路。",""]],["前立腺のすぐ後ろにある器官はどれか。",["恥骨結合","精巣","陰茎","直腸"],3,"前立腺は直腸の前にあるので、肛門から指を入れて触れることができる。",["恥骨結合は前立腺の前。","精巣は陰嚢の中。","陰茎は前立腺の前下方。",""]],["腹大動脈の前を横切って下大静脈に注ぐ静脈はどれか。",["左腎静脈","右腎静脈","左精巣静脈","門脈"],0,"下大静脈は体の右寄りにあるため、左腎静脈は腹大動脈の前を横切って注ぐ。",["","右腎静脈は短く、下大静脈にすぐ注ぐ。","左精巣(卵巣)静脈は左腎静脈に注ぐ。","門脈は肝臓に入る。"]],["左精巣静脈が注ぐ静脈はどれか。",["左腎静脈","下大静脈","左総腸骨静脈","門脈"],0,"左精巣静脈は左腎静脈に、右精巣静脈は下大静脈に直接注ぐ。",["","下大静脈に直接注ぐのは右精巣静脈。","左総腸骨静脈には注がない。","門脈には注がない。"]],["腎門で、前から後ろへの並び順として正しいのはどれか。",["腎動脈→腎盤→腎静脈","腎動脈→腎静脈→腎盤","腎盤→腎動脈→腎静脈","腎静脈→腎動脈→腎盤"],3,"腎門では前から腎静脈・腎動脈・腎盤(尿管)の順に並ぶ。",["腎盤は最も後ろ。","腎静脈が最も前。","腎盤は最も後ろ。",""]],["精嚢がある位置はどれか。",["腎臓の上","陰嚢の中","恥骨結合の前","膀胱の後ろ"],3,"精嚢は膀胱の後ろにある一対の器官で、精液の一部となる液を分泌する。",["腎臓の上には副腎がある。","陰嚢の中には精巣と精巣上体がある。","恥骨結合の前にはない。",""]]]},
{"id":"a9","g":"a","k":"内","name":"内分泌系","q":[["副腎がある位置はどれか。",["腎臓の上端","膀胱の後方","甲状腺の後面","第3脳室の後上方"],0,"副腎は左右の腎臓の上端にのっている。",["","膀胱の後方に副腎はない。","甲状腺の後面には上皮小体がある。","第3脳室の後上方には松果体がある。"]],["上皮小体(副甲状腺)がある位置はどれか。",["胸腺の中","甲状腺の後面","下垂体の前","膵臓の中"],1,"上皮小体は甲状腺の後面に、ふつう左右に上下1対ずつある。",["胸腺は胸骨の後ろにあるリンパ性の器官。","","下垂体の前に上皮小体はない。","膵臓の中にあるのはランゲルハンス島。"]],["下垂体がおさまる場所はどれか。",["篩骨の篩板","蝶形骨のトルコ鞍","側頭骨の錐体","後頭骨の大後頭孔"],1,"下垂体は蝶形骨のトルコ鞍(下垂体窩)にある。",["篩板には嗅神経が通る小さな孔がある。","","側頭骨の錐体の中には内耳がある。","大後頭孔は延髄から脊髄への移行部が通る。"]],["膵臓で内分泌を行う部分はどれか。",["腺房","ランゲルハンス島","膵管","膵頭"],1,"ランゲルハンス島(膵島)からインスリンやグルカゴンが血液へ分泌される。",["腺房は消化酵素をつくる外分泌部。","","膵管は膵液を十二指腸へ運ぶ管。","膵頭は膵臓の部位の名前で、内分泌部そのものではない。"]],["甲状腺の傍濾胞細胞(C細胞)が分泌するホルモンはどれか。",["サイロキシン","カルシトニン","パラトルモン","アルドステロン"],1,"カルシトニンは血液中のカルシウム濃度を下げる。",["サイロキシンは甲状腺の濾胞上皮細胞から出る。","","パラトルモンは上皮小体から出る。","アルドステロンは副腎皮質から出る。"]],["内分泌腺の特徴はどれか。",["すべて皮膚にある","分泌物を体の表面に出す","分泌物を消化管に出す","導管をもたない"],3,"内分泌腺は導管をもたず、ホルモンを直接血液中に分泌する。",["皮膚にあるわけではない。","体の表面に出すのは外分泌腺(汗腺など)。","消化管に出すのは外分泌腺(唾液腺・膵臓の外分泌部など)。",""]],["内分泌腺はどれか。",["涙腺","汗腺","甲状腺","唾液腺"],2,"甲状腺は導管をもたず、ホルモンを血液中に出す内分泌腺。",["涙腺は外分泌腺。","汗腺は外分泌腺。","","唾液腺は外分泌腺。"]],["下垂体後葉の別名はどれか。",["神経下垂体","腺下垂体","中間葉","下垂体柄"],0,"後葉は脳(視床下部)が下に伸びてできた部分で、神経下垂体とよばれる。",["","腺下垂体は前葉(と中間部)。","中間葉は前葉と後葉の間の部分。","下垂体柄は視床下部と下垂体をつなぐ部分。"]],["視床下部と下垂体をつないでいる構造はどれか。",["視交叉","脳梁","中脳水道","下垂体柄(漏斗)"],3,"下垂体は下垂体柄(漏斗)で視床下部とつながっている。",["視交叉は視神経が交叉する部分で、下垂体の前上方にある。","脳梁は左右の大脳半球をつなぐ。","中脳水道は第3脳室と第4脳室をつなぐ。",""]],["下垂体門脈系がつないでいるのはどれか。",["視床下部と下垂体前葉","視床下部と下垂体後葉","下垂体と甲状腺","肝臓と下垂体"],0,"視床下部のホルモンは下垂体門脈を通って前葉に届き、前葉ホルモンの分泌を調節する。",["","後葉へは神経の線維で直接つながる。","下垂体と甲状腺は門脈でつながらない。","肝臓とは関係しない。"]],["下垂体後葉から出るホルモンがつくられる場所はどれか。",["下垂体後葉","下垂体前葉","松果体","視床下部"],3,"オキシトシンとバソプレシンは視床下部の神経細胞でつくられ、軸索を通って後葉から放出される。",["後葉はためて放出するだけ。","前葉ではない。","松果体ではない。",""]],["甲状腺の左右の葉をつなぐ部分はどれか。",["錐体","門","被膜","峡部"],3,"甲状腺は左右の葉と、それをつなぐ峡部からなり、気管の前にある。",["錐体ではない。","門ではない。","被膜は甲状腺を包む膜。",""]],["甲状腺の濾胞の中にたまっているものはどれか。",["コロイド","胆汁","脳脊髄液","リンパ"],0,"濾胞の中にはコロイド(主にサイログロブリン)がたまり、甲状腺ホルモンのもとになる。",["","胆汁は胆嚢にたまる。","脳脊髄液は脳室などにある。","リンパはリンパ管を流れる。"]],["甲状腺ホルモンに含まれる元素はどれか。",["鉄","カルシウム","ヨウ素","ナトリウム"],2,"甲状腺ホルモン(サイロキシンなど)はヨウ素を含む。",["鉄はヘモグロビンに含まれる。","カルシウムは甲状腺ホルモンの成分ではない。","","ナトリウムは甲状腺ホルモンの成分ではない。"]],["上甲状腺動脈はどの動脈の枝か。",["内頸動脈","椎骨動脈","外頸動脈","腕頭動脈"],2,"上甲状腺動脈は外頸動脈の最初の枝。下甲状腺動脈は鎖骨下動脈の枝(甲状頸動脈)から出る。",["内頸動脈は首で枝を出さない。","椎骨動脈は脳へ向かう。","","腕頭動脈からは直接出ない。"]],["副腎皮質の3層を外側から並べたものとして正しいのはどれか。",["網状帯→束状帯→球状帯","束状帯→球状帯→網状帯","球状帯→束状帯→網状帯","球状帯→網状帯→束状帯"],2,"副腎皮質は外側から球状帯(アルドステロン)・束状帯(コルチゾール)・網状帯(アンドロゲン)。",["これは内側からの順。","球状帯が最も外側。","","束状帯は球状帯と網状帯の間。"]],["副腎皮質ホルモンの化学的な種類はどれか。",["ペプチド","ステロイド","カテコールアミン","アミノ酸"],1,"副腎皮質ホルモンはコレステロールからつくられるステロイドホルモン。",["インスリンなどはペプチドホルモン。","","カテコールアミン(アドレナリンなど)は副腎髄質ホルモン。","アミノ酸ではない。"]],["副腎髄質を直接支配する神経線維はどれか。",["副交感神経の節前線維","交感神経の節後線維","交感神経の節前線維","体性運動神経"],2,"副腎髄質の細胞は交感神経の節後ニューロンにあたり、節前線維が直接入る。",["副交感神経は支配しない。","副腎髄質に節後線維は入らない。","","体性運動神経は骨格筋を支配する。"]],["膵島のA(α)細胞が分泌するホルモンはどれか。",["インスリン","ソマトスタチン","グルカゴン","ガストリン"],2,"A細胞はグルカゴン、B細胞はインスリン、D細胞はソマトスタチンを分泌する。",["インスリンはB(β)細胞。","ソマトスタチンはD(δ)細胞。","","ガストリンは主に胃のG細胞。"]],["膵島で最も数が多い細胞はどれか。",["A細胞","B細胞","D細胞","腺房細胞"],1,"膵島で最も多いのはインスリンを出すB細胞。",["A細胞はB細胞より少ない。","","D細胞は少ない。","腺房細胞は外分泌部の細胞で、膵島の細胞ではない。"]],["松果体が分泌するホルモンはどれか。",["オキシトシン","メラトニン","カルシトニン","コルチゾール"],1,"松果体はメラトニンを分泌し、睡眠などの日内リズムに関わる。",["オキシトシンは下垂体後葉。","","カルシトニンは甲状腺。","コルチゾールは副腎皮質。"]],["卵胞が分泌するホルモンはどれか。",["プロゲステロン","エストロゲン","黄体形成ホルモン","ヒト絨毛性ゴナドトロピン"],1,"発育中の卵胞はエストロゲン(卵胞ホルモン)を分泌する。",["プロゲステロンは主に黄体から出る。","","黄体形成ホルモンは下垂体前葉から出る。","ヒト絨毛性ゴナドトロピンは胎盤から出る。"]],["胎盤から分泌されるホルモンはどれか。",["グルカゴン","成長ホルモン","ヒト絨毛性ゴナドトロピン(hCG)","メラトニン"],2,"hCGは胎盤の絨毛から出て黄体を保つ。妊娠検査で調べるホルモン。",["グルカゴンは膵島。","成長ホルモンは下垂体前葉。","","メラトニンは松果体。"]],["心臓(心房)から分泌されるホルモンはどれか。",["レニン","心房性ナトリウム利尿ペプチド","エリスロポエチン","ガストリン"],1,"心房が引き伸ばされると、心房性ナトリウム利尿ペプチドが出て、尿へのNa⁺と水の排泄を増やす。",["レニンは腎臓から出る。","","エリスロポエチンは主に腎臓から出る。","ガストリンは胃から出る。"]],["主に腎臓から分泌され、赤血球をつくるのを促すホルモンはどれか。",["アルドステロン","インスリン","エリスロポエチン","カルシトニン"],2,"エリスロポエチンは骨髄に働き、赤血球の産生を促す。",["アルドステロンは副腎皮質。","インスリンは膵臓。","","カルシトニンは甲状腺。"]],["胃から分泌される消化管ホルモンはどれか。",["コレシストキニン","セクレチン","ガストリン","インスリン"],2,"ガストリンは胃の幽門部のG細胞から出て、胃酸の分泌を促す。",["コレシストキニンは十二指腸から出る。","セクレチンは十二指腸から出る。","","インスリンは膵臓から出る。"]],["脂肪組織から分泌され、食欲をおさえるホルモンはどれか。",["グレリン","レプチン","ガストリン","プロラクチン"],1,"レプチンは脂肪細胞から出て視床下部に働き、食欲をおさえる。",["グレリンは主に胃から出て、食欲を高める。","","ガストリンは胃酸の分泌を促す。","プロラクチンは乳汁の産生を促す。"]],["下垂体前葉から分泌されないホルモンはどれか。",["成長ホルモン","副腎皮質刺激ホルモン","卵胞刺激ホルモン","バソプレシン"],3,"バソプレシンは視床下部でつくられ、下垂体後葉から放出される。",["成長ホルモンは前葉から出る。","副腎皮質刺激ホルモンは前葉から出る。","卵胞刺激ホルモンは前葉から出る。",""]],["甲状腺の濾胞上皮細胞から分泌されるホルモンはどれか。",["パラトルモン","カルシトニン","サイロキシン","メラトニン"],2,"濾胞上皮細胞はサイロキシンなどの甲状腺ホルモンを分泌する。",["パラトルモンは上皮小体から出る。","カルシトニンは傍濾胞細胞(C細胞)から出る。","","メラトニンは松果体から出る。"]],["副腎皮質の球状帯から分泌されるホルモンはどれか。",["コルチゾール","アルドステロン","アンドロゲン","アドレナリン"],1,"球状帯はアルドステロン(電解質コルチコイド)を分泌する。",["コルチゾールは束状帯。","","アンドロゲンは網状帯。","アドレナリンは副腎髄質。"]]]},
{"id":"a10","g":"a","k":"感","name":"感覚器","q":[["視細胞がある眼球の層はどれか。",["角膜","強膜","脈絡膜","網膜"],3,"網膜に光を受ける視細胞(杆体・錐体)がある。",["角膜は眼球前面の透明な膜。","強膜はいわゆる白目の部分。","脈絡膜は血管が多く、網膜を養う。",""]],["視細胞がなく、盲点となる部位はどれか。",["黄斑","中心窩","視神経円板","毛様体"],2,"視神経円板(視神経乳頭)は視神経が眼球を出るところで、視細胞がないため見えない。",["黄斑は視力のよい部分。","中心窩は錐体が集まり、最も視力がよい。","","毛様体は水晶体の厚さを変える。"]],["前庭窓(卵円窓)にはまる耳小骨はどれか。",["ツチ骨","キヌタ骨","アブミ骨","舌骨"],2,"アブミ骨の底が前庭窓にはまり、振動を内耳へ伝える。",["ツチ骨は鼓膜に付く。","キヌタ骨はツチ骨とアブミ骨の間にある。","","舌骨は首にある骨で、耳小骨ではない。"]],["頭の回転を感じる器官はどれか。",["半規管","蝸牛","耳管","鼓室"],0,"3つの半規管が頭の回転(回転加速度)を感じる。",["","蝸牛は音を感じる。","耳管は中耳と咽頭をつなぐ。","鼓室は中耳の空間。"]],["鼻涙管が開口する部位はどれか。",["上鼻道","下鼻道","中鼻道","咽頭"],1,"涙は涙点→涙小管→涙嚢→鼻涙管を通り、下鼻道に流れる。",["上鼻道には後篩骨洞などが開く。","","中鼻道には上顎洞・前頭洞などが開く。","咽頭には開かない。"]],["ぶどう膜(眼球の中膜)に含まれないものはどれか。",["虹彩","毛様体","脈絡膜","角膜"],3,"ぶどう膜は虹彩・毛様体・脈絡膜。角膜は強膜とともに外膜をつくる。",["虹彩はぶどう膜の一部。","毛様体はぶどう膜の一部。","脈絡膜はぶどう膜の一部。",""]],["角膜の特徴はどれか。",["光を受ける細胞がある","色素が多い","血管がない","房水をつくる"],2,"角膜は透明で血管がなく、涙や房水から栄養を受ける。",["光を受ける細胞は網膜にある。","色素が多いのは虹彩や脈絡膜。","","房水をつくるのは毛様体。"]],["瞳孔の大きさを変える部分はどれか。",["角膜","硝子体","水晶体","虹彩"],3,"虹彩の瞳孔括約筋と瞳孔散大筋が、瞳孔の大きさを変えて入る光の量を調節する。",["角膜は光を屈折させる。","硝子体は眼球の形を保つ。","水晶体はピントを合わせる。",""]],["瞳孔散大筋を支配する神経はどれか。",["外転神経","副交感神経","顔面神経","交感神経"],3,"瞳孔散大筋は交感神経、瞳孔括約筋は副交感神経(動眼神経)が支配する。",["外転神経は外側直筋。","副交感神経は瞳孔括約筋を支配する。","顔面神経は表情筋。",""]],["房水をつくる部位はどれか。",["水晶体","毛様体","虹彩","網膜"],1,"房水は毛様体でつくられ、後眼房から前眼房へ流れる。",["水晶体は房水をつくらない。","","虹彩は房水をつくらない。","網膜は房水をつくらない。"]],["房水が静脈へ流れ出る通り道はどれか。",["シュレム管(強膜静脈洞)","鼻涙管","視神経管","中心窩"],0,"房水は前眼房の隅からシュレム管を通って静脈へ流れる。流れが悪いと眼圧が上がる。",["","鼻涙管は涙の通り道。","視神経管は視神経が通る骨の管。","中心窩は網膜の一部。"]],["水晶体を支えている構造はどれか。",["硝子体管","毛様体小帯(チン小帯)","強膜","視神経円板"],1,"毛様体小帯が毛様体と水晶体をつなぎ、水晶体の厚さの調節に働く。",["硝子体管は硝子体の中の細い管の名残。","","強膜は眼球の外膜。","視神経円板は視神経の出口。"]],["眼球の中で最も大きな体積を占めるものはどれか。",["房水","水晶体","硝子体","角膜"],2,"硝子体はゼリー状で、眼球の中の大部分を占め、眼球の形を保つ。",["房水は前・後眼房にある少量の液。","水晶体は小さなレンズ。","","角膜は前面の膜。"]],["中心窩に多く集まっている視細胞はどれか。",["錐体","杆体","双極細胞","神経節細胞"],0,"中心窩には錐体が密集し、最も細かく見分けられる。",["","杆体は網膜の周辺に多い。","双極細胞は中心窩では脇へ押しやられている。","神経節細胞は中心窩では脇へ押しやられている。"]],["視交叉で反対側へ交叉する線維はどれか。",["すべての線維","網膜の耳側半分からの線維","網膜の鼻側半分からの線維","交叉する線維はない"],2,"網膜の鼻側半分からの線維だけが視交叉で交叉する。",["半分だけ交叉する(半交叉)。","耳側半分からの線維は交叉しない。","","鼻側の線維が交叉する。"]],["眼球を動かす外眼筋の数(片目)はどれか。",["4","6","8","10"],1,"上直筋・下直筋・内側直筋・外側直筋・上斜筋・下斜筋の6つ。",["4つではない(直筋だけで4つ)。","","8つではない。","10ではない。"]],["涙腺がある位置はどれか。",["眼球の上外側","眼球の下内側","眼球の真後ろ","鼻腔の中"],0,"涙腺は眼窩の上外側にあり、涙は内側の涙点から鼻へ流れる。",["","下内側には涙嚢などの涙の出口がある。","眼球の後ろには視神経がある。","鼻腔の中にはない。"]],["アブミ骨筋を支配する神経はどれか。",["三叉神経","舌咽神経","内耳神経","顔面神経"],3,"アブミ骨筋は顔面神経が支配する。鼓膜張筋は三叉神経が支配する。",["三叉神経は鼓膜張筋を支配する。","舌咽神経は支配しない。","内耳神経は感覚神経で、筋を支配しない。",""]],["中耳に含まれるものはどれか。",["半規管","蝸牛","鼓室","外耳道"],2,"中耳は鼓室・耳小骨・耳管などからなる。",["半規管は内耳。","蝸牛は内耳。","","外耳道は外耳。"]],["膜迷路の中を満たしている液はどれか。",["脳脊髄液","外リンパ","房水","内リンパ"],3,"内耳は骨迷路の中に膜迷路があり、膜迷路の中は内リンパ、外側は外リンパで満たされる。",["脳脊髄液は脳と脊髄の周り。","外リンパは骨迷路と膜迷路の間。","房水は眼球の中。",""]],["音を感じる受容器はどれか。",["膨大部稜","平衡斑","コルチ器(ラセン器)","鼓膜"],2,"コルチ器は蝸牛の基底膜の上にあり、有毛細胞が音の振動を感じる。",["膨大部稜は半規管にあり、回転を感じる。","平衡斑は卵形嚢・球形嚢にあり、傾きや直線の加速を感じる。","","鼓膜は音を受けて振動するが、受容器ではない。"]],["頭の傾きや直線の加速を感じる部位はどれか。",["蝸牛","卵形嚢と球形嚢","半規管","鼓室"],1,"卵形嚢と球形嚢の平衡斑には耳石がのっており、重力や直線の加速を感じる。",["蝸牛は音を感じる。","","半規管は回転を感じる。","鼓室は中耳の空間。"]],["内耳神経をつくる2つの神経はどれか。",["顔面神経と前庭神経","蝸牛神経と前庭神経","蝸牛神経と舌咽神経","鼓索神経と前庭神経"],1,"内耳神経(第VIII脳神経)は聴覚の蝸牛神経と平衡覚の前庭神経からなる。",["顔面神経は別の脳神経。","","舌咽神経は別の脳神経。","鼓索神経は顔面神経の枝。"]],["内耳がある骨はどれか。",["側頭骨","蝶形骨","後頭骨","頭頂骨"],0,"内耳は側頭骨の錐体の中にある。",["","蝶形骨ではない。","後頭骨ではない。","頭頂骨ではない。"]],["皮膚の層を外側から並べたものとして正しいのはどれか。",["表皮→真皮→皮下組織","真皮→表皮→皮下組織","表皮→皮下組織→真皮","皮下組織→真皮→表皮"],0,"皮膚は外側から表皮・真皮、その下に皮下組織がある。",["","表皮が最も外側。","真皮が表皮のすぐ下。","これは内側からの順。"]],["表皮の最も外側にある層はどれか。",["基底層","角質層","顆粒層","有棘層"],1,"表皮は内側から基底層・有棘層・顆粒層・(淡明層)・角質層の順。",["基底層は最も内側で、細胞分裂が起こる。","","顆粒層は角質層の下。","有棘層は基底層の上。"]],["メラニンをつくる細胞はどれか。",["ケラチノサイト","メラノサイト","ランゲルハンス細胞","線維芽細胞"],1,"メラノサイト(色素細胞)は表皮の基底層にあり、紫外線から体を守るメラニンをつくる。",["ケラチノサイトは表皮の大部分をつくる角化細胞。","","ランゲルハンス細胞は表皮で免疫に働く。","線維芽細胞は真皮で線維をつくる。"]],["アポクリン汗腺が多い部位はどれか。",["手のひら","足の裏","腋窩(わきの下)","額"],2,"アポクリン汗腺は腋窩や外陰部など限られた部位にある。",["手のひらにはエクリン汗腺が多い。","足の裏にはエクリン汗腺が多い。","","額にはエクリン汗腺が多い。"]],["立毛筋の種類はどれか。",["心筋","骨格筋","平滑筋","表情筋"],2,"立毛筋は平滑筋で、交感神経の働きで収縮し、鳥肌を立たせる。",["心筋ではない。","骨格筋ではない。","","表情筋は骨格筋で、立毛筋ではない。"]],["真皮の深層から皮下組織にあり、玉ねぎのような層をもつ受容器はどれか。",["パチニ小体","マイスナー小体","メルケル盤","自由神経終末"],0,"パチニ小体(層板小体)は層状の被膜をもち、振動を感じる。",["","マイスナー小体は真皮の浅い層(乳頭)にあり、触覚を感じる。","メルケル盤は表皮の基底部にある。","自由神経終末は被膜をもたず、痛覚や温度覚を感じる。"]]]},
{"id":"a11","g":"a","k":"体","name":"体表解剖","q":[["首を前に曲げたとき、首の付け根で最も突き出る棘突起はどれか。",["第2頸椎","第5頸椎","第7頸椎","第3胸椎"],2,"第7頸椎は棘突起が長く、隆椎とよばれる。",["第2頸椎(軸椎)は首の上部にある。","第5頸椎は目立たない。","","第3胸椎はもっと下。"]],["大腿三角(スカルパ三角)で拍動を触れる動脈はどれか。",["膝窩動脈","大腿動脈","後脛骨動脈","足背動脈"],1,"大腿動脈は鼡径靱帯のすぐ下、大腿三角で拍動を触れる。",["膝窩動脈は膝の裏で触れる。","","後脛骨動脈は内果(内くるぶし)の後ろで触れる。","足背動脈は足の甲で触れる。"]],["解剖学的嗅ぎタバコ窩(タバチエール)の底で触れる骨はどれか。",["豆状骨","舟状骨","有鉤骨","尺骨茎状突起"],1,"母指を伸ばすと手首の母指側にできるくぼみ。底に舟状骨を触れ、橈骨動脈の拍動もわかる。",["豆状骨は小指側の手首にある。","","有鉤骨は小指側の手のひら寄りにある。","尺骨茎状突起は小指側の手首にある。"]],["耳の穴(外耳孔)のすぐ前で拍動を触れる動脈はどれか。",["顔面動脈","浅側頭動脈","後頭動脈","総頸動脈"],1,"浅側頭動脈は外耳孔の前で拍動を触れる。",["顔面動脈は下顎骨の下縁で触れる。","","後頭動脈は後頭部で触れる。","総頸動脈は首の前で触れる。"]],["咬筋の前縁で、下顎骨の下縁に拍動を触れる動脈はどれか。",["顔面動脈","浅側頭動脈","舌動脈","上甲状腺動脈"],0,"顔面動脈は咬筋の前縁で下顎骨を越えるところで拍動を触れる。",["","浅側頭動脈は耳の前で触れる。","舌動脈は触れにくい。","上甲状腺動脈は触れる部位として一般的ではない。"]],["胸鎖乳突筋の前縁で、甲状軟骨の高さに拍動を触れる動脈はどれか。",["鎖骨下動脈","総頸動脈","椎骨動脈","浅側頭動脈"],1,"総頸動脈は甲状軟骨の高さで、胸鎖乳突筋の前縁に拍動を触れる。",["鎖骨下動脈は鎖骨の上のくぼみで触れる。","","椎骨動脈は横突孔の中を通るので触れられない。","浅側頭動脈は耳の前で触れる。"]],["鎖骨の上のくぼみ(鎖骨上窩)の奥で拍動を触れる動脈はどれか。",["総頸動脈","鎖骨下動脈","腋窩動脈","内胸動脈"],1,"鎖骨下動脈は鎖骨上窩で、第1肋骨に押しつけるようにして拍動を触れる。",["総頸動脈は首の前で触れる。","","腋窩動脈はわきの下で触れる。","内胸動脈は胸骨の裏を走り、触れにくい。"]],["肘窩で、上腕二頭筋の腱の内側に拍動を触れる動脈はどれか。",["尺骨動脈","橈骨動脈","上腕動脈","腋窩動脈"],2,"上腕動脈は肘窩で上腕二頭筋腱の内側を通り、血圧測定で聴診器を当てる場所。",["尺骨動脈は手首の小指側で触れる。","橈骨動脈は手首の母指側で触れる。","","腋窩動脈はわきの下で触れる。"]],["脈拍を測るのによく使う、手首の母指側で触れる動脈はどれか。",["尺骨動脈","前骨間動脈","上腕動脈","橈骨動脈"],3,"橈骨動脈は手首の母指側、橈側手根屈筋腱の外側で触れる。",["尺骨動脈は手首の小指側。","前骨間動脈は深いところを走り触れない。","上腕動脈は肘窩で触れる。",""]],["足背動脈の拍動を触れる目安となる位置はどれか。",["アキレス腱の内側","内果の後ろ","外果の後ろ","長母趾伸筋腱の外側"],3,"足背動脈は足の甲で、長母趾伸筋腱のすぐ外側に触れる。",["アキレス腱の内側ではない。","内果の後ろでは後脛骨動脈を触れる。","外果の後ろには触れる太い動脈はない。",""]],["大腿三角(スカルパ三角)の境界をつくらないものはどれか。",["鼡径靱帯","大腿直筋","長内転筋","縫工筋"],1,"大腿三角は上が鼡径靱帯、外側が縫工筋、内側が長内転筋で囲まれる。",["鼡径靱帯は上の境界。","","長内転筋は内側の境界。","縫工筋は外側の境界。"]],["大腿三角で、外側から内側への並びとして正しいのはどれか。",["大腿動脈→大腿神経→大腿静脈","大腿神経→大腿動脈→大腿静脈","大腿静脈→大腿動脈→大腿神経","大腿動脈→大腿静脈→大腿神経"],1,"大腿三角では外側から神経・動脈・静脈の順に並ぶ。",["神経が最も外側。","","これは内側からの順。","神経が最も外側。"]],["解剖学的嗅ぎタバコ窩の尺側(手の甲側)の縁をつくる腱はどれか。",["長母指伸筋腱","短母指伸筋腱","長母指外転筋腱","橈側手根屈筋腱"],0,"嗅ぎタバコ窩は、尺側を長母指伸筋腱、橈側を短母指伸筋腱と長母指外転筋腱で囲まれる。",["","短母指伸筋腱は橈側の縁。","長母指外転筋腱は橈側の縁。","橈側手根屈筋腱は手のひら側にある。"]],["肘で、内側上顆の後ろに触れる神経はどれか。",["正中神経","橈骨神経","筋皮神経","尺骨神経"],3,"尺骨神経は内側上顆の後ろの溝を通り、ぶつけると小指側にしびれが走る。",["正中神経は肘窩の内側寄りを通る。","橈骨神経は肘の外側寄りを通る。","筋皮神経は肘の外側で皮膚に出る。",""]],["膝を伸ばしたとき、膝蓋骨の下で触れる骨の隆起はどれか。",["脛骨粗面","腓骨頭","内果","大転子"],0,"脛骨粗面は膝蓋骨の下にある隆起で、膝蓋靱帯が付く。",["","腓骨頭は膝の外側下方。","内果は足首の内側。","大転子は大腿の上部外側。"]],["内果の後ろを通る神経はどれか。",["脛骨神経","浅腓骨神経","深腓骨神経","腓腹神経"],0,"脛骨神経は後脛骨動脈とともに内果の後ろを通り、足底へ向かう。",["","浅腓骨神経は下腿の外側から足背へ出る。","深腓骨神経は足首の前を通る。","腓腹神経は外果の後ろを通る。"]],["外果の後ろを通る腱はどれか。",["前脛骨筋の腱","後脛骨筋の腱","長腓骨筋と短腓骨筋の腱","長母趾伸筋の腱"],2,"長腓骨筋と短腓骨筋の腱は外果の後ろを回って足へ向かう。",["前脛骨筋の腱は足首の前を通る。","後脛骨筋の腱は内果の後ろを通る。","","長母趾伸筋の腱は足首の前を通る。"]],["大腿の外側上部で触れる大腿骨の隆起はどれか。",["外側上顆","小転子","大転子","大腿骨頭"],2,"大転子は大腿の外側上部で触れ、中殿筋などが付く。",["外側上顆は膝の外側。","小転子は内側後方にあり、触れにくい。","","大腿骨頭は寛骨臼の中にあり、触れにくい。"]],["肋骨弓をつくる肋軟骨はどれか。",["第1〜3肋軟骨","第4〜6肋軟骨","第7〜10肋軟骨","第11〜12肋軟骨"],2,"第7〜10肋軟骨がつながって、胸郭の下縁(肋骨弓)をつくる。",["第1〜3肋軟骨は胸骨の上部に付く。","第4〜6肋軟骨は胸骨体に付く。","","第11〜12肋骨は浮遊肋で、肋骨弓に加わらない。"]],["マックバーニー点はどこか。",["臍のすぐ下","左右の上前腸骨棘を結ぶ線の右3分の1の点","臍と右上前腸骨棘を結ぶ線の外側3分の1の点","左上前腸骨棘のすぐ内側"],2,"マックバーニー点は虫垂炎で押すと痛む代表的な点。",["臍のすぐ下ではない。","左右の上前腸骨棘を結ぶ線の右3分の1の点はランツ点。","","左側ではない。"]],["ランツ点はどこか。",["臍と右上前腸骨棘を結ぶ線の外側3分の1の点","左右の上前腸骨棘を結ぶ線の右3分の1の点","左右の腸骨稜の最高点を結ぶ線の中央","右肋骨弓の中央"],1,"ランツ点もマックバーニー点と同じく虫垂炎の圧痛点。",["これはマックバーニー点。","","これはヤコビー線の中央で、腰椎の目安。","右肋骨弓の中央ではない。"]],["正常な肝臓の下縁はおよそどこにあるか。",["右肋骨弓に沿った位置","臍の高さ","右鼡径部","左肋骨弓に沿った位置"],0,"正常な肝臓の下縁は、ほぼ右肋骨弓に沿っており、ふつうは触れにくい。",["","臍の高さまで触れるときは肝臓が大きくなっている。","鼡径部ではない。","肝臓は主に右側にある。"]],["第2肋間の胸骨の右縁で、最もよく聴こえる弁の音はどれか。",["大動脈弁","肺動脈弁","三尖弁","僧帽弁"],0,"大動脈弁は第2肋間胸骨右縁、肺動脈弁は第2肋間胸骨左縁、三尖弁は第4肋間胸骨左縁、僧帽弁は心尖部で聴く。",["","肺動脈弁は第2肋間胸骨左縁。","三尖弁は第4肋間胸骨左縁。","僧帽弁は心尖部。"]],["腋窩(わきの下)の前の壁をつくる筋はどれか。",["大円筋","広背筋","大胸筋","前鋸筋"],2,"腋窩の前壁は大胸筋(と小胸筋)、後壁は広背筋・大円筋などでつくられる。",["大円筋は後壁。","広背筋は後壁。","","前鋸筋は内側壁。"]],["膝蓋腱反射でハンマーでたたく部位はどれか。",["アキレス腱","膝蓋靱帯","大腿四頭筋の筋腹","脛骨粗面の下"],1,"膝蓋骨と脛骨粗面の間の膝蓋靱帯をたたくと、大腿四頭筋が収縮して膝が伸びる。",["アキレス腱はアキレス腱反射でたたく。","","筋腹ではない。","脛骨粗面より下ではない。"]],["耳たぶの後ろで触れる側頭骨の突起はどれか。",["茎状突起","乳様突起","頬骨弓","外後頭隆起"],1,"乳様突起は耳の後ろ下方で触れ、胸鎖乳突筋が付く。",["茎状突起は深いところにあり、触れにくい。","","頬骨弓は頬の横で触れる。","外後頭隆起は後頭部の中央で触れる(後頭骨)。"]],["後頭部の中央で触れる骨の隆起はどれか。",["外後頭隆起","乳様突起","頬骨弓","茎状突起"],0,"外後頭隆起は後頭骨の後面中央の出っ張りで、首の後ろの上方で触れる。",["","乳様突起は耳の後ろ下方で触れる。","頬骨弓は頬の横で触れる。","茎状突起は深いところにあり触れにくい。"]],["左右の鎖骨の内側端の間で、胸骨柄の上縁にあるくぼみはどれか。",["剣状突起","胸骨角","頸切痕","鎖骨上窩"],2,"頸切痕は胸骨柄の上縁にあるくぼみで、のど元の下で触れる。",["剣状突起は胸骨の下端。","胸骨角は胸骨柄と胸骨体の境の出っ張り。","","鎖骨上窩は鎖骨の上の外側のくぼみ。"]],["膝の外側下方で触れる、腓骨の上端はどれか。",["脛骨粗面","腓骨頭","外果","外側上顆"],1,"腓骨頭は膝の外側の下方で触れ、大腿二頭筋や外側側副靱帯が付く。",["脛骨粗面は膝蓋骨の下の前面。","","外果は腓骨の下端(足首)。","外側上顆は大腿骨や上腕骨にある。"]],["肘を曲げたとき、肘の後ろで最も突き出る骨の部分はどれか。",["内側上顆","肘頭","外側上顆","橈骨頭"],1,"肘頭は尺骨の上端で、肘の後ろで触れる。上腕三頭筋が付く。",["内側上顆は肘の内側。","","外側上顆は肘の外側。","橈骨頭は肘の外側で、前腕を回すと動く。"]]]},
{"id":"p1","g":"p","k":"細","name":"細胞・体液","q":[["細胞内液に最も多い陽イオンはどれか。",["Na⁺","K⁺","Ca²⁺","Mg²⁺"],1,"細胞内はK⁺が多く、細胞外はNa⁺が多い。",["Na⁺は細胞外液に最も多い陽イオン。","","Ca²⁺は細胞内ではごくわずか。","Mg²⁺は細胞内に多いが、K⁺ほどではない。"]],["成人男性の体重に占める体液(水分)のおよその割合はどれか。",["20%","40%","60%","80%"],2,"体液は体重の約60%。そのうち細胞内液が約40%、細胞外液が約20%。",["20%は細胞外液の割合。","40%は細胞内液の割合。","","80%は多すぎる。"]],["ATPを主につくる細胞小器官はどれか。",["リボソーム","ゴルジ装置","リソソーム","ミトコンドリア"],3,"ミトコンドリアは酸素を使ってATP(エネルギー)をつくる。",["リボソームはたんぱく質を合成する。","ゴルジ装置はたんぱく質を加工・分泌する。","リソソームは不要な物質を分解する。",""]],["ATPを使い、濃度の低い側から高い側へ物質を運ぶしくみはどれか。",["単純拡散","促進拡散","能動輸送","浸透"],2,"能動輸送の代表はNa⁺-K⁺ポンプ。ATPを使ってNa⁺を外へ、K⁺を中へ運ぶ。",["単純拡散は濃度の高い側から低い側へ、エネルギーなしで動く。","促進拡散は運び役のたんぱく質を使うが、エネルギーは使わず高い側から低い側へ動く。","","浸透は水が溶液の薄い側から濃い側へ移る現象。"]],["DNAに含まれない塩基はどれか。",["アデニン","ウラシル","シトシン","グアニン"],1,"ウラシルはRNAだけにある。DNAではウラシルの代わりにチミンが使われる。",["アデニンはDNA・RNAの両方にある。","","シトシンは両方にある。","グアニンは両方にある。"]],["細胞外液に最も多い陽イオンはどれか。",["Na⁺","K⁺","Ca²⁺","Mg²⁺"],0,"細胞外液はNa⁺が最も多く、細胞内液はK⁺が最も多い。",["","K⁺は細胞内液に多い。","Ca²⁺は少ない。","Mg²⁺は細胞内に多い。"]],["細胞外液に最も多い陰イオンはどれか。",["たんぱく質","HCO₃⁻","リン酸イオン","Cl⁻"],3,"細胞外液の陰イオンはCl⁻が最も多く、次にHCO₃⁻が多い。",["たんぱく質(陰イオン)は細胞内液に多い。","HCO₃⁻は2番目に多い。","リン酸イオンは細胞内液に多い。",""]],["細胞内液に多い陰イオンはどれか。",["Cl⁻","HCO₃⁻","リン酸イオン","Na⁺"],2,"細胞内液の陰イオンはリン酸イオンとたんぱく質が多い。",["Cl⁻は細胞外液に多い。","HCO₃⁻は細胞外液に多い。","","Na⁺は陽イオン。"]],["細胞外液のうち、最も量が多いものはどれか。",["血漿","リンパ","間質液(組織間液)","脳脊髄液"],2,"細胞外液(体重の約20%)の大部分は間質液(約15%)で、血漿は約5%。",["血漿は間質液より少ない。","リンパはごく少量。","","脳脊髄液はごく少量。"]],["血漿の量は体重のおよそ何%か。",["約1%","約5%","約15%","約40%"],1,"血漿は体重の約5%(4〜5%)。",["約1%では少なすぎる。","","約15%は間質液の量。","約40%は細胞内液の量。"]],["細胞膜の主な成分はどれか。",["リン脂質","グリコーゲン","核酸","コラーゲン"],0,"細胞膜はリン脂質の二重層に、たんぱく質が埋め込まれたつくり。",["","グリコーゲンは糖の貯蔵形。","核酸はDNAやRNA。","コラーゲンは細胞の外の線維。"]],["たんぱく質を合成する場所はどれか。",["ミトコンドリア","リボソーム","リソソーム","中心体"],1,"リボソームでmRNAの情報をもとにアミノ酸がつながれ、たんぱく質がつくられる。",["ミトコンドリアはATPをつくる。","","リソソームは物質を分解する。","中心体は細胞分裂に関わる。"]],["DNAの遺伝情報をRNAに写し取ることを何というか。",["転写","複製","翻訳","突然変異"],0,"DNAからmRNAをつくることを転写、mRNAからたんぱく質をつくることを翻訳という。",["","複製はDNAをコピーしてDNAをつくること。","翻訳はmRNAの情報からたんぱく質をつくること。","突然変異は遺伝情報が変わること。"]],["ヒトの体細胞の染色体の数はどれか。",["23本","44本","46本","48本"],2,"ヒトの体細胞は46本(22対の常染色体+1対の性染色体)の染色体をもつ。",["23本は精子や卵子の数。","44本は常染色体の数。","","48本ではない。"]],["減数分裂によってできる細胞はどれか。",["皮膚の細胞","肝細胞","赤血球","精子・卵子"],3,"減数分裂は生殖細胞(精子・卵子)をつくるときに起こり、染色体の数が半分になる。",["皮膚の細胞は体細胞分裂で増える。","肝細胞は体細胞分裂で増える。","赤血球は核をもたず、分裂しない。",""]],["血漿の浸透圧(晶質浸透圧)を主に決めているものはどれか。",["アルブミン","Na⁺","ブドウ糖","尿素"],1,"血漿の浸透圧の大部分はNa⁺とそれに伴う陰イオン(Cl⁻など)でつくられる。",["アルブミンは膠質浸透圧をつくるが、浸透圧全体に占める割合は小さい。","","ブドウ糖の寄与は小さい。","尿素の寄与は小さい。"]],["膠質浸透圧を主につくる血漿成分はどれか。",["アルブミン","グロブリン","フィブリノゲン","Na⁺"],0,"アルブミンは血漿たんぱく質で最も多く、膠質浸透圧をつくって水分を血管内に保つ。",["","グロブリンは主に免疫に働く。","フィブリノゲンは血液凝固に働く。","Na⁺は晶質浸透圧をつくる。"]],["血漿と同じ浸透圧(等張)の食塩水の濃度はどれか。",["約0.1%","約0.9%","約3%","約9%"],1,"約0.9%の食塩水(生理食塩水)は血漿とほぼ等張。",["約0.1%は低張。","","約3%は高張。","約9%は高張。"]],["赤血球を低張の液に入れるとどうなるか。",["変化しない","水が出て縮む","水が入って膨らみ、壊れる","固まる"],2,"低張液では水が赤血球の中に入り、膨らんで壊れる(溶血)。",["低張液では変化する。","縮むのは高張液に入れたとき。","","固まらない。"]],["健康な人の動脈血のpHはおよそどれか。",["6.8","7.0","7.4","8.0"],2,"動脈血のpHは7.35〜7.45の弱アルカリ性に保たれている。",["6.8は強い酸性に傾いた状態。","7.0は酸性側に傾いた状態。","","8.0はアルカリ性に傾きすぎ。"]],["血液のpHを保つのに最も重要な緩衝系はどれか。",["重炭酸緩衝系","リン酸緩衝系","アンモニア緩衝系","乳酸緩衝系"],0,"細胞外液では重炭酸(HCO₃⁻/CO₂)の緩衝系が最も重要で、肺と腎臓で調節される。",["","リン酸緩衝系は主に細胞内や尿で働く。","アンモニアは腎臓で酸の排泄を助けるが、血液の主な緩衝系ではない。","乳酸緩衝系という主要な緩衝系はない。"]],["リボソームが付着した小胞体はどれか。",["ゴルジ装置","滑面小胞体","粗面小胞体","核膜孔"],2,"粗面小胞体はリボソームが付いており、たんぱく質の合成に働く。",["ゴルジ装置は小胞体ではない。","滑面小胞体はリボソームがなく、脂質の合成やCa²⁺の貯蔵に働く。","","核膜孔は核膜の孔。"]],["核の中にあり、リボソームのRNAをつくる部分はどれか。",["核小体","中心体","ゴルジ装置","リソソーム"],0,"核小体はリボソームRNAをつくる場所。",["","中心体は核の外にあり、細胞分裂に関わる。","ゴルジ装置は核の外にある。","リソソームは核の外にある。"]],["中心体の働きはどれか。",["細胞分裂で紡錘体をつくる","ATPをつくる","たんぱく質を合成する","物質を分解する"],0,"中心体は細胞分裂のとき紡錘体をつくり、染色体を両極へ分ける。",["","ATPをつくるのはミトコンドリア。","たんぱく質を合成するのはリボソーム。","物質を分解するのはリソソーム。"]],["不感蒸泄に含まれるものはどれか。",["尿","便","呼気に含まれる水分","発汗"],2,"不感蒸泄は、自覚なく皮膚と呼気から失われる水分で、発汗は含まない。",["尿は不感蒸泄ではない。","便は不感蒸泄ではない。","","発汗は不感蒸泄に含めない。"]],["細胞が大きな物質を膜で包み込んで取り込むしくみはどれか。",["単純拡散","エキソサイトーシス","エンドサイトーシス","浸透"],2,"エンドサイトーシスは細胞膜がくぼんで物質を包み込み、細胞内へ取り込むしくみ。",["単純拡散は小さな物質が膜を通り抜けること。","エキソサイトーシスは細胞内の物質を膜の外へ出すしくみ(分泌など)。","","浸透は水が移動する現象。"]],["細胞膜をそのまま通り抜けやすい物質はどれか。",["たんぱく質","Na⁺","ブドウ糖","酸素"],3,"酸素や二酸化炭素は小さく脂に溶けやすいため、リン脂質の膜を単純拡散で通る。",["たんぱく質は大きく、膜を通り抜けられない。","Na⁺はイオンなので、チャネルなどを通らないと膜を通れない。","ブドウ糖は運び役のたんぱく質(輸送体)が必要。",""]],["水を通す細胞膜のたんぱく質はどれか。",["アクチン","ヘモグロビン","アクアポリン","インスリン"],2,"アクアポリンは水の通り道となる膜たんぱく質で、集合管などで働く。",["アクチンは筋の細いフィラメントなど。","ヘモグロビンは酸素を運ぶ。","","インスリンはホルモン。"]],["Na⁺-K⁺ポンプが1回に運ぶイオンの組み合わせはどれか。",["Na⁺を3個中へ、K⁺を2個外へ","Na⁺を2個外へ、K⁺を3個中へ","Na⁺を3個外へ、K⁺を2個中へ","Na⁺とK⁺を1個ずつ外へ"],2,"Na⁺-K⁺ポンプはATP1分子を使い、Na⁺を3個外へ出し、K⁺を2個中へ入れる。",["向きが逆。","数が逆。","","1個ずつではない。"]],["DNAでアデニンと対になる塩基はどれか。",["グアニン","シトシン","ウラシル","チミン"],3,"DNAではアデニンとチミン、グアニンとシトシンが対になる。",["グアニンはシトシンと対になる。","シトシンはグアニンと対になる。","ウラシルはRNAにあり、RNAではアデニンと対になる。",""]]]},
{"id":"p2","g":"p","k":"血","name":"血液","q":[["赤血球の寿命はおよそどれか。",["約10日","約30日","約120日","約1年"],2,"赤血球は約120日働き、主に脾臓で壊される。",["約10日は血小板の寿命に近い。","約30日ではない。","","約1年ではない。"]],["血液凝固に必要なイオンはどれか。",["Na⁺","K⁺","Ca²⁺","Cl⁻"],2,"Ca²⁺は凝固因子のひとつ(第IV因子)。採血でクエン酸などを加えてCa²⁺を除くと固まらない。",["Na⁺は凝固に直接は必要ない。","K⁺は凝固に直接は必要ない。","","Cl⁻は凝固に直接は必要ない。"]],["抗体をつくる細胞はどれか。",["好中球","形質細胞","T細胞","赤血球"],1,"B細胞が形質細胞に変わり、抗体(免疫グロブリン)をつくる。",["好中球は細菌を取り込んで処理する(食作用)。","","T細胞は細胞性免疫を担い、抗体はつくらない。","赤血球は酸素を運ぶ。"]],["白血球のなかで最も数が多いのはどれか。",["好酸球","リンパ球","単球","好中球"],3,"好中球は白血球の半分以上を占め、細菌感染で増える。",["好酸球は数%程度で、アレルギーや寄生虫で増える。","リンパ球は2番目に多い。","単球は数%程度。",""]],["ABO式血液型でO型の人の血漿に含まれる凝集素(抗体)はどれか。",["抗Aと抗B","抗Aのみ","抗Bのみ","含まれない"],0,"O型は赤血球にA・B抗原がなく、血漿に抗A・抗Bの両方をもつ。",["","抗Aのみを含むのはB型。","抗Bのみを含むのはA型。","凝集素を含まないのはAB型。"]],["成人の血液量は体重のおよそどれくらいか。",["約1/5","約1/13","約1/30","約1/50"],1,"血液量は体重の約1/13(約8%)。体重60kgなら約4.6L。",["約1/5では多すぎる。","","約1/30では少なすぎる。","約1/50では少なすぎる。"]],["血清に含まれないものはどれか。",["フィブリノゲン","グロブリン","ブドウ糖","アルブミン"],0,"血清は血液が固まった後の液体で、血漿から凝固に使われたフィブリノゲンなどを除いたもの。",["","グロブリンは血清に含まれる。","ブドウ糖は血清に含まれる。","アルブミンは血清に含まれる。"]],["ヘマトクリット値が表すものはどれか。",["赤血球の数","血液中のヘモグロビンの量","血液に占める赤血球の容積の割合","血漿たんぱく質の濃度"],2,"ヘマトクリットは血液全体のうち赤血球が占める容積の割合で、成人男性で約45%。",["赤血球の数は赤血球数。","ヘモグロビン量は別の検査値。","","血漿たんぱく質の濃度ではない。"]],["成熟した赤血球の特徴はどれか。",["核がない","ミトコンドリアが多い","球形である","アメーバ運動をする"],0,"成熟した赤血球は核やミトコンドリアをもたず、中央がくぼんだ円盤形をしている。",["","ミトコンドリアはもたない。","円盤形で、球形ではない。","アメーバ運動をするのは白血球。"]],["成人で赤血球がつくられる場所はどれか。",["脾臓","肝臓","骨髄","リンパ節"],2,"成人では赤色骨髄で赤血球がつくられる。",["脾臓は古い赤血球を壊す。","肝臓は胎児期に血液をつくる。","","リンパ節はリンパ球に関わる。"]],["ヘモグロビンに含まれる金属はどれか。",["銅","亜鉛","鉄","マグネシウム"],2,"ヘモグロビンのヘムに鉄が含まれ、酸素と結合する。",["銅は含まれない。","亜鉛は含まれない。","","マグネシウムは含まれない。"]],["ヘモグロビンが壊されてできる黄色い色素はどれか。",["ビリルビン","メラニン","カロテン","ヘパリン"],0,"ヘモグロビンのヘムはビリルビンになり、肝臓で処理されて胆汁に出る。",["","メラニンは皮膚などの色素。","カロテンは植物の色素。","ヘパリンは血液を固まりにくくする物質。"]],["不足すると巨赤芽球性貧血を起こすビタミンはどれか。",["ビタミンB₁₂","ビタミンD","ビタミンK","ビタミンC"],0,"ビタミンB₁₂や葉酸が不足すると、赤血球のもとの細胞が正常に分裂できず巨赤芽球性貧血になる。",["","ビタミンDはカルシウムの吸収に関わる。","ビタミンKは血液凝固に関わる。","ビタミンCは鉄の吸収を助けるが、巨赤芽球性貧血の原因ではない。"]],["血液凝固因子をつくるのに必要なビタミンはどれか。",["ビタミンA","ビタミンK","ビタミンB₁","ビタミンE"],1,"ビタミンKは肝臓でいくつかの凝固因子をつくるのに必要。",["ビタミンAは視覚などに関わる。","","ビタミンB₁は糖の代謝に関わる。","ビタミンEは抗酸化作用をもつ。"]],["血管が傷ついたとき、最初に集まって傷口をふさぐのはどれか。",["赤血球","血小板","好中球","リンパ球"],1,"血小板が集まって血小板血栓をつくる(一次止血)。その後、凝固因子が働きフィブリンで固める。",["赤血球は酸素を運ぶ。","","好中球は細菌を処理する。","リンパ球は免疫を担う。"]],["フィブリノゲンをフィブリンに変える酵素はどれか。",["プラスミン","トロンビン","ペプシン","アミラーゼ"],1,"トロンビンがフィブリノゲンを網状のフィブリンに変え、血液を固める。",["プラスミンはフィブリンを溶かす。","","ペプシンは胃でたんぱく質を分解する。","アミラーゼはデンプンを分解する。"]],["フィブリンを溶かす酵素はどれか。",["トロンビン","リパーゼ","トリプシン","プラスミン"],3,"プラスミンはフィブリンを分解して血栓を溶かす(線溶)。",["トロンビンはフィブリンをつくる。","リパーゼは脂肪を分解する消化酵素。","トリプシンは消化酵素。",""]],["血液を固まりにくくする物質はどれか。",["フィブリノゲン","ヘパリン","トロンビン","ビタミンK"],1,"ヘパリンはトロンビンの働きを妨げ、血液を固まりにくくする。",["フィブリノゲンは固める材料。","","トロンビンは固める酵素。","ビタミンKは凝固因子づくりに必要。"]],["アレルギーや寄生虫の感染で増える白血球はどれか。",["好中球","リンパ球","単球","好酸球"],3,"好酸球はアレルギー反応や寄生虫感染で増える。",["好中球は主に細菌感染で増える。","リンパ球はウイルス感染などで増えることがある。","単球は組織でマクロファージになる。",""]],["ヒスタミンを含む顆粒をもつ白血球はどれか。",["好中球","好酸球","好塩基球","単球"],2,"好塩基球はヒスタミンやヘパリンを含み、アレルギー反応に関わる。",["好中球は細菌を取り込む。","好酸球はアレルギーで増えるが、ヒスタミンを含む代表ではない。","","単球はマクロファージになる。"]],["血管の外に出てマクロファージになる白血球はどれか。",["好中球","好酸球","リンパ球","単球"],3,"単球は組織に出るとマクロファージになり、異物を取り込む。",["好中球はマクロファージにはならない。","好酸球はマクロファージにはならない。","リンパ球はマクロファージにはならない。",""]],["細胞性免疫を主に担う細胞はどれか。",["B細胞","血小板","赤血球","T細胞"],3,"T細胞はウイルスに感染した細胞などを直接攻撃する(細胞性免疫)。",["B細胞は抗体をつくる体液性免疫を担う。","血小板は止血に働く。","赤血球は酸素を運ぶ。",""]],["取り込んだ異物の情報をT細胞に伝える(抗原提示)細胞はどれか。",["好塩基球","赤血球","血小板","マクロファージ"],3,"マクロファージや樹状細胞は取り込んだ異物の断片をT細胞に示し、免疫を始動させる。",["好塩基球は主にアレルギーに関わる。","赤血球は抗原提示をしない。","血小板は抗原提示をしない。",""]],["胎盤を通って母から胎児へ移る抗体はどれか。",["IgA","IgG","IgE","IgM"],1,"IgGは胎盤を通る唯一の抗体で、生まれたばかりの赤ちゃんを守る。",["IgAは母乳に多い。","","IgEはアレルギーに関わる。","IgMは大きく胎盤を通らない。"]],["感染して最初につくられる抗体はどれか。",["IgA","IgE","IgG","IgM"],3,"感染の初めにはIgMがつくられ、遅れてIgGが増える。",["IgAは粘膜や母乳に多い。","IgEはアレルギーに関わる。","IgGはIgMに遅れて増える。",""]],["母乳や唾液などの分泌液に多く含まれる抗体はどれか。",["IgG","IgE","IgA","IgM"],2,"IgAは粘膜の表面や母乳・唾液・涙などに多く、粘膜を守る。",["IgGは血液中に最も多い。","IgEはアレルギーに関わる。","","IgMは感染初期につくられる。"]],["花粉症などの即時型アレルギーに関わる抗体はどれか。",["IgA","IgM","IgG","IgE"],3,"IgEは好塩基球や肥満細胞に結合し、ヒスタミンなどを放出させる。",["IgAは粘膜を守る。","IgMは感染初期の抗体。","IgGは血液中に最も多い抗体。",""]],["Rh式血液型の不適合で、胎児に問題が起こりやすい組み合わせはどれか。",["母も胎児もRh陰性","母がRh陽性、胎児がRh陰性","母も胎児もRh陽性","母がRh陰性、胎児がRh陽性"],3,"Rh陰性の母がRh陽性の胎児を妊娠すると抗体ができ、次の妊娠で胎児の赤血球が壊されることがある。",["同じ型なので問題は起こらない。","この組み合わせでは問題は起こりにくい。","同じ型なので問題は起こらない。",""]],["B型の人の赤血球の表面にある抗原はどれか。",["A抗原","抗原はない","A抗原とB抗原","B抗原"],3,"B型の赤血球にはB抗原があり、血漿には抗A凝集素がある。",["A抗原はA型。","抗原がないのはO型。","A抗原とB抗原の両方はAB型。",""]],["成人男性の赤血球数はおよそどれくらいか(1µLあたり)。",["約5万","約50万","約500万","約5000万"],2,"赤血球数は成人男性で約500万/µL、女性で約450万/µLが目安。",["約5万では少なすぎる。","約50万では少なすぎる。","","約5000万では多すぎる。"]]]},
{"id":"p3","g":"p","k":"循","name":"循環","q":[["心臓のリズムをつくるペースメーカーはどれか。",["ヒス束","房室結節","洞房結節","プルキンエ線維"],2,"洞房結節は右心房にあり、最も速く自動的に興奮して心拍のリズムを決める。",["ヒス束は房室結節から心室へ興奮を伝える。","房室結節は心房からの興奮を少し遅らせて心室へ伝える。","","プルキンエ線維は心室の筋に興奮を広げる。"]],["心電図のQRS波が表すのはどれか。",["心房の興奮","心室の興奮","心室の興奮からの回復","房室間の伝導時間"],1,"QRS波は心室の興奮(脱分極)を表す。",["心房の興奮はP波。","","心室の回復(再分極)はT波。","房室間の伝導時間はPQ間隔。"]],["心拍数を減らすのはどれか。",["交感神経の興奮","アドレナリン","迷走神経の興奮","体温の上昇"],2,"迷走神経(副交感神経)は洞房結節に働き、心拍数を減らす。",["交感神経は心拍数を増やす。","アドレナリンは心拍数を増やす。","","体温が上がると心拍数は増える。"]],["血圧が上がり、頸動脈洞の圧受容器が刺激されたときに起こる反応はどれか。",["心拍数が増える","心臓の収縮力が強まる","末梢の血管が収縮する","心拍数が減る"],3,"圧受容器反射により迷走神経が働き、交感神経が抑えられて心拍数が減り、血圧が下がる。",["心拍数は減る。","収縮力は弱まる。","末梢の血管は拡張する。",""]],["心音のI音が生じるのはどのときか。",["房室弁が閉じるとき","動脈弁が閉じるとき","房室弁が開くとき","動脈弁が開くとき"],0,"I音は心室の収縮が始まり、房室弁(僧帽弁・三尖弁)が閉じるときの音。",["","動脈弁が閉じる音はII音。","弁が開くときは、正常ではほとんど音がしない。","弁が開くときは、正常ではほとんど音がしない。"]],["心拍出量を求める式はどれか。",["1回拍出量×心拍数","1回拍出量÷心拍数","血圧×心拍数","血圧÷末梢血管抵抗"],0,"心拍出量(1分間に心臓が送り出す血液量)=1回拍出量×心拍数。安静時で約5L/分。",["","割り算ではない。","血圧は使わない。","これは心拍出量の式ではない。"]],["安静時の成人の1回拍出量はおよそどれか。",["約7mL","約70mL","約700mL","約7L"],1,"安静時の1回拍出量は約70mL。心拍数70回/分なら心拍出量は約5L/分になる。",["約7mLでは少なすぎる。","","約700mLでは多すぎる。","約7Lでは多すぎる。"]],["心室に戻る血液が多く、心筋が引き伸ばされるほど収縮力が強くなるという法則はどれか。",["全か無かの法則","スターリングの心臓の法則","ベル・マジャンディの法則","ボイルの法則"],1,"スターリングの心臓の法則により、戻ってきた血液量に応じて送り出す量が調整される。",["全か無かの法則は、刺激が閾値を超えると最大の反応が起こるという法則。","","ベル・マジャンディの法則は、後根が感覚・前根が運動という法則。","ボイルの法則は気体の圧と体積の関係。"]],["心筋が強縮を起こさない理由はどれか。",["Ca²⁺を使わない","筋線維が細い","不応期が長い","神経に支配されない"],2,"心筋は不応期が長いため、収縮が終わるまで次の興奮が起こらず、強縮しない。",["心筋の収縮にもCa²⁺が必要。","細さは関係ない。","","心筋は自律神経の調節を受ける。"]],["刺激伝導系で、興奮が伝わる速さが最も遅い部位はどれか。",["洞房結節","ヒス束","房室結節","プルキンエ線維"],2,"房室結節では伝導がゆっくりになり、心房が収縮し終えてから心室が収縮できる。",["洞房結節はリズムをつくる部位。","ヒス束は速く伝える。","","プルキンエ線維は最も速く伝える。"]],["刺激伝導系の順序として正しいのはどれか。",["洞房結節→房室結節→プルキンエ線維→左右の脚→ヒス束","房室結節→洞房結節→ヒス束→左右の脚→プルキンエ線維","洞房結節→ヒス束→房室結節→左右の脚→プルキンエ線維","洞房結節→房室結節→ヒス束→左右の脚→プルキンエ線維"],3,"興奮は洞房結節から始まり、房室結節・ヒス束・左右の脚を経てプルキンエ線維で心室全体に広がる。",["ヒス束と脚はプルキンエ線維より先。","洞房結節が最初。","房室結節がヒス束より先。",""]],["心室が収縮し始めたが、まだすべての弁が閉じていて容積が変わらない時期はどれか。",["駆出期","等容性収縮期","等容性弛緩期","充満期"],1,"等容性収縮期は房室弁が閉じたあと、動脈弁が開くまでの時期で、心室内圧が急に上がる。",["駆出期は動脈弁が開き、血液が送り出される時期。","","等容性弛緩期は収縮の後、心室がゆるむ初めの時期。","充満期は房室弁が開き、心室に血液が入る時期。"]],["血圧を決める2つの要素の組み合わせはどれか。",["心拍出量と末梢血管抵抗","心拍数と体温","赤血球数と血小板数","呼吸数と心拍数"],0,"血圧は心拍出量×末梢血管抵抗で決まる。",["","体温は直接の要素ではない。","直接の要素ではない。","呼吸数は直接の要素ではない。"]],["血流に対する抵抗が最も大きい血管はどれか。",["細動脈","大動脈","毛細血管","静脈"],0,"細動脈は平滑筋で太さを変え、血流の抵抗をつくる(抵抗血管)。",["","大動脈は太く、抵抗は小さい。","毛細血管は1本は細いが数が非常に多く、全体の抵抗は細動脈より小さい。","静脈は抵抗が小さい。"]],["全身の血液が最も多く存在する血管はどれか。",["静脈","毛細血管","動脈","肺の血管"],0,"全身の血液の約3分の2は静脈にあり、静脈は容量血管とよばれる。",["","毛細血管にあるのは一部。","動脈にあるのは一部。","肺の血管にあるのは一部。"]],["血液の流れる速さが最も遅いのはどれか。",["大動脈","細動脈","毛細血管","大静脈"],2,"毛細血管は数が多く、全体の断面積が最も大きいため、血流が最も遅い。そのため物質交換に適する。",["大動脈は最も速い。","細動脈は毛細血管より速い。","","大静脈は毛細血管より速い。"]],["収縮期血圧120mmHg、拡張期血圧80mmHgのとき、脈圧はどれか。",["40mmHg","80mmHg","100mmHg","200mmHg"],0,"脈圧=収縮期血圧−拡張期血圧=120−80=40mmHg。",["","80mmHgは拡張期血圧。","100mmHgではない。","200mmHgは足し算をした値。"]],["収縮期血圧120mmHg、拡張期血圧80mmHgのとき、平均血圧はおよそどれか。",["87mmHg","93mmHg","100mmHg","107mmHg"],1,"平均血圧=拡張期血圧+脈圧÷3=80+40÷3≒93mmHg。",["87mmHgではない。","","100mmHgは2つの単純平均で、平均血圧ではない。","107mmHgではない。"]],["毛細血管の動脈側で、血漿の液体を組織へ押し出す主な力はどれか。",["リンパの流れ","膠質浸透圧","毛細血管の血圧","静脈の弁"],2,"動脈側では血圧が膠質浸透圧より高いため、液体が組織へ出る。静脈側では膠質浸透圧で戻る。",["リンパは組織から液体を回収する。","膠質浸透圧は液体を血管内へ引き戻す力。","","静脈の弁は逆流を防ぐ。"]],["むくみ(浮腫)の原因となるものはどれか。",["血漿たんぱく質の増加","毛細血管の血圧の低下","リンパの流れの増加","血漿アルブミンの減少"],3,"アルブミンが減ると膠質浸透圧が下がり、液体が血管に戻れず組織にたまる。",["血漿たんぱく質が増えても、むくみの原因にはならない。","毛細血管の血圧が上がるとむくむ。下がってもむくまない。","リンパの流れが悪くなるとむくむ。",""]],["下肢の静脈血が心臓へ戻るのを助けるものはどれか。",["骨格筋の収縮(筋ポンプ)","動脈の弾性","毛細血管の収縮","重力"],0,"ふくらはぎなどの筋が縮むと静脈を押し、静脈弁と協力して血液を心臓へ押し上げる。",["","動脈の弾性は動脈側の血流を保つ。","毛細血管は自分で収縮しない。","立った姿勢では重力は戻るのを妨げる。"]],["血管を収縮させ、血圧を上げる物質はどれか。",["ヒスタミン","心房性ナトリウム利尿ペプチド","アンジオテンシンII","一酸化窒素"],2,"アンジオテンシンIIは強い血管収縮作用をもち、アルドステロンの分泌も促す。",["ヒスタミンは血管を広げる。","心房性ナトリウム利尿ペプチドは血管を広げ、血圧を下げる。","","一酸化窒素は血管を広げる。"]],["血圧が下がったときに腎臓から分泌される酵素はどれか。",["アミラーゼ","ペプシン","トリプシン","レニン"],3,"レニンは腎臓の傍糸球体細胞から出て、アンジオテンシンIIの産生を始めさせる。",["アミラーゼはデンプンの消化酵素。","ペプシンは胃の消化酵素。","トリプシンは膵液の消化酵素。",""]],["頸動脈小体が主に感知するものはどれか。",["血液の酸素分圧の低下","血圧の上昇","体温の上昇","血糖の低下"],0,"頸動脈小体は化学受容器で、血液の酸素の低下などを感じて呼吸を促す。",["","血圧は頸動脈洞の圧受容器が感じる。","体温は感知しない。","血糖は感知しない。"]],["心臓の収縮力を強めるのはどれか。",["副交感神経","迷走神経","アセチルコリン","交感神経"],3,"交感神経は心拍数と心臓の収縮力の両方を高める。",["副交感神経は心拍数を下げる。","迷走神経は心拍数を下げる。","アセチルコリンは迷走神経の伝達物質で、心拍数を下げる。",""]],["心臓の交感神経が主に働きかける受容体はどれか。",["β₁受容体","α₁受容体","β₂受容体","ニコチン受容体"],0,"心臓には主にβ₁受容体があり、ノルアドレナリンなどで心拍数と収縮力が増える。",["","α₁受容体は主に血管を収縮させる。","β₂受容体は主に気管支を広げる。","ニコチン受容体は神経節や神経筋接合部にある。"]],["運動をしているとき、血流が最も増える器官はどれか。",["腎臓","消化管","骨格筋","皮膚(運動の初め)"],2,"運動中は骨格筋の血流が大きく増え、消化管や腎臓の血流は減る。",["腎臓の血流は減る。","消化管の血流は減る。","","運動の初めは皮膚の血管は収縮する(のちに体温が上がると拡張する)。"]],["左の冠状動脈に血液が多く流れるのはどの時期か。",["心室の収縮期","心室の拡張期","心房の収縮期だけ","心臓の動きに関係なく一定"],1,"心室が収縮すると心筋の中の血管が押しつぶされるため、冠状動脈の血流は拡張期に多い。",["収縮期は心筋が血管を押しつぶすため流れにくい。","","心房の収縮期だけではない。","一定ではない。"]],["血圧が多少変わっても血流がほぼ一定に保たれる(自動調節)のが特によく働く臓器はどれか。",["消化管","皮膚","骨格筋","脳"],3,"脳は血圧がある範囲で変わっても、血管の太さを自分で調節し、血流を一定に保つ。腎臓でもよく働く。",["消化管の血流は食事などで大きく変わる。","皮膚の血流は体温調節で大きく変わる。","骨格筋の血流は運動で大きく変わる。",""]],["寝た姿勢から急に立ち上がったときに起こる反応はどれか。",["心拍数が増える","心拍数が減る","末梢の血管が広がる","1回拍出量が増える"],0,"立つと血液が下肢にたまって血圧が下がるため、圧受容器反射で心拍数が増え、血管が縮む。",["","心拍数は増える。","末梢の血管は収縮する。","戻る血液が減るので、1回拍出量は減る。"]]]},
{"id":"p4","g":"p","k":"呼","name":"呼吸","q":[["安静時の吸息で主に働く筋はどれか。",["横隔膜","内肋間筋","腹直筋","胸鎖乳突筋"],0,"安静時の吸息は主に横隔膜(と外肋間筋)の収縮による。",["","内肋間筋は強く息を吐くときに働く。","腹直筋は強く息を吐くときに働く。","胸鎖乳突筋は強く息を吸うときの補助に働く。"]],["肺活量に含まれないものはどれか。",["1回換気量","予備吸気量","予備呼気量","残気量"],3,"肺活量=予備吸気量+1回換気量+予備呼気量。残気量は吐ききっても肺に残る量で、含まれない。",["1回換気量は含まれる。","予備吸気量は含まれる。","予備呼気量は含まれる。",""]],["呼吸の中枢があるのはどこか。",["延髄","小脳","大脳基底核","視床"],0,"呼吸の基本のリズムは延髄の呼吸中枢がつくり、橋が調節を助ける。",["","小脳は運動の調節。","大脳基底核は運動の調節。","視床は感覚の中継。"]],["呼吸を最も強く促す血液の変化はどれか。",["血液のpHの上昇","動脈血の酸素分圧の上昇","動脈血の二酸化炭素分圧の上昇","動脈血の二酸化炭素分圧の低下"],2,"二酸化炭素が増えると化学受容器が刺激され、呼吸が強まる。",["pHが上がる(アルカリ性に傾く)と呼吸は抑えられる。","酸素が増えても呼吸は促されない。","","二酸化炭素が減ると呼吸は抑えられる。"]],["血液中の二酸化炭素が運ばれる形で最も多いのはどれか。",["血漿に溶けた形","カルバミノ化合物","重炭酸イオン(HCO₃⁻)","ヘモグロビンの鉄との結合"],2,"二酸化炭素の大部分は赤血球内の炭酸脱水酵素の働きで重炭酸イオンになり、血漿で運ばれる。",["溶けた形はわずか。","カルバミノ化合物(たんぱく質と結合した形)は一部。","","ヘモグロビンの鉄に結合するのは酸素。"]],["安静時の成人の1回換気量はおよそどれか。",["約150mL","約500mL","約1500mL","約3000mL"],1,"安静時の1回換気量は約500mL。",["約150mLは解剖学的死腔の量。","","約1500mLは予備吸気量・予備呼気量などに近い量。","約3000mLは多すぎる。"]],["成人の解剖学的死腔の量はおよそどれか。",["約50mL","約150mL","約500mL","約1200mL"],1,"鼻から終末細気管支までのガス交換をしない部分(解剖学的死腔)は約150mL。",["約50mLでは少なすぎる。","","約500mLは1回換気量。","約1200mLは残気量に近い。"]],["1回換気量500mL、死腔150mL、呼吸数12回/分のとき、肺胞換気量はどれか。",["1800mL/分","4200mL/分","6000mL/分","7800mL/分"],1,"肺胞換気量=(1回換気量−死腔)×呼吸数=(500−150)×12=4200mL/分。",["1800mL/分は死腔の換気量(150×12)。","","6000mL/分は分時換気量(500×12)。","7800mL/分ではない。"]],["安静時の成人の呼吸数はおよそどれか(1分間)。",["約4回","約15回","約40回","約60回"],1,"安静時の成人の呼吸数は1分間に約12〜20回。",["約4回では少なすぎる。","","約40回では多すぎる(新生児に近い)。","約60回では多すぎる。"]],["機能的残気量に含まれるものの組み合わせはどれか。",["予備呼気量と残気量","予備吸気量と残気量","1回換気量と残気量","予備吸気量と予備呼気量"],0,"機能的残気量は安静時に息を吐き終えたとき肺に残っている量で、予備呼気量+残気量。",["","予備吸気量は含まれない。","1回換気量は含まれない。","残気量が含まれる。"]],["1秒率が70%未満に下がるのはどの障害か。",["中枢性の呼吸障害","拘束性換気障害","肺循環障害","閉塞性換気障害"],3,"気道が狭くなると一気に吐き出せず、1秒率が下がる(閉塞性換気障害。例:COPD、気管支喘息)。",["中枢性の呼吸障害の指標ではない。","拘束性換気障害では主に%肺活量が下がる。","肺循環障害の指標ではない。",""]],["息を吸うとき、胸膜腔の内圧はどうなるか。",["陽圧になる","より陰圧になる","大気圧と同じになる","変わらない"],1,"胸膜腔内圧は常に陰圧で、吸息時に胸郭が広がるとさらに陰圧になり、肺が膨らむ。",["正常では陽圧にならない。","","大気圧より低い。","吸息で変わる。"]],["安静時の呼息はどのようにして起こるか。",["横隔膜が収縮して起こる","内肋間筋が強く収縮して起こる","腹筋が収縮して起こる","肺と胸郭が元に戻ろうとする力で受動的に起こる"],3,"安静時の呼息は、吸息筋がゆるむと肺と胸郭の弾性で自然に起こる。",["横隔膜の収縮は吸息。","内肋間筋は強く吐くときに働く。","腹筋は強く吐くときに働く。",""]],["肺胞のサーファクタントが不足するとどうなるか。",["気道が広がる","肺胞が膨らみすぎる","ガス交換が速くなる","肺胞がつぶれやすくなる"],3,"サーファクタントは肺胞の表面張力を下げる。不足すると肺胞がしぼみやすくなる(新生児呼吸窮迫症候群)。",["気道の太さには関係しない。","膨らみすぎることはない。","ガス交換は悪くなる。",""]],["肺胞でのガス交換のしくみはどれか。",["能動輸送","拡散","ろ過","浸透"],1,"酸素と二酸化炭素は分圧の高い方から低い方へ拡散で移動する。",["エネルギーを使う能動輸送ではない。","","ろ過ではない。","浸透は水の移動。"]],["健康な人の動脈血の酸素分圧はおよそどれか。",["約40mmHg","約100mmHg","約160mmHg","約760mmHg"],1,"動脈血の酸素分圧は約100mmHg(95〜100mmHg)。",["約40mmHgは静脈血の酸素分圧。","","約160mmHgは大気中の酸素分圧に近い。","約760mmHgは大気圧。"]],["健康な人の動脈血の二酸化炭素分圧はおよそどれか。",["約5mmHg","約40mmHg","約100mmHg","約160mmHg"],1,"動脈血の二酸化炭素分圧は約40mmHg。",["約5mmHgでは低すぎる。","","約100mmHgは動脈血の酸素分圧。","約160mmHgではない。"]],["血液中の酸素の大部分はどのように運ばれるか。",["重炭酸イオンとして","血漿に溶けて","ヘモグロビンと結合して","アルブミンと結合して"],2,"酸素の大部分(約98%)は赤血球のヘモグロビンと結合して運ばれる。",["重炭酸イオンは二酸化炭素の運ばれ方。","血漿に溶ける量はごくわずか。","","アルブミンとは結合しない。"]],["酸素解離曲線を右へ移す(ヘモグロビンが酸素を離しやすくなる)のはどれか。",["pHの上昇","体温の上昇","二酸化炭素分圧の低下","体温の低下"],1,"体温の上昇、二酸化炭素の増加、pHの低下などで右へ移り、働いている組織に酸素を渡しやすくなる。",["pHの上昇では左へ移る。","","二酸化炭素の低下では左へ移る。","体温の低下では左へ移る。"]],["一酸化炭素中毒が危険な理由はどれか。",["呼吸中枢を刺激する","赤血球を壊す","血液を固める","ヘモグロビンと酸素よりはるかに強く結合する"],3,"一酸化炭素はヘモグロビンとの結びつきが酸素の200倍以上強く、酸素を運べなくする。",["呼吸中枢を刺激するわけではない。","赤血球を壊すわけではない。","血液を固めるわけではない。",""]],["肺が膨らむと吸息を止め、呼息へ切り替える反射はどれか。",["伸張反射","圧受容器反射","ヘーリング・ブロイエル反射","対光反射"],2,"肺の伸展受容器からの情報が迷走神経で伝わり、吸息を止める。",["伸張反射は筋が伸ばされると縮む反射。","圧受容器反射は血圧の調節。","","対光反射は瞳孔の反射。"]],["中枢化学受容器がある部位はどれか。",["延髄","頸動脈小体","大動脈小体","視床下部"],0,"延髄の腹側表面に中枢化学受容器があり、二酸化炭素の増加(脳脊髄液の酸性化)を感じる。",["","頸動脈小体は末梢化学受容器。","大動脈小体は末梢化学受容器。","視床下部ではない。"]],["過換気(呼吸のしすぎ)で起こる変化はどれか。",["変化は起こらない","動脈血の二酸化炭素が増え、pHが下がる","動脈血の酸素が減る","動脈血の二酸化炭素が減り、pHが上がる"],3,"二酸化炭素を吐き出しすぎるとpHが上がる(呼吸性アルカローシス)。",["変化が起こる。","これは換気不足の変化。","酸素はむしろ増える方向。",""]],["換気が不十分で二酸化炭素がたまった状態はどれか。",["呼吸性アルカローシス","呼吸性アシドーシス","代謝性アルカローシス","正常"],1,"二酸化炭素がたまると血液が酸性に傾く(呼吸性アシドーシス)。",["呼吸性アルカローシスは過換気で起こる。","","代謝性アルカローシスは嘔吐などで起こる。","正常ではない。"]],["高地(酸素が薄い所)に行ったとき、最初に起こる反応はどれか。",["心拍数が減る","呼吸が減る","赤血球がすぐに減る","呼吸が増える"],3,"酸素が少ないと末梢化学受容器が刺激され、呼吸が増える。長くいると赤血球も増える。",["心拍数は増える。","呼吸は増える。","赤血球は長期的に増える。",""]],["意識して呼吸を止めたり速めたりできるのは、どこからの指令か。",["脊髄","延髄","大脳皮質","小脳"],2,"大脳皮質からの指令で、呼吸はある程度自分の意思で変えられる。",["脊髄は指令を伝える通り道。","延髄は自動的な呼吸のリズムをつくる。","","小脳は運動の調節。"]],["強く息を吐くときに働く筋はどれか。",["腹筋群","横隔膜","外肋間筋","胸鎖乳突筋"],0,"強い呼息では腹筋群や内肋間筋が働き、腹圧を高めて息を押し出す。",["","横隔膜は吸息の筋。","外肋間筋は吸息の筋。","胸鎖乳突筋は強い吸息を助ける。"]],["胸膜腔に空気が入るとどうなるか。",["変化しない","肺が大きく膨らむ","ガス交換がよくなる","肺がしぼむ"],3,"胸膜腔の陰圧がなくなると、肺は自らの弾性で縮んでしぼむ(気胸)。",["変化する。","膨らまなくなる。","ガス交換は悪くなる。",""]],["糖質だけをエネルギー源にしたときの呼吸商はどれか。",["0.7","0.8","0.85","1.0"],3,"呼吸商=排出したCO₂÷消費したO₂。糖質は1.0、脂質は約0.7、たんぱく質は約0.8。",["0.7は脂質。","0.8はたんぱく質。","0.85は糖質・脂質・たんぱく質がまざったときの値に近い。",""]],["呼吸の深さがだんだん増えては減り、無呼吸をはさんでくり返す呼吸はどれか。",["ビオー呼吸","クスマウル呼吸","チェーン・ストークス呼吸","腹式呼吸"],2,"チェーン・ストークス呼吸は重い心不全や脳の障害、死が近いときなどにみられる。",["ビオー呼吸は深さが一定の呼吸と無呼吸が不規則にくり返す。","クスマウル呼吸は深く大きな呼吸が続く(糖尿病性ケトアシドーシスなど)。","","腹式呼吸は横隔膜を主に使う普通の呼吸法。"]]]},
