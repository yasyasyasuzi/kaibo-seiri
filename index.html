{"id":"p5","g":"p","k":"消","name":"消化・吸収","q":[["唾液に含まれ、デンプンを分解する酵素はどれか。",["アミラーゼ","ペプシン","リパーゼ","トリプシン"],0,"唾液アミラーゼ(プチアリン)はデンプンを麦芽糖などに分解する。",["","ペプシンは胃でたんぱく質を分解する。","リパーゼは脂肪を分解する(主に膵液)。","トリプシンは膵液に含まれ、たんぱく質を分解する。"]],["胃で塩酸を分泌する細胞はどれか。",["壁細胞","主細胞","副細胞","G細胞"],0,"壁細胞は塩酸と内因子を分泌する。",["","主細胞はペプシノゲンを分泌する。","副細胞は粘液を分泌する。","G細胞はガストリンを分泌する。"]],["胆汁の働きはどれか。",["デンプンを分解する","たんぱく質を分解する","脂肪を乳化する","胃酸の分泌を促す"],2,"胆汁酸が脂肪を細かい粒にして(乳化)、リパーゼが働きやすくする。胆汁に消化酵素は含まれない。",["胆汁にデンプンの分解酵素は含まれない。","胆汁にたんぱく質の分解酵素は含まれない。","","胃酸の分泌を促すのはガストリンなど。"]],["ビタミンB₁₂が主に吸収される部位はどれか。",["胃","十二指腸","大腸","回腸"],3,"ビタミンB₁₂は胃の内因子と結合し、回腸の終わりの部分で吸収される。",["胃では吸収されない(内因子を分泌する)。","十二指腸では鉄やカルシウムが多く吸収される。","大腸では主に水と電解質が吸収される。",""]],["吸収された脂肪(カイロミクロン)が入る管はどれか。",["門脈","リンパ管(乳び管)","肝静脈","胆管"],1,"脂肪は小腸の上皮でカイロミクロンになり、絨毛の中の乳び管(リンパ管)に入る。",["門脈には主に糖やアミノ酸が入る。","","肝静脈は肝臓からの出口。","胆管は胆汁の通り道。"]],["ペプシノゲンをペプシンに変えるものはどれか。",["重炭酸イオン","胆汁","塩酸","唾液"],2,"主細胞から出たペプシノゲンは、胃の塩酸によってペプシンに変わり、たんぱく質を分解する。",["重炭酸イオンは酸を中和する。","胆汁は脂肪を乳化する。","","唾液はデンプンを分解する。"]],["ガストリンの主な作用はどれか。",["胃酸の分泌を促す","胃酸の分泌を抑える","胆嚢を収縮させる","インスリンの分泌を抑える"],0,"ガストリンは胃のG細胞から出て、壁細胞に働き胃酸の分泌を促す。",["","胃酸の分泌を抑えるのはセクレチンなど。","胆嚢を収縮させるのはコレシストキニン。","作用ではない。"]],["セクレチンの主な作用はどれか。",["胆嚢を収縮させる","胃酸の分泌を促す","重炭酸イオンの多い膵液の分泌を促す","唾液の分泌を促す"],2,"セクレチンは酸性の内容物が十二指腸に来ると分泌され、膵液の重炭酸イオンで酸を中和させる。胃酸の分泌は抑える。",["胆嚢を収縮させるのはコレシストキニン。","胃酸の分泌はむしろ抑える。","","唾液の分泌には関わらない。"]],["胆嚢を収縮させる消化管ホルモンはどれか。",["コレシストキニン","セクレチン","ガストリン","グルカゴン"],0,"コレシストキニンは脂肪などが十二指腸に来ると分泌され、胆嚢を収縮させ、消化酵素の多い膵液の分泌を促す。",["","セクレチンは重炭酸イオンの多い膵液の分泌を促す。","ガストリンは胃酸の分泌を促す。","グルカゴンは血糖を上げる。"]],["飲み込み(嚥下)の段階のうち、自分の意思で行えるのはどれか。",["すべて","咽頭期","食道期","口腔期"],3,"口腔期(食べ物を舌で咽頭へ送る)は随意的。咽頭期・食道期は反射で進む。",["咽頭期と食道期は意思では行えない。","咽頭期は反射で起こる。","食道期は反射(蠕動)で起こる。",""]],["嚥下の中枢がある部位はどれか。",["延髄","小脳","視床","大脳基底核"],0,"嚥下反射の中枢は延髄にある。嘔吐の中枢も延髄。",["","小脳ではない。","視床ではない。","大脳基底核ではない。"]],["胃の運動や消化液の分泌を促す自律神経はどれか。",["交感神経","副交感神経(迷走神経)","体性運動神経","横隔神経"],1,"迷走神経(副交感神経)は消化管の運動と消化液の分泌を促す。",["交感神経は消化管の働きを抑える。","","体性運動神経は骨格筋を支配する。","横隔神経は横隔膜を支配する。"]],["膵液のトリプシノゲンをトリプシンに変えるものはどれか。",["塩酸","エンテロキナーゼ(エンテロペプチダーゼ)","胆汁酸","アミラーゼ"],1,"小腸粘膜のエンテロキナーゼがトリプシノゲンをトリプシンに変え、トリプシンがほかの酵素も活性化する。",["塩酸はペプシノゲンをペプシンに変える。","","胆汁酸は脂肪を乳化する。","アミラーゼはデンプンを分解する。"]],["膵液の性質はどれか。",["強い酸性","弱アルカリ性","中性","強いアルカリ性"],1,"膵液は重炭酸イオンを多く含む弱アルカリ性で、胃から来た酸を中和する。",["強い酸性なのは胃液。","","中性ではない。","強いアルカリ性ではない。"]],["糖質が消化されて吸収されるときの形はどれか。",["グリコーゲン","二糖類","多糖類","単糖類"],3,"糖質はブドウ糖などの単糖類にまで分解されてから吸収される。",["グリコーゲンは貯蔵の形。","二糖類は小腸の粘膜でさらに単糖類に分解される。","多糖類のままでは吸収されない。",""]],["たんぱく質が消化されて主に吸収される形はどれか。",["アミノ酸","脂肪酸","単糖類","グリセリン"],0,"たんぱく質はアミノ酸(と小さなペプチド)にまで分解されて吸収される。",["","脂肪酸は脂肪の分解産物。","単糖類は糖質の分解産物。","グリセリンは脂肪の分解産物。"]],["脂肪(中性脂肪)が膵リパーゼで分解されてできるものはどれか。",["ブドウ糖","アミノ酸","脂肪酸とモノグリセリド","乳酸"],2,"中性脂肪は脂肪酸とモノグリセリドに分解され、胆汁酸と小さな粒(ミセル)をつくって吸収される。",["ブドウ糖は糖質の分解産物。","アミノ酸はたんぱく質の分解産物。","","乳酸は糖の代謝産物。"]],["小腸でのブドウ糖の吸収のしくみはどれか。",["リンパ管へ直接入る","単純拡散だけで吸収される","エンドサイトーシスで吸収される","Na⁺と一緒に運ばれる(共輸送)"],3,"ブドウ糖はNa⁺と一緒に輸送体で小腸の上皮細胞に取り込まれる。",["ブドウ糖は毛細血管(門脈)へ入る。","単純拡散だけではない。","エンドサイトーシスではない。",""]],["消化管で、水が最も多く吸収される部位はどれか。",["胃","大腸","小腸","食道"],2,"水の大部分は小腸で吸収され、残りの多くが大腸で吸収される。",["胃ではほとんど吸収されない。","大腸は小腸の次に多い。","","食道では吸収されない。"]],["大腸の主な働きはどれか。",["たんぱく質を分解する","水と電解質を吸収して便をつくる","脂肪を乳化する","ブドウ糖を吸収する"],1,"大腸は残りの水分と電解質を吸収し、便を固める。",["たんぱく質の分解は主に胃と小腸。","","脂肪の乳化は胆汁。","ブドウ糖の吸収は小腸。"]],["腸内細菌がつくるビタミンはどれか。",["ビタミンK","ビタミンA","ビタミンC","ビタミンD"],0,"腸内細菌はビタミンKやビタミンB群の一部をつくる。",["","ビタミンAは食事から取る。","ビタミンCはヒトはつくれない。","ビタミンDは皮膚で紫外線によりつくられる。"]],["胆汁酸の大部分が再吸収される部位はどれか。",["直腸","胃","十二指腸","回腸"],3,"胆汁酸は回腸で再吸収され、門脈を通って肝臓に戻り再利用される(腸肝循環)。",["直腸ではない。","胃では吸収されない。","十二指腸は胆汁が出てくる場所。",""]],["肝臓の働きでないものはどれか。",["消化酵素の分泌","アルブミンの合成","尿素の合成","グリコーゲンの貯蔵"],0,"肝臓は胆汁をつくるが、胆汁に消化酵素は含まれない。消化酵素は膵臓などが分泌する。",["","アルブミンをつくるのは肝臓の働き。","アンモニアから尿素をつくるのは肝臓の働き。","グリコーゲンを蓄えるのは肝臓の働き。"]],["アンモニアを尿素に変える臓器はどれか。",["肝臓","腎臓","膵臓","脾臓"],0,"たんぱく質の分解でできた有毒なアンモニアは、肝臓で尿素に変えられ、腎臓から捨てられる。",["","腎臓は尿素を尿に出す。","膵臓ではない。","脾臓ではない。"]],["排便反射の中枢がある部位はどれか。",["延髄","胸髄","仙髄","腰髄"],2,"排便反射の中枢は仙髄にあり、大脳がこれを調節する。",["延髄ではない。","胸髄ではない。","","腰髄ではない。"]],["食べ物が胃に入ると大腸の運動が強まり、便意が起こる反射はどれか。",["伸張反射","嚥下反射","腸胃反射","胃結腸反射"],3,"胃結腸反射により、朝食後などに大腸の集団運動が起こり便意を感じやすくなる。",["伸張反射は筋の反射。","嚥下反射は飲み込みの反射。","腸胃反射は腸の内容物で胃の運動が抑えられる反射。",""]],["水っぽい唾液を多く出させる自律神経はどれか。",["体性感覚神経","交感神経","副交感神経","体性運動神経"],2,"副交感神経は水分の多い唾液を大量に出させる。交感神経では粘り気のある唾液が少量出る。",["感覚神経ではない。","交感神経では粘り気のある唾液が少量出る。","","運動神経ではない。"]],["胃にとどまる時間が最も長い栄養素はどれか。",["糖質","たんぱく質","水","脂肪"],3,"脂肪は十二指腸に入ると胃の運動をおさえるため、胃に長くとどまる。",["糖質は最も早く胃から出ていく。","たんぱく質は糖質より長いが、脂肪より短い。","水はすぐに胃を通過する。",""]],["小腸で、内容物を混ぜ合わせる主な運動はどれか。",["分節運動","蠕動運動","逆蠕動","集団運動"],0,"分節運動は輪状の収縮がところどころで起こり、内容物と消化液を混ぜる。",["","蠕動運動は内容物を先へ送る。","逆蠕動は内容物を逆へ送る運動。","集団運動は大腸で起こる強い運動。"]],["脂溶性ビタミンはどれか。",["ビタミンB₁","ビタミンC","ビタミンD","ビタミンB₁₂"],2,"脂溶性ビタミンはA・D・E・K。脂肪と一緒に吸収される。",["ビタミンB₁は水溶性。","ビタミンCは水溶性。","","ビタミンB₁₂は水溶性。"]]]},
{"id":"p6","g":"p","k":"代","name":"代謝・体温","q":[["体温調節の中枢はどこか。",["視床下部","延髄","小脳","大脳皮質"],0,"視床下部が体温の設定値を決め、熱をつくる働きと逃がす働きを調節する。",["","延髄には呼吸や循環の中枢がある。","小脳は運動の調節。","大脳皮質は体温調節の中枢ではない。"]],["1gあたりのエネルギーが最も大きい栄養素はどれか。",["脂質","たんぱく質","糖質","ビタミン"],0,"脂質は約9kcal/g。糖質・たんぱく質は約4kcal/g。",["","たんぱく質は約4kcal/g。","糖質は約4kcal/g。","ビタミンはエネルギー源にならない。"]],["基礎代謝を高めるのはどれか。",["加齢","甲状腺ホルモンの増加","睡眠","体温の低下"],1,"甲状腺ホルモンは全身の代謝を高める。",["加齢で基礎代謝は下がる。","","睡眠中の代謝は基礎代謝より低い。","体温が下がると代謝は下がる。"]],["気温が体温より高いとき、体から熱を逃がす主な方法はどれか。",["放射","伝導","蒸発","対流"],2,"気温が体温より高いと、放射・伝導・対流ではかえって熱が入ってくる。汗の蒸発で熱を逃がす。",["気温が高いと放射では熱を逃がせない。","気温が高いと伝導では熱を逃がせない。","","気温が高いと対流では熱を逃がせない。"]],["体温の1日の変動で正しいのはどれか。",["早朝が最も低く、夕方が最も高い","早朝が最も高く、夕方が最も低い","正午が最も低い","1日の中で変動しない"],0,"体温は早朝(明け方)に最も低く、午後〜夕方に最も高い。",["","逆。","正午は最低ではない。","1日の中で変動がある。"]],["基礎代謝を測るときの条件として正しいのはどれか。",["寒い部屋","食事をしてすぐ","運動の直後","食後12時間以上たった空腹時"],3,"基礎代謝は早朝の空腹時に、目が覚めた状態で静かに横になり、快適な室温で測る。",["寒いと熱をつくるため代謝が上がる。","食後は食事による熱の産生が加わる。","運動の直後は代謝が高い。",""]],["基礎代謝について正しいのはどれか。",["年をとるほど高くなる","睡眠中は基礎代謝より高い","同じ体格なら男性の方が女性より高い","夏の方が冬より高い"],2,"男性は筋肉量が多く、基礎代謝が女性より高い。",["加齢で低くなる。","睡眠中の代謝は基礎代謝より低い。","","冬の方が高い。"]],["食事をしたあとの熱の産生(特異動的作用)が最も大きい栄養素はどれか。",["糖質","たんぱく質","脂質","ビタミン"],1,"たんぱく質は特異動的作用が最も大きい。",["糖質はたんぱく質より小さい。","","脂質はたんぱく質より小さい。","ビタミンはエネルギー源にならない。"]],["酸素が足りないとき、解糖でできたピルビン酸は何に変わるか。",["乳酸","尿素","ケトン体","グリコーゲン"],0,"酸素が不足すると、ピルビン酸は乳酸になる(無酸素の代謝)。",["","尿素はアミノ酸の窒素からつくられる。","ケトン体は脂肪酸からつくられる。","グリコーゲンはブドウ糖を蓄えた形。"]],["クエン酸回路(TCA回路)が行われる場所はどれか。",["リボソーム","細胞質","ミトコンドリア","核"],2,"クエン酸回路と電子伝達系はミトコンドリアで行われ、多くのATPがつくられる。",["リボソームはたんぱく質を合成する。","解糖は細胞質で行われる。","","核ではない。"]],["グリコーゲンを主に蓄える器官の組み合わせはどれか。",["脳と心臓","肝臓と骨格筋","腎臓と膵臓","脾臓と骨"],1,"グリコーゲンは主に肝臓と骨格筋に蓄えられる。肝臓のグリコーゲンは血糖の維持に使われる。",["脳はグリコーゲンをほとんど蓄えない。","","主な貯蔵場所ではない。","主な貯蔵場所ではない。"]],["アミノ酸などからブドウ糖をつくる働き(糖新生)が主に行われる器官はどれか。",["脳","骨格筋","肝臓","脂肪組織"],2,"糖新生は主に肝臓(と腎臓)で行われ、空腹時の血糖を保つ。",["脳はブドウ糖を使う側。","骨格筋は糖新生をほとんど行わない。","","脂肪組織は主な場所ではない。"]],["糖を十分に使えないとき、肝臓で脂肪酸からつくられるものはどれか。",["ケトン体","乳酸","尿素","グリコーゲン"],0,"飢餓や糖尿病で糖が使えないと、脂肪酸からケトン体がつくられ、エネルギー源になる。",["","乳酸は酸素不足のときの糖の代謝産物。","尿素はアミノ酸の窒素から。","グリコーゲンはブドウ糖からつくられる。"]],["体内で最も多くエネルギーを蓄えている形はどれか。",["たんぱく質","グリコーゲン","中性脂肪","ブドウ糖"],2,"中性脂肪は1gあたりのエネルギーが大きく、脂肪組織に大量に蓄えられている。",["たんぱく質は主に体をつくる材料。","グリコーゲンの貯蔵量は少ない。","","血液中のブドウ糖はわずか。"]],["必須アミノ酸はどれか。",["グリシン","アラニン","グルタミン酸","ロイシン"],3,"必須アミノ酸は体内でつくれず、食事から取る必要がある。ロイシンはその1つ。",["グリシンは体内でつくれる。","アラニンは体内でつくれる。","グルタミン酸は体内でつくれる。",""]],["1日のエネルギー消費量のうち、最も大きな割合を占めるものはどれか。",["睡眠","食事による熱の産生","身体活動","基礎代謝"],3,"ふだんの生活では、1日のエネルギー消費で最も大きな割合を基礎代謝が占める。",["睡眠はエネルギー消費の区分ではない。","食事による熱の産生は基礎代謝より小さい。","身体活動は人によって変わるが、ふつうは基礎代謝より少ない。",""]],["体温を測る部位で、最も高い値を示すのはどれか。",["直腸","口腔","腋窩","手のひら"],0,"直腸温が最も高く、口腔温、腋窩温の順に低くなる。",["","口腔温は直腸温より低い。","腋窩温は最も低い。","手のひらは体の表面で、体温の測定部位として使われない。"]],["寒いときに起こる体の反応はどれか。",["皮膚の血管が収縮する","汗が増える","皮膚の血管が広がる","筋がゆるむ"],0,"寒いと皮膚の血管が収縮して熱を逃がしにくくし、ふるえで熱をつくる。",["","汗が増えるのは暑いとき。","皮膚の血管が広がるのは暑いとき。","ふるえ(筋の収縮)が起こる。"]],["暑いときに起こる体の反応はどれか。",["鳥肌が立つ","皮膚の血管が収縮する","ふるえが起こる","皮膚の血管が広がる"],3,"暑いと皮膚の血管が広がって熱を逃がし、汗の蒸発で体を冷やす。",["鳥肌は寒いときの反応。","皮膚の血管の収縮は寒いときの反応。","ふるえは寒いときの反応。",""]],["安静時、室温が快適なときに最も多く熱を逃がす方法はどれか。",["対流","伝導","蒸発","放射(輻射)"],3,"安静時・快適な室温では、放射による放熱が最も多い。",["対流は放射より少ない。","伝導は物にじかに触れて熱が移ることで、わずか。","蒸発は暑いときや運動時に多くなる。",""]],["発熱が起こるしくみとして正しいのはどれか。",["汗が出なくなる","体温調節中枢の設定値が上がる","熱の産生だけが増える","皮膚の血管が広がる"],1,"発熱物質の作用で視床下部の体温の設定値が上がり、体はその値まで体温を上げようとする。",["汗が出なくなること自体が原因ではない。","","設定値が上がり、熱の産生と保持が増える。","上がる途中は皮膚の血管は収縮する(寒気がする)。"]],["発熱のとき、視床下部に働いて体温の設定値を上げる物質はどれか。",["ヒスタミン","インスリン","プロスタグランジンE₂","アセチルコリン"],2,"感染などでつくられた物質が視床下部でプロスタグランジンE₂をつくらせ、設定値を上げる。解熱剤はこの産生をおさえる。",["ヒスタミンはアレルギーや炎症に関わる。","インスリンは血糖を下げる。","","アセチルコリンは神経の伝達物質。"]],["新生児で、ふるえによらない熱の産生に重要な組織はどれか。",["骨格筋","白色脂肪組織","褐色脂肪組織","皮膚"],2,"褐色脂肪組織はミトコンドリアが多く、ふるえなしに熱をつくれる。新生児に多い。",["骨格筋はふるえで熱をつくる。","白色脂肪組織は主にエネルギーを蓄える。","","皮膚は主に熱を逃がす。"]],["エクリン汗腺を支配する交感神経の伝達物質はどれか。",["ドパミン","ノルアドレナリン","アドレナリン","アセチルコリン"],3,"汗腺は交感神経に支配されるが、例外的に伝達物質はアセチルコリン。",["ドパミンではない。","ほかの多くの交感神経の節後線維はノルアドレナリンを出すが、汗腺は例外。","アドレナリンは副腎髄質から出るホルモン。",""]],["緊張したときに汗が出やすい(精神性発汗)部位はどれか。",["手のひら","背中","胸","太もも"],0,"精神性発汗は手のひら・足の裏・わきの下などに起こる。",["","背中は暑いときの発汗(温熱性発汗)が多い部位。","胸は温熱性発汗が多い部位。","太ももは温熱性発汗が多い部位。"]],["糖質の代謝に特に必要なビタミンはどれか。",["ビタミンB₁","ビタミンA","ビタミンD","ビタミンK"],0,"ビタミンB₁は糖質からエネルギーをつくる過程に必要。不足すると脚気になる。",["","ビタミンAは視覚や皮膚に関わる。","ビタミンDはカルシウムの吸収に関わる。","ビタミンKは血液凝固に関わる。"]],["ATPを最も多くつくる過程はどれか。",["電子伝達系","解糖","クエン酸回路","糖新生"],0,"ミトコンドリアの電子伝達系で、酸素を使ってATPの大部分がつくられる。",["","解糖でつくられるATPはわずか。","クエン酸回路で直接つくられるATPは少ない。","糖新生はATPを使う側。"]],["尿酸は何が分解されてできるか。",["コレステロール","脂肪酸","ブドウ糖","プリン体(核酸)"],3,"尿酸は核酸に含まれるプリン体の最終産物。多すぎると痛風の原因になる。",["コレステロールからは尿酸はできない。","脂肪酸からは尿酸はできない。","ブドウ糖からは尿酸はできない。",""]],["コレステロールを材料にしてつくられるものはどれか。",["インスリン","胆汁酸","グリコーゲン","ヘモグロビン"],1,"コレステロールから胆汁酸、ステロイドホルモン、ビタミンDなどがつくられる。",["インスリンはたんぱく質(ペプチド)。","","グリコーゲンはブドウ糖からつくられる。","ヘモグロビンはたんぱく質とヘムからなる。"]],["糖新生の材料にならないものはどれか。",["乳酸","アミノ酸","グリセロール","脂肪酸"],3,"脂肪酸からはブドウ糖をつくれない。乳酸・アミノ酸・グリセロールは糖新生の材料になる。",["乳酸は糖新生の材料になる。","アミノ酸は糖新生の材料になる。","グリセロールは糖新生の材料になる。",""]]]},
{"id":"p7","g":"p","k":"排","name":"排泄","q":[["健康な人の糸球体で、ほとんどろ過されないものはどれか。",["ブドウ糖","尿素","アルブミン","Na⁺"],2,"アルブミンなどの血漿たんぱく質は大きく、ほとんどろ過されない。",["ブドウ糖はろ過される(その後、再吸収される)。","尿素はろ過される。","","Na⁺はろ過される。"]],["ブドウ糖がほぼすべて再吸収される部位はどれか。",["集合管","ヘンレループ","遠位尿細管","近位尿細管"],3,"ろ過されたブドウ糖は、近位尿細管でほぼすべて再吸収される。",["ブドウ糖は近位尿細管で再吸収を終えている。","ヘンレループでは主に水とNaClが再吸収される。","ブドウ糖は近位尿細管で再吸収を終えている。",""]],["バソプレシン(抗利尿ホルモン)の働きはどれか。",["集合管で水の再吸収を増やす","集合管で水の再吸収を減らす","Na⁺の再吸収を減らす","ブドウ糖の排泄を増やす"],0,"バソプレシンは集合管で水の再吸収を増やし、尿を濃くして尿量を減らす。",["","逆。","Na⁺の再吸収を主に調節するのはアルドステロン。","ブドウ糖の排泄には関わらない。"]],["アルドステロンの働きはどれか。",["K⁺の再吸収を増やす","Na⁺の排泄を増やす","Na⁺の再吸収を増やす","ブドウ糖の再吸収を増やす"],2,"アルドステロンは遠位尿細管・集合管でNa⁺の再吸収とK⁺の排泄を促す。",["K⁺は排泄を増やす。","逆。","","ブドウ糖には関わらない。"]],["排尿反射の中枢があるのはどこか。",["仙髄","胸髄","頸髄","小脳"],0,"排尿反射の中枢は仙髄(S2〜S4)にあり、橋や大脳がこれを調節する。",["","胸髄ではない。","頸髄ではない。","小脳ではない。"]],["成人の1日の尿量はおよそどれか。",["約0.1L","約1.5L","約5L","約15L"],1,"成人の1日の尿量は約1〜1.5L。",["約0.1Lでは少なすぎる(無尿に近い)。","","約5Lでは多すぎる。","約15Lでは多すぎる。"]],["糸球体で1日にろ過される量はおよそどれか。",["約1.5L","約15L","約150L","約1500L"],2,"糸球体では1日に約150L(1分間に約100mL)がろ過される。",["約1.5Lは1日の尿量。","約15Lでは少なすぎる。","","約1500Lでは多すぎる。"]],["糸球体でろ過された水のうち、再吸収される割合はおよそどれか。",["約50%","約80%","約90%","約99%"],3,"ろ過された水の約99%が再吸収され、約1%が尿になる。",["約50%では尿が多すぎる。","約80%では尿が多すぎる。","約90%では尿が多すぎる。",""]],["腎臓を流れる血液量は、心拍出量のおよそどれくらいか。",["約5%","約20〜25%","約50%","約80%"],1,"腎臓には心拍出量の約20〜25%(約1L/分)もの血液が流れる。",["約5%では少なすぎる。","","約50%では多すぎる。","約80%では多すぎる。"]],["健康な人の尿にほとんど含まれないものはどれか。",["尿素","ブドウ糖","クレアチニン","Na⁺"],1,"ブドウ糖は近位尿細管でほぼすべて再吸収されるため、健康な人の尿にはほとんど出ない。",["尿素は尿の主な成分。","","クレアチニンは尿に出る。","Na⁺は尿に出る。"]],["健康な人の尿の性質(pH)はどれか。",["強いアルカリ性","強い酸性","弱酸性","いつも中性"],2,"尿はふつうpH約6の弱酸性で、食事などで変わる。",["強いアルカリ性ではない。","強い酸性ではない。","","食事などで変わる。"]],["糸球体ろ過量の目安として使われる物質はどれか。",["ブドウ糖","クレアチニン","アルブミン","Na⁺"],1,"クレアチニンは筋でつくられ、ほぼろ過だけで尿に出るため、腎臓の働きの目安になる。",["ブドウ糖は再吸収されるので目安にならない。","","アルブミンはほとんどろ過されない。","Na⁺は再吸収されるので目安にならない。"]],["ヘンレループの上行脚の特徴はどれか。",["アルブミンを再吸収する","水をよく通し、NaClは通さない","ブドウ糖を再吸収する","水を通さず、NaClを再吸収する"],3,"上行脚は水を通さずにNaClだけを再吸収するため、尿細管の中の液は薄くなり、髄質は濃くなる。",["アルブミンはほとんどろ過されない。","これは下行脚の特徴。","ブドウ糖は近位尿細管で再吸収される。",""]],["尿を濃くするのに重要な、ヘンレループと集合管がつくるしくみはどれか。",["負のフィードバック","腸肝循環","門脈系","対向流系"],3,"ヘンレループの対向流のしくみで髄質の浸透圧が高く保たれ、集合管から水が再吸収されて尿が濃くなる。",["負のフィードバックはホルモンなどの調節のしくみ。","腸肝循環は胆汁酸の再利用のしくみ。","門脈系は血管のつながり方。",""]],["遠位尿細管にあり、尿細管の中のNaClの量を感知する部分はどれか。",["ボウマン嚢","糸球体","緻密斑","集合管"],2,"緻密斑は傍糸球体装置の一部で、NaClの量を感じてレニンの分泌などを調節する。",["ボウマン嚢はろ過された液を受ける。","糸球体は血液をろ過する。","","集合管は水の再吸収などに働く。"]],["腎臓で活性型に変えられるビタミンはどれか。",["ビタミンA","ビタミンB₁₂","ビタミンD","ビタミンK"],2,"ビタミンDは肝臓と腎臓で活性型になり、腸でのカルシウムの吸収を促す。",["ビタミンAではない。","ビタミンB₁₂ではない。","","ビタミンKではない。"]],["腎臓の働きでないものはどれか。",["血圧の調節","胆汁の産生","血液の酸塩基平衡の調節","体液量の調節"],1,"胆汁は肝臓でつくられる。腎臓は尿をつくるほか、血圧・pH・体液量などを調節する。",["血圧の調節は腎臓の働き。","","酸塩基平衡の調節は腎臓の働き。","体液量の調節は腎臓の働き。"]],["排尿のとき、膀胱の筋(排尿筋)を収縮させる神経はどれか。",["陰部神経","交感神経(下腹神経)","副交感神経(骨盤内臓神経)","迷走神経"],2,"骨盤内臓神経(副交感神経)が排尿筋を収縮させ、尿を出す。",["陰部神経は外尿道括約筋を支配する。","交感神経は排尿筋をゆるめ、尿をためる方に働く。","","迷走神経は膀胱を支配しない。"]],["尿をためるとき(蓄尿)に主に働く自律神経はどれか。",["体性感覚神経","副交感神経","交感神経","迷走神経"],2,"交感神経(下腹神経)は排尿筋をゆるめ、内尿道括約筋を締めて尿をためる。",["感覚神経ではない。","副交感神経は排尿に働く。","","迷走神経は膀胱を支配しない。"]],["外尿道括約筋を支配する神経はどれか。",["骨盤内臓神経","下腹神経","陰部神経","大腿神経"],2,"外尿道括約筋は横紋筋で、陰部神経(体性神経)が支配し、意思で締められる。",["骨盤内臓神経は副交感神経。","下腹神経は交感神経。","","大腿神経は支配しない。"]],["尿にブドウ糖が出るのはどのようなときか。",["血糖値が尿細管で再吸収できる量を超えたとき","血糖値が低いとき","水をたくさん飲んだとき","運動の直後"],0,"血糖値が一定の値を超えると、尿細管で再吸収しきれずに尿に出る。",["","血糖値が低いときは出ない。","水を飲んでも出ない。","運動の直後に出るわけではない。"]],["バソプレシンの分泌が増えるのはどのようなときか。",["血漿の浸透圧が下がったとき","水をたくさん飲んだとき","汗をかいて血漿の浸透圧が上がったとき","アルコールを飲んだとき"],2,"脱水などで血漿の浸透圧が上がると、バソプレシンが増えて水の再吸収が増える。",["浸透圧が下がると分泌は減る。","水を飲むと分泌は減る。","","アルコールは分泌をおさえる。"]],["アルコールを飲むと尿が増える主な理由はどれか。",["ブドウ糖が尿に出るため","アルドステロンの分泌が増えるため","糸球体が壊れるため","バソプレシンの分泌がおさえられるため"],3,"アルコールはバソプレシンの分泌をおさえ、水の再吸収が減って尿が増える。",["理由ではない。","アルドステロンが増えると尿は減る方向。","理由ではない。",""]],["体に酸がたまったとき(アシドーシス)の腎臓の働きはどれか。",["尿をアルカリ性にする","H⁺の排泄を減らす","HCO₃⁻の排泄を増やす","H⁺の排泄を増やす"],3,"腎臓はH⁺を尿へ出し、HCO₃⁻を体に取り戻してpHを元に戻そうとする。",["尿は酸性になる。","減らすとさらに酸性に傾く。","HCO₃⁻は再吸収を増やす。",""]],["尿に含まれる有機物で最も多いものはどれか。",["アンモニア","尿酸","クレアチニン","尿素"],3,"尿の有機物で最も多いのは尿素で、たんぱく質の分解でできた窒素を捨てる形。",["アンモニアは尿素より少ない。","尿酸は尿素よりずっと少ない。","クレアチニンは尿素より少ない。",""]],["糸球体ろ過を起こす主な力はどれか。",["膠質浸透圧","糸球体の毛細血管の血圧","ボウマン嚢の中の圧","尿管の蠕動"],1,"糸球体の血圧が、膠質浸透圧やボウマン嚢の圧に打ち勝って液体を押し出す。",["膠質浸透圧はろ過をおさえる方向に働く。","","ボウマン嚢の中の圧はろ過をおさえる方向に働く。","尿管の蠕動は尿を運ぶ動き。"]],["腎盤から膀胱へ尿を送るしくみはどれか。",["腹筋の収縮","重力だけ","尿管の蠕動運動","膀胱の吸引"],2,"尿管は平滑筋の蠕動運動で尿を膀胱へ送る。そのため横になっていても尿は運ばれる。",["腹筋は関係しない。","重力だけではない。","","膀胱が吸い込むのではない。"]],["蓄尿と排尿を切り替える上位の中枢がある部位はどれか。",["橋","小脳","中脳","延髄"],0,"脳幹の橋に排尿中枢があり、仙髄の排尿反射を調節する。さらに大脳がこれをコントロールする。",["","小脳ではない。","中脳ではない。","延髄ではない。"]],["尿細管で血液から尿へ分泌されるものはどれか。",["アルブミン","ブドウ糖","アミノ酸","H⁺"],3,"尿細管はH⁺やK⁺などを尿へ分泌して、体液のpHや電解質を調節する。",["アルブミンはほとんどろ過されない。","ブドウ糖は再吸収される。","アミノ酸は再吸収される。",""]],["健康な人で、糸球体でろ過されたアミノ酸はどうなるか。",["集合管でほぼすべて再吸収される","近位尿細管でほぼすべて再吸収される","ほとんどが尿に出る","ろ過されない"],1,"アミノ酸はブドウ糖と同じく、近位尿細管でほぼすべて再吸収される。",["集合管では再吸収されない。","","ほとんど尿に出ない。","アミノ酸は小さいのでろ過される。"]]]},
{"id":"p8","g":"p","k":"内","name":"内分泌","q":[["血糖値を下げるホルモンはどれか。",["インスリン","アドレナリン","コルチゾール","グルカゴン"],0,"インスリンは膵臓のB(β)細胞から出て、細胞にブドウ糖を取り込ませる。血糖を下げる唯一のホルモン。",["","アドレナリンは血糖を上げる。","コルチゾールは血糖を上げる。","グルカゴンは血糖を上げる。"]],["下垂体後葉から分泌されるホルモンはどれか。",["成長ホルモン","オキシトシン","甲状腺刺激ホルモン","プロラクチン"],1,"後葉からはオキシトシンとバソプレシンが出る(視床下部でつくられ、後葉から放出される)。",["成長ホルモンは前葉。","","甲状腺刺激ホルモンは前葉。","プロラクチンは前葉。"]],["血液中のカルシウム濃度を上げるホルモンはどれか。",["カルシトニン","インスリン","パラトルモン","アルドステロン"],2,"パラトルモンは骨からカルシウムを溶かし出し、腎臓での再吸収を増やして血中Ca²⁺を上げる。",["カルシトニンは血中Ca²⁺を下げる。","インスリンは血糖を下げる。","","アルドステロンはNa⁺の再吸収を増やす。"]],["副腎髄質から分泌されるホルモンはどれか。",["コルチゾール","アドレナリン","アルドステロン","アンドロゲン"],1,"副腎髄質からはアドレナリンとノルアドレナリンが出る。",["コルチゾールは副腎皮質(束状帯)。","","アルドステロンは副腎皮質(球状帯)。","アンドロゲン(男性ホルモン)は副腎皮質(網状帯)。"]],["血液中の甲状腺ホルモンが増えると、甲状腺刺激ホルモン(TSH)の分泌はどうなるか。",["増える","変わらない","減る","増え続ける"],2,"負のフィードバックにより、甲状腺ホルモンが増えると下垂体のTSHは減る。",["負のフィードバックなので増えない。","フィードバックで変化する。","","フィードバックで抑えられる。"]],["成長ホルモンの作用はどれか。",["尿量を減らす","血糖を下げる","乳汁の産生を促す","骨の成長を促す"],3,"成長ホルモンは肝臓でソマトメジン(IGF-1)をつくらせ、骨や筋の成長を促す。血糖は上げる。",["尿量を減らすのはバソプレシン。","血糖はむしろ上げる。","乳汁の産生を促すのはプロラクチン。",""]],["成人になってから成長ホルモンが過剰になると起こる病気はどれか。",["先端巨大症","巨人症","クレチン症","尿崩症"],0,"骨端線が閉じた後に過剰になると、手足や顎などの先端が大きくなる(先端巨大症)。",["","巨人症は骨端線が閉じる前(成長期)に過剰になった場合。","クレチン症は小児期の甲状腺ホルモン不足。","尿崩症はバソプレシン不足。"]],["オキシトシンの作用はどれか。",["尿の濃縮","乳汁の産生","排卵","射乳と子宮の収縮"],3,"オキシトシンは授乳時に乳汁を押し出し(射乳)、分娩時に子宮を収縮させる。",["尿を濃くするのはバソプレシン。","乳汁をつくるのはプロラクチン。","排卵を起こすのは黄体形成ホルモン。",""]],["バソプレシンが不足して、薄い尿が大量に出る病気はどれか。",["クッシング症候群","糖尿病","尿崩症","アジソン病"],2,"尿崩症では集合管で水を再吸収できず、薄い尿が大量に出る。",["クッシング症候群はコルチゾールの過剰。","糖尿病はインスリンの不足や働きの低下による。","","アジソン病は副腎皮質の機能低下。"]],["甲状腺機能亢進症(バセドウ病など)でみられる症状はどれか。",["頻脈","寒がり","体重の増加","徐脈"],0,"甲状腺ホルモンが多すぎると代謝が高まり、頻脈・暑がり・汗が多い・体重減少などが起こる。",["","寒がりは機能低下症の症状。","体重は減る。","徐脈は機能低下症の症状。"]],["甲状腺機能低下症でみられる症状はどれか。",["寒がり","頻脈","発汗の増加","体重の減少"],0,"甲状腺ホルモンが足りないと代謝が下がり、寒がり・むくみ・徐脈・体重増加などが起こる。",["","頻脈は機能亢進症の症状。","発汗の増加は機能亢進症の症状。","体重の減少は機能亢進症の症状。"]],["小児期に甲状腺ホルモンが不足すると起こるものはどれか。",["クレチン症","巨人症","先端巨大症","クッシング症候群"],0,"生まれつき甲状腺ホルモンが不足すると、成長や知能の発達が遅れる(クレチン症)。",["","巨人症は成長ホルモンの過剰。","先端巨大症は成人での成長ホルモンの過剰。","クッシング症候群はコルチゾールの過剰。"]],["コルチゾールの作用はどれか。",["免疫を強める","炎症を強める","血圧を下げる","血糖を上げる"],3,"コルチゾールは糖新生を促して血糖を上げ、炎症や免疫をおさえる。",["免疫はおさえる。","炎症はおさえる。","血圧はむしろ上げる方向に働く。",""]],["コルチゾールの血中濃度が1日で最も高くなる時間帯はどれか。",["夕方","正午","早朝","深夜"],2,"コルチゾールは早朝に最も高く、夜に低くなる日内変動がある。",["夕方は低くなっている。","正午は早朝より低い。","","深夜は最も低い時間帯に近い。"]],["コルチゾールの分泌を促すホルモンはどれか。",["副腎皮質刺激ホルモン(ACTH)","甲状腺刺激ホルモン(TSH)","卵胞刺激ホルモン(FSH)","プロラクチン"],0,"下垂体前葉のACTHが副腎皮質に働き、コルチゾールの分泌を促す。",["","TSHは甲状腺に働く。","FSHは卵巣や精巣に働く。","プロラクチンは乳腺に働く。"]],["コルチゾールが過剰になって起こる病気はどれか。",["クッシング症候群","アジソン病","バセドウ病","尿崩症"],0,"クッシング症候群では満月様顔貌、中心性肥満、高血糖、高血圧などがみられる。",["","アジソン病は副腎皮質の機能低下。","バセドウ病は甲状腺の機能亢進。","尿崩症はバソプレシン不足。"]],["アドレナリンの作用でないものはどれか。",["気管支を収縮させる","心拍数を増やす","血糖を上げる","瞳孔を広げる"],0,"アドレナリンは交感神経と同じように働き、気管支は広げる。",["","心拍数を増やすのはアドレナリンの作用。","血糖を上げるのはアドレナリンの作用。","瞳孔を広げるのはアドレナリンの作用。"]],["アルドステロンの分泌を促すものはどれか。",["インスリン","心房性ナトリウム利尿ペプチド","アンジオテンシンII","カルシトニン"],2,"レニン-アンジオテンシン-アルドステロン系で、アンジオテンシンIIが副腎皮質からアルドステロンを出させる。",["インスリンは主な刺激ではない。","心房性ナトリウム利尿ペプチドはアルドステロンの分泌をおさえる。","","カルシトニンは関係しない。"]],["インスリンの作用はどれか。",["糖新生を促す","肝臓でのグリコーゲンの分解を促す","肝臓でのグリコーゲンの合成を促す","脂肪の分解を促す"],2,"インスリンはブドウ糖を細胞に取り込ませ、グリコーゲンや脂肪として蓄えさせる。",["糖新生はおさえる。","グリコーゲンの分解を促すのはグルカゴンなど。","","脂肪の分解はおさえる。"]],["グルカゴンの作用はどれか。",["脂肪の合成を促す","血糖を下げる","肝臓のグリコーゲンを分解して血糖を上げる","胃酸の分泌を促す"],2,"グルカゴンは空腹時に出て、肝臓のグリコーゲン分解と糖新生を促し血糖を上げる。",["脂肪の合成を促すのはインスリン。","血糖を下げるのはインスリン。","","胃酸の分泌を促すのはガストリン。"]],["細胞の中(細胞質や核)の受容体に結合するホルモンはどれか。",["アドレナリン","インスリン","甲状腺ホルモン","グルカゴン"],2,"甲状腺ホルモンやステロイドホルモンは細胞膜を通り抜け、細胞内の受容体に結合する。",["アドレナリンは細胞膜の受容体に結合する。","インスリンは細胞膜の受容体に結合する。","","グルカゴンは細胞膜の受容体に結合する。"]],["甲状腺刺激ホルモン(TSH)の分泌を促すホルモンはどれか。",["成長ホルモン放出ホルモン","甲状腺刺激ホルモン放出ホルモン(TRH)","副腎皮質刺激ホルモン放出ホルモン","ソマトスタチン"],1,"視床下部のTRHが下垂体前葉に働き、TSHの分泌を促す。",["成長ホルモン放出ホルモンは成長ホルモンの分泌を促す。","","副腎皮質刺激ホルモン放出ホルモンはACTHの分泌を促す。","ソマトスタチンは成長ホルモンなどの分泌をおさえる。"]],["成長ホルモンの分泌をおさえるホルモンはどれか。",["ソマトスタチン","成長ホルモン放出ホルモン","グレリン","甲状腺刺激ホルモン"],0,"ソマトスタチンは視床下部や膵島のD細胞から出て、成長ホルモンなどの分泌をおさえる。",["","成長ホルモン放出ホルモンは分泌を促す。","グレリンは分泌を促す。","甲状腺刺激ホルモンは甲状腺に働く。"]],["深い睡眠中に分泌が増える下垂体前葉ホルモンはどれか。",["成長ホルモン","甲状腺刺激ホルモン","卵胞刺激ホルモン","副腎皮質刺激ホルモン"],0,"成長ホルモンは寝入ってすぐの深い睡眠のときに多く分泌される。",["","甲状腺刺激ホルモンの代表的な特徴ではない。","卵胞刺激ホルモンの代表的な特徴ではない。","副腎皮質刺激ホルモンは早朝に多い。"]],["エストロゲンの作用はどれか。",["乳汁をつくらせる","基礎体温を上げる","子宮内膜を厚くする(増殖させる)","子宮の収縮をおさえて妊娠を保つ"],2,"エストロゲンは月経後の子宮内膜を増殖させ(増殖期)、女性らしい体つきをつくる。",["乳汁をつくらせるのはプロラクチン。","基礎体温を上げるのはプロゲステロン。","","妊娠を保つのはプロゲステロン。"]],["活性型ビタミンDの作用はどれか。",["腸からのカルシウムの吸収を促す","血中カルシウムを下げる","血糖を下げる","ナトリウムの排泄を増やす"],0,"活性型ビタミンDは小腸でのカルシウムとリンの吸収を促し、血中カルシウムを上げる。",["","血中カルシウムを下げるのはカルシトニン。","血糖を下げるのはインスリン。","作用ではない。"]],["メラトニンの分泌について正しいのはどれか。",["暗くなると増える","明るいほど増える","食後に増える","運動で増える"],0,"メラトニンは夜に暗くなると松果体から多く出て、眠りを誘う。光で分泌がおさえられる。",["","光は分泌をおさえる。","食事との関係は主ではない。","運動との関係は主ではない。"]],["プロラクチンの分泌をおさえる、視床下部からの物質はどれか。",["ドパミン","オキシトシン","バソプレシン","エストロゲン"],0,"視床下部のドパミンがプロラクチンの分泌をふだんおさえている。",["","オキシトシンは射乳に働く。","バソプレシンは水の再吸収を促す。","エストロゲンは視床下部の物質ではない。"]],["上皮小体の機能が低下すると起こるものはどれか。",["尿崩症","高カルシウム血症","尿路結石","テタニー(筋のけいれん)"],3,"パラトルモンが減ると血中カルシウムが下がり、神経や筋が興奮しやすくなってテタニーが起こる。",["尿崩症はバソプレシン不足。","血中カルシウムは下がる。","尿路結石は高カルシウムになる機能亢進症で起こりやすい。",""]],["正のフィードバックの例はどれか。",["コルチゾールによるACTHの抑制","甲状腺ホルモンによるTSHの抑制","分娩時のオキシトシンの分泌","血糖上昇によるインスリン分泌"],2,"分娩時は子宮の収縮がオキシトシンをさらに増やし、さらに収縮が強まる(正のフィードバック)。",["これは負のフィードバック。","これは負のフィードバック。","","血糖を元に戻す方向の調節(負のフィードバック)。"]]]},
{"id":"p9","g":"p","k":"神","name":"神経","q":[["静止状態の神経細胞の膜電位はどれか。",["細胞内がプラス","細胞内がマイナス","内外とも0","興奮したときだけ生じる"],1,"静止時は、細胞内が外に比べてマイナスになっている。",["細胞内がプラスになるのは興奮(活動電位)のとき。","","静止時も電位差がある。","静止膜電位は興奮していなくても常にある。"]],["興奮の伝わる速さ(伝導速度)が最も速い神経線維はどれか。",["細い有髄線維","太い有髄線維","太い無髄線維","細い無髄線維"],1,"髄鞘がある線維は跳躍伝導をするので速く、太いほど速い。",["細い有髄線維は太いものより遅い。","","無髄線維は跳躍伝導をしないので遅い。","細い無髄線維は最も遅い。"]],["シナプスでの興奮の伝達の特徴はどれか。",["疲労しない","両方向に伝わる","神経線維上より速く伝わる","一方向にだけ伝わる"],3,"伝達物質は前のニューロンから後ろのニューロンへ放出されるので、一方向にしか伝わらない。",["シナプスは疲労しやすい。","両方向に伝わるのは神経線維上の伝導。","シナプスでは時間がかかる(シナプス遅延)。",""]],["膝蓋腱反射の反射中枢はどこか。",["腰髄","胸髄","頸髄","仙髄"],0,"膝蓋腱反射の中枢は腰髄(L2〜L4)。",["","胸髄は腹壁反射など。","頸髄は上腕二頭筋反射など。","仙髄はアキレス腱反射(S1)など。"]],["副交感神経が働いたときに起こるのはどれか。",["瞳孔が小さくなる","心拍数が増える","気管支が広がる","消化管の動きが弱まる"],0,"副交感神経は瞳孔括約筋を収縮させ、瞳孔を小さくする(縮瞳)。",["","心拍数が増えるのは交感神経。","気管支が広がるのは交感神経。","副交感神経では消化管の動きは強まる。"]],["活動電位の立ち上がり(脱分極)を起こすイオンの動きはどれか。",["Na⁺が細胞内に流れ込む","K⁺が細胞内に流れ込む","Na⁺が細胞外に出ていく","Cl⁻が細胞外に出ていく"],0,"刺激でNa⁺チャネルが開き、Na⁺が細胞内に流れ込んで膜電位がプラスになる。",["","K⁺は細胞外へ出ていき、再分極を起こす。","Na⁺は流れ込む。","活動電位の立ち上がりの主役ではない。"]],["活動電位のあと、膜電位を元に戻す(再分極)イオンの動きはどれか。",["Ca²⁺が細胞内に流れ込む","Na⁺が細胞内に流れ込む","K⁺が細胞外に出ていく","Cl⁻が細胞内に流れ込む"],2,"K⁺チャネルが開いてK⁺が外へ出ると、膜電位がマイナスに戻る。",["神経の再分極の主役ではない。","Na⁺の流入は脱分極を起こす。","","再分極の主役ではない。"]],["刺激が閾値を超えると、刺激の強さに関係なく同じ大きさの活動電位が出る法則はどれか。",["ベル・マジャンディの法則","スターリングの心臓の法則","全か無かの法則","ウェーバーの法則"],2,"1本の神経線維では、閾値以上の刺激なら活動電位の大きさは一定(全か無かの法則)。",["ベル・マジャンディの法則は前根・後根の働きの違い。","スターリングの心臓の法則は心筋の伸びと収縮力の関係。","","ウェーバーの法則は感覚の区別できる差に関する法則。"]],["どんなに強い刺激を与えても興奮が起こらない時期はどれか。",["相対不応期","絶対不応期","静止期","過分極期"],1,"活動電位の直後の絶対不応期では、刺激の強さに関係なく興奮しない。",["相対不応期では、強い刺激なら興奮できる。","","静止期は興奮できる。","不応期の区分の名前ではない。"]],["C線維の特徴はどれか。",["骨格筋を支配する","有髄で最も速い","無髄で伝導が遅い","筋紡錘からの情報を伝える"],2,"C線維は細い無髄線維で伝導が最も遅く、鈍い痛みや温度、自律神経の節後線維などを担う。",["骨格筋を支配するのはAα線維(α運動ニューロン)。","最も速いのはAα線維。","","筋紡錘からの情報はIa線維(Aα)が伝える。"]],["抑制性シナプス後電位(IPSP)で起こる膜電位の変化はどれか。",["過分極","脱分極","活動電位","変化しない"],0,"IPSPでは膜電位がよりマイナスになり(過分極)、興奮しにくくなる。",["","脱分極は興奮性シナプス後電位(EPSP)。","活動電位ではない。","膜電位は変化する。"]],["交感神経の節後線維から主に放出される伝達物質はどれか。",["セロトニン","アセチルコリン","ドパミン","ノルアドレナリン"],3,"交感神経の節後線維の多くはノルアドレナリンを放出する(汗腺は例外でアセチルコリン)。",["セロトニンは主に脳や腸の伝達物質。","アセチルコリンは副交感神経の節後線維や、自律神経節で放出される。","ドパミンは主に脳内の伝達物質。",""]],["自律神経節(交感・副交感とも)で放出される伝達物質はどれか。",["アドレナリン","ノルアドレナリン","アセチルコリン","GABA"],2,"交感神経も副交感神経も、節前線維の終末からはアセチルコリンが出る。",["アドレナリンは副腎髄質から出る。","ノルアドレナリンは交感神経の節後線維から出る。","","GABAは脳内の抑制性の伝達物質。"]],["伸張反射の受容器はどれか。",["ゴルジ腱器官","筋紡錘","パチニ小体","マイスナー小体"],1,"筋紡錘は筋が伸ばされたことを感じ、その筋を反射的に収縮させる。",["ゴルジ腱器官は腱にかかる張力を感じる。","","パチニ小体は振動を感じる皮膚の受容器。","マイスナー小体は触覚の受容器。"]],["シナプスを1つしか経由しない(単シナプス)反射はどれか。",["交叉性伸展反射","屈曲反射","伸張反射","嚥下反射"],2,"伸張反射は感覚ニューロンが運動ニューロンに直接つながる単シナプス反射。",["交叉性伸展反射は多シナプス反射。","屈曲反射は多シナプス反射。","","嚥下反射は脳幹を経由する複雑な反射。"]],["熱い物に触れて、思わず手を引っ込める反射はどれか。",["圧受容器反射","伸張反射","対光反射","屈曲反射"],3,"痛みの刺激で手足を引っ込める反射を屈曲反射(逃避反射)という。",["圧受容器反射は血圧の反射。","伸張反射は筋が伸ばされたときの反射。","対光反射は瞳孔の反射。",""]],["対光反射の中枢がある部位はどれか。",["中脳","延髄","小脳","脊髄"],0,"光が目に入ると、中脳を中枢として動眼神経が働き、瞳孔が小さくなる。",["","延髄ではない。","小脳ではない。","脊髄ではない。"]],["角膜反射で、角膜に触れた感覚を伝える神経はどれか。",["視神経","顔面神経","動眼神経","三叉神経"],3,"角膜の感覚は三叉神経が伝え、顔面神経が眼輪筋を動かしてまばたきさせる。",["視神経は光の情報を伝える。","顔面神経はまばたきを起こす側(遠心路)。","動眼神経は対光反射に関わる。",""]],["小脳の主な働きはどれか。",["運動の協調と体の平衡を保つ","呼吸のリズムをつくる","体温を調節する","言語を理解する"],0,"小脳は運動をなめらかに調整し、姿勢や平衡を保つ。障害されると歩行のふらつきなどが起こる。",["","呼吸のリズムは延髄。","体温調節は視床下部。","言語の理解は大脳皮質(ウェルニッケ野)。"]],["パーキンソン病でドパミンをつくる神経細胞が減る部位はどれか。",["延髄","小脳","海馬","黒質"],3,"中脳の黒質のドパミン神経が減り、大脳基底核の働きが乱れて、ふるえや動作の遅さが起こる。",["延髄ではない。","小脳ではない。","海馬は記憶に関わる。",""]],["錐体路が障害されたときにみられる徴候はどれか。",["筋がだらりとゆるむ(弛緩)","腱反射が消える","バビンスキー反射が出る","筋が萎縮して線維束性収縮が出る"],2,"錐体路(上位運動ニューロン)の障害では、バビンスキー反射の出現や腱反射の亢進、痙性がみられる。",["痙性(筋が突っ張る)になる。","腱反射は亢進する。","","萎縮や線維束性収縮は下位運動ニューロンの障害。"]],["視床の主な働きはどれか。",["嗅覚以外の感覚を大脳皮質へ中継する","体温を調節する","呼吸のリズムをつくる","ホルモンを分泌する"],0,"視床は嗅覚を除くほとんどの感覚の情報を大脳皮質へ中継する。",["","体温調節は視床下部。","呼吸のリズムは延髄。","ホルモン分泌の中枢は視床下部。"]],["視床下部の働きでないものはどれか。",["体温の調節","呼吸のリズムをつくる","摂食(食欲)の調節","下垂体ホルモンの分泌の調節"],1,"呼吸のリズムをつくるのは延髄。視床下部は自律神経と内分泌の最高中枢。",["体温調節は視床下部の働き。","","摂食の調節は視床下部の働き。","下垂体の調節は視床下部の働き。"]],["目を閉じて安静にしているときに主にみられる脳波はどれか。",["β波","α波","θ波","δ波"],1,"安静・閉眼ではα波がみられ、目を開けたり考え事をしたりするとβ波になる。",["β波は目を開けたり緊張したりしているとき。","","θ波は浅い眠りのとき。","δ波は深い眠りのとき。"]],["レム睡眠の特徴はどれか。",["夢をほとんど見ない","脳波がδ波になる","骨格筋の緊張が高まる","急速な眼球運動がみられる"],3,"レム睡眠では急速な眼球運動がみられ、夢を見ることが多く、全身の筋の緊張は低下する。",["夢を見ることが多い。","δ波は深いノンレム睡眠。","筋の緊張は低下する。",""]],["新しい記憶をつくるのに重要な部位はどれか。",["海馬","小脳","延髄","黒質"],0,"海馬は新しい記憶の形成に重要。",["","小脳は運動の調節(運動の学習には関わる)。","延髄は生命維持の中枢。","黒質は運動の調節に関わる。"]],["温度覚・痛覚を伝える線維が反対側へ交叉する部位はどれか。",["中脳","延髄","脊髄","視床"],2,"温痛覚の線維は脊髄に入ったあとすぐに反対側へ交叉し、外側脊髄視床路を上る。",["中脳ではない。","延髄で交叉するのは識別性の触覚・深部感覚(後索の経路)。","","視床では交叉しない。"]],["脊髄の右半分が切断されたとき(ブラウン・セカール症候群)にみられるものはどれか。",["右側の運動麻痺と、左側の温痛覚の障害","左側の運動麻痺と、右側の温痛覚の障害","両側の運動麻痺","障害は起こらない"],0,"運動の経路は切断側で障害され、温痛覚は脊髄で交叉しているため反対側で障害される。",["","左右が逆。","運動麻痺は切断した側に起こる。","障害が起こる。"]],["筋紡錘の感度を調節する運動ニューロンはどれか。",["α運動ニューロン","γ運動ニューロン","交感神経の節後ニューロン","介在ニューロン"],1,"γ運動ニューロンは筋紡錘の中の筋線維を縮め、筋が縮んでも筋紡錘が伸びを感じられるようにする。",["α運動ニューロンは筋そのもの(錘外筋)を収縮させる。","","交感神経は筋紡錘の感度を調節しない。","介在ニューロンは運動ニューロンではない。"]],["交感神経だけに支配されるものはどれか。",["汗腺","心臓","胃","膀胱"],0,"汗腺・副腎髄質・立毛筋・多くの血管は交感神経だけに支配される。",["","心臓は交感・副交感の両方に支配される。","胃は両方に支配される。","膀胱は両方に支配される。"]]]},
{"id":"p10","g":"p","k":"筋","name":"筋","q":[["骨格筋の収縮で、Ca²⁺が結合するたんぱく質はどれか。",["トロポニン","ミオシン","トロポミオシン","アクチン"],0,"Ca²⁺がトロポニンに結合すると、アクチンとミオシンが結びつけるようになり、収縮が起こる。",["","ミオシンは太いフィラメントの主成分。","トロポミオシンは安静時、アクチンの結合部位をふさいでいる。","アクチンは細いフィラメントの主成分。"]],["神経筋接合部で放出される伝達物質はどれか。",["アセチルコリン","ノルアドレナリン","ドパミン","GABA"],0,"運動神経の終末からアセチルコリンが出て、骨格筋を興奮させる。",["","ノルアドレナリンは主に交感神経の節後線維から出る。","ドパミンは主に脳内の伝達物質。","GABAは脳内の抑制性の伝達物質。"]],["筋の長さが変わらないまま張力を出す収縮はどれか。",["等尺性収縮","等張性収縮","求心性収縮","遠心性収縮"],0,"壁を押す、物を持ったまま止めるなど、関節が動かない収縮が等尺性収縮。",["","等張性収縮は一定の負荷で、筋の長さが変わる。","求心性収縮は筋が短くなりながら力を出す。","遠心性収縮は筋が伸ばされながら力を出す。"]],["持久力にすぐれ、疲れにくい骨格筋線維はどれか。",["白筋(速筋)","赤筋(遅筋)","平滑筋","心筋"],1,"赤筋はミトコンドリアやミオグロビンが多く、酸素を使って長く働ける。",["白筋は速く強く縮むが、疲れやすい。","","平滑筋は内臓の筋で、骨格筋ではない。","心筋は心臓の筋で、骨格筋ではない。"]],["骨格筋が収縮するとき、短くなるのはどれか。",["A帯(暗帯)","細いフィラメント","太いフィラメント","I帯(明帯)"],3,"フィラメントどうしが滑り込むため、I帯(とH帯)が短くなる。A帯の長さは変わらない。",["A帯の長さは変わらない。","フィラメント自体の長さは変わらない。","フィラメント自体の長さは変わらない。",""]],["ミオシンの頭部をアクチンから離すのに必要なものはどれか。",["ATP","Ca²⁺","Na⁺","酸素"],0,"ATPがミオシン頭部に結合するとアクチンから離れ、次の首振り運動ができる。",["","Ca²⁺は結合を始めさせるきっかけ。","Na⁺は直接は関わらない。","酸素は直接は関わらない。"]],["死後硬直が起こる主な理由はどれか。",["神経からの刺激が続く","Ca²⁺がなくなる","筋が乾燥する","ATPがなくなり、アクチンとミオシンが離れなくなる"],3,"死後はATPがつくられず、ミオシンとアクチンが結合したまま離れなくなる。",["神経の刺激はなくなる。","Ca²⁺は放出されて結合を始めさせる側。","乾燥が主な理由ではない。",""]],["筋小胞体の働きはどれか。",["Ca²⁺を蓄え、放出する","ATPをつくる","たんぱく質を合成する","興奮を神経へ伝える"],0,"筋小胞体はCa²⁺を蓄え、興奮が来ると放出して収縮を起こし、取り込んで弛緩させる。",["","ATPをつくるのはミトコンドリア。","たんぱく質を合成するのはリボソーム。","筋小胞体の働きではない。"]],["横行小管(T管)の働きはどれか。",["筋線維どうしをつなぐ","Ca²⁺を蓄える","ATPを分解する","筋線維の表面の興奮を内部へ伝える"],3,"T管は細胞膜が内部へ入り込んだ管で、活動電位を筋線維の奥まで伝え、筋小胞体にCa²⁺を放出させる。",["筋線維どうしはつないでいない。","Ca²⁺を蓄えるのは筋小胞体。","ATPを分解するのはミオシン頭部。",""]],["運動単位とは何か。",["1つの運動ニューロンと、それが支配する筋線維のまとまり","1本の筋線維","1つの筋と、それを支配する神経すべて","筋紡錘とその感覚神経"],0,"1つのα運動ニューロンが興奮すると、それが支配する筋線維がいっせいに収縮する。このまとまりが運動単位。",["","1本の筋線維ではない。","筋全体ではない。","筋紡錘は感覚の受容器。"]],["眼を動かす筋など、細かい動きをする筋の特徴はどれか。",["1つの運動ニューロンが支配する筋線維の数が少ない","1つの運動ニューロンが支配する筋線維の数が多い","平滑筋でできている","運動単位がない"],0,"細かい動きをする筋は運動単位が小さく、少しずつ力を調整できる。",["","多いのは大きな力を出す筋(大腿の筋など)。","外眼筋は骨格筋。","運動単位はある。"]],["刺激を短い間隔でくり返すと、単収縮が重なって大きく持続的に縮むことを何というか。",["拘縮","単収縮","強縮","痙攣"],2,"刺激が速くくり返されると、収縮が加算されて強縮になる。ふだんの筋の収縮は強縮。",["拘縮は関節が固まって動きが制限された状態。","単収縮は1回の刺激による1回の収縮。","","痙攣は意図しない収縮。"]],["階段を下りるときの大腿四頭筋の収縮はどれか。",["遠心性収縮","求心性収縮","等尺性収縮","強縮しない"],0,"体重を支えながら膝を曲げていくので、大腿四頭筋は伸ばされながら力を出す(遠心性収縮)。",["","求心性収縮は階段を上るとき。","関節が動くので等尺性ではない。","強縮して力を出している。"]],["平滑筋の特徴はどれか。",["横紋がある","ゆっくり持続的に収縮し、意思では動かせない","収縮が速く疲れやすい","すべて意思で動かせる"],1,"平滑筋は内臓や血管の壁にあり、ゆっくり長く収縮し、自律神経などで調節される。",["横紋はない。","","速く疲れやすいのは骨格筋の白筋。","意思では動かせない。"]],["平滑筋はどこにあるか。",["横隔膜","心臓","舌","血管の壁"],3,"平滑筋は血管や消化管、膀胱、気管支などの壁にある。",["横隔膜は骨格筋。","心臓は心筋。","舌は骨格筋。",""]],["平滑筋の収縮で、Ca²⁺が結合するたんぱく質はどれか。",["ミオグロビン","トロポニン","カルモジュリン","ヘモグロビン"],2,"平滑筋にはトロポニンがなく、Ca²⁺はカルモジュリンに結合して収縮を起こす。",["ミオグロビンは筋の中で酸素を蓄える。","トロポニンは骨格筋と心筋にある。","","ヘモグロビンは赤血球で酸素を運ぶ。"]],["心筋の特徴はどれか。",["横紋があり、意思では動かせない","横紋がなく、意思で動かせる","横紋がなく、意思では動かせない","横紋があり、意思で動かせる"],0,"心筋は骨格筋と同じく横紋があるが、不随意筋。",["","心筋には横紋がある。","心筋には横紋がある(平滑筋の特徴)。","骨格筋の特徴。"]],["心筋の介在板(ギャップ結合)の役割はどれか。",["ATPをつくる","Ca²⁺を蓄える","興奮を隣の細胞へすばやく伝える","筋を骨に付ける"],2,"介在板のギャップ結合を通じて興奮が次々に伝わり、心筋全体が一つのようにまとまって収縮する。",["ATPをつくるのはミトコンドリア。","Ca²⁺を蓄えるのは筋小胞体。","","筋を骨に付けるのは腱。"]],["運動の初めの数秒間、ATPを素早く補う物質はどれか。",["乳酸","グリコーゲン","中性脂肪","クレアチンリン酸"],3,"クレアチンリン酸はリン酸をADPに渡して、すぐにATPを再びつくる。",["乳酸は代謝でできる物質。","グリコーゲンは解糖でATPをつくるが、少し時間がかかる。","中性脂肪は長い運動のエネルギー源。",""]],["激しい運動の後も、しばらく酸素の消費が多い状態を何というか。",["酸素解離","酸素負債","過換気","無酸素"],1,"運動中に不足した分を取り戻すため、運動後も酸素の消費が多く続く(酸素負債)。",["酸素解離はヘモグロビンが酸素を離すこと。","","過換気は呼吸のしすぎ。","無酸素ではない。"]],["筋力トレーニングで筋が太くなる主な理由はどれか。",["1本1本の筋線維が太くなる","筋線維の数が大きく増える","脂肪が増える","骨が太くなる"],0,"筋肥大は主に1本1本の筋線維が太くなることで起こる。",["","筋線維の数はほとんど増えない。","脂肪が増えても筋力は上がらない。","筋が太くなる理由ではない。"]],["長くギプス固定をしたときに、筋が細くなることを何というか。",["強縮","筋肥大","拘縮","廃用性萎縮"],3,"使わない筋は筋線維が細くなり、筋力が落ちる(廃用性萎縮)。",["強縮は収縮の様式。","筋肥大は太くなること。","拘縮は関節が固まって動きにくくなること。",""]],["ゴルジ腱器官が強い張力を感じたときに起こる反応はどれか。",["拮抗筋をゆるめる","その筋をさらに収縮させる","その筋をゆるめる","心拍数を増やす"],2,"ゴルジ腱器官は腱にかかる張力を感じ、強すぎるとその筋の収縮をおさえて腱や筋を守る(自原抑制)。",["拮抗筋をゆるめる働きではない。","さらに収縮させるのは筋紡錘による伸張反射。","","心拍数には関わらない。"]],["ある筋が収縮するとき、その拮抗筋がゆるむしくみはどれか。",["全か無かの法則","二重支配","相反神経支配","正のフィードバック"],2,"主動筋が収縮するとき、脊髄の回路で拮抗筋の運動ニューロンがおさえられ、動きがなめらかになる。",["全か無かの法則は活動電位の性質。","二重支配は交感・副交感の両方に支配されること。","","正のフィードバックではない。"]],["筋節(サルコメア)の境界をつくるものはどれか。",["A帯","M線","Z線","H帯"],2,"筋節はZ線からZ線までの単位で、細いフィラメントはZ線に付いている。",["A帯は太いフィラメントがある部分。","M線は筋節の中央。","","H帯はA帯の中央で、太いフィラメントだけの部分。"]],["筋が収縮するしくみの説明として正しいのはどれか。",["細いフィラメントが太いフィラメントの間に滑り込む","フィラメント自体が縮む","太いフィラメントが細いフィラメントの外へ出ていく","Z線が消える"],0,"滑走説:アクチン(細いフィラメント)がミオシン(太いフィラメント)の間に滑り込み、筋節が短くなる。",["","フィラメントの長さは変わらない。","外へ出ていくのではなく、滑り込む。","Z線は消えない。"]],["興奮収縮連関の順序として正しいのはどれか。",["トロポニンにCa²⁺結合→活動電位→T管→筋小胞体からCa²⁺放出","筋小胞体からCa²⁺放出→活動電位→T管→トロポニンにCa²⁺結合","活動電位→T管→筋小胞体からCa²⁺放出→トロポニンにCa²⁺結合","T管→活動電位→トロポニンにCa²⁺結合→筋小胞体からCa²⁺放出"],2,"筋線維の活動電位がT管で内部に伝わり、筋小胞体からCa²⁺が出て、トロポニンに結合して収縮が始まる。",["トロポニンへの結合は最後。","活動電位が最初。","","活動電位が最初で、Ca²⁺の放出が結合より先。"]],["重症筋無力症の原因として正しいのはどれか。",["筋がジストロフィンを欠く","ドパミンをつくる神経が減る","運動ニューロンが変性する","アセチルコリン受容体に対する抗体ができる"],3,"自分のアセチルコリン受容体に対する抗体ができ、神経から筋への伝達が弱まる。夕方に悪化しやすい。",["ジストロフィンの欠損は筋ジストロフィー(デュシェンヌ型)。","ドパミン神経が減るのはパーキンソン病。","運動ニューロンの変性は筋萎縮性側索硬化症など。",""]],["赤筋(遅筋)の割合が多い筋はどれか。",["腓腹筋","外眼筋","ヒラメ筋","上腕二頭筋"],2,"ヒラメ筋は立っている姿勢を保つ抗重力筋で、疲れにくい赤筋が多い。",["腓腹筋はヒラメ筋より白筋が多い。","外眼筋は速く動く筋。","","上腕二頭筋はヒラメ筋より白筋が多い。"]],["筋の収縮に直接使われるエネルギー源はどれか。",["グリコーゲン","ATP","ブドウ糖","中性脂肪"],1,"ミオシン頭部はATPを分解したエネルギーで首を振り、収縮を起こす。ほかの物質はATPをつくる材料。",["グリコーゲンはATPをつくる材料。","","ブドウ糖はATPをつくる材料。","中性脂肪はATPをつくる材料。"]]]},
{"id":"p11","g":"p","k":"感","name":"感覚","q":[["暗い所で働き、明暗を感じる視細胞はどれか。",["錐体","水平細胞","双極細胞","杆体"],3,"杆体は弱い光に敏感で、暗い所で働く。色の区別はできない。",["錐体は明るい所で働き、色を感じる。","水平細胞は網膜で信号を調整する神経細胞。","双極細胞は視細胞の信号を伝える神経細胞。",""]],["近くの物を見るときの変化として正しいのはどれか。",["毛様体筋がゆるみ、水晶体が薄くなる","毛様体筋が収縮し、水晶体が厚くなる","瞳孔が大きくなる","毛様体小帯が強く張る"],1,"毛様体筋が縮むと毛様体小帯がゆるみ、水晶体が自分の弾力で厚くなって、近くにピントが合う。",["遠くを見るときの変化。","","近くを見るときは瞳孔が小さくなる。","近くを見るときは毛様体小帯がゆるむ。"]],["順応が起こりにくい感覚はどれか。",["嗅覚","触覚","痛覚","温度覚"],2,"痛覚は危険を知らせる感覚なので、ほとんど順応しない。",["嗅覚は順応しやすい(においに慣れる)。","触覚は順応しやすい(服の感触に慣れる)。","","温度覚は順応する(お湯の熱さに慣れる)。"]],["味覚の基本味に含まれるのはどれか。",["辛味","渋味","うま味","えぐ味"],2,"基本味は甘味・塩味・酸味・苦味・うま味の5つ。",["辛味は痛覚や温度覚による感覚。","渋味は基本味に含まれない。","","えぐ味は基本味に含まれない。"]],["高い音を感じるのは蝸牛のどの部分か。",["頂部(先端側)","基部(前庭窓に近い側)","半規管","卵形嚢"],1,"基底膜は基部ほど高い音に、頂部ほど低い音によく反応する。",["頂部は低い音を感じる。","","半規管は回転を感じる。","卵形嚢は頭の傾きや直線の加速を感じる。"]],["眼(視覚)の適刺激はどれか。",["化学物質","音","圧力","光"],3,"受容器が最も敏感に反応する刺激を適刺激といい、眼では光。",["化学物質は味覚や嗅覚の適刺激。","音は耳の適刺激。","圧力は触圧覚の受容器の適刺激。",""]],["刺激が強くなると、感覚神経の活動電位はどう変わるか。",["発生する頻度が増える","1つ1つの大きさが大きくなる","伝わる速さが速くなる","変わらない"],0,"活動電位の大きさは一定(全か無かの法則)なので、刺激の強さは活動電位の頻度で伝えられる。",["","大きさは一定。","伝導速度は線維の太さなどで決まる。","頻度が変わる。"]],["2点を同時に触れて2点と区別できる距離(2点識別閾)が最も小さい部位はどれか。",["背中","指先","太もも","上腕"],1,"指先や舌の先は受容器が密集し、2点識別閾が小さい。",["背中は2点識別閾が大きい。","","太ももは2点識別閾が大きい。","上腕は2点識別閾が大きい。"]],["心筋梗塞のときに、左肩や左腕に痛みを感じる現象はどれか。",["幻肢痛","関連痛","順応","投射"],1,"内臓の痛みが、同じ脊髄の高さに入る皮膚の領域の痛みとして感じられる(関連痛)。",["幻肢痛は失った手足に感じる痛み。","","順応は刺激に慣れて感じにくくなること。","投射は感覚を受容器の位置に感じる性質で、この現象の名前ではない。"]],["深部感覚(固有感覚)に含まれるものはどれか。",["温度の感覚","関節の位置の感覚","味の感覚","光の感覚"],1,"深部感覚は筋・腱・関節からの感覚で、関節の位置覚や運動覚、振動覚などがある。",["温度覚は皮膚感覚。","","味覚は特殊感覚。","視覚は特殊感覚。"]],["鋭い速い痛みを伝える神経線維はどれか。",["Aα線維","C線維","Aδ線維","B線維"],2,"鋭くはっきりした痛みは細い有髄のAδ線維が速く伝え、鈍く長く続く痛みはC線維が伝える。",["Aα線維は運動や筋紡錘の情報を伝える。","C線維は鈍い遅い痛みを伝える。","","B線維は自律神経の節前線維。"]],["色を感じる錐体の種類の組み合わせとして正しいのはどれか。",["赤・緑・青","赤・黄・青","赤・緑・黄","白・黒・赤"],0,"錐体には赤・緑・青の光によく反応する3種類があり、その組み合わせで色を感じる。",["","黄に反応する錐体はない。","黄に反応する錐体はない。","白・黒の錐体はない。"]],["明るい所から暗い所に入ると、しだいに見えるようになることを何というか。",["輻輳","明順応","調節","暗順応"],3,"暗い所では杆体の感度が上がり、時間とともに見えるようになる(暗順応)。",["輻輳は近くを見るとき両目が内側に寄ること。","明順応は暗い所から明るい所に出たときの順応。","調節は水晶体でピントを合わせること。",""]],["杆体の視物質はどれか。",["ミオグロビン","メラニン","ヘモグロビン","ロドプシン"],3,"ロドプシンは光で分解され、杆体を興奮させる。材料にビタミンAが必要。",["ミオグロビンは筋で酸素を蓄える。","メラニンは色素。","ヘモグロビンは酸素を運ぶ。",""]],["ビタミンAが不足すると起こりやすいものはどれか。",["くる病","脚気","壊血病","夜盲症"],3,"ビタミンAが不足するとロドプシンがつくれず、暗い所で見えにくくなる(夜盲症)。",["くる病はビタミンD不足。","脚気はビタミンB₁不足。","壊血病はビタミンC不足。",""]],["近視の説明として正しいのはどれか。",["角膜のゆがみ","焦点が網膜より後ろに結ぶ","水晶体が硬くなる","焦点が網膜より前に結ぶ"],3,"近視は遠くの物の焦点が網膜の前に結び、凹レンズで矯正する。",["角膜のゆがみは乱視。","網膜より後ろに結ぶのは遠視(凸レンズで矯正)。","水晶体が硬くなるのは老視。",""]],["老視(老眼)の主な原因はどれか。",["角膜が濁る","網膜がはがれる","水晶体の弾力が低下する","眼圧が上がる"],2,"年をとると水晶体が硬くなり、近くを見るときに厚くなれず、ピントが合わなくなる。",["角膜の濁りは老視の原因ではない。","網膜剥離は老視の原因ではない。","","眼圧の上昇は緑内障に関わる。"]],["両眼の耳側(外側)の視野が欠ける(両耳側半盲)ときに障害されている部位はどれか。",["視神経(片側)","視交叉","後頭葉の視覚野(片側)","網膜の中心窩"],1,"視交叉では鼻側の網膜からの線維(耳側の視野を担当)が交叉するため、ここが下垂体腫瘍などで押されると両耳側半盲になる。",["片側の視神経の障害では、その眼が見えなくなる。","","片側の視覚野の障害では反対側の視野が両眼とも欠ける(同名半盲)。","中心窩の障害では視野の中心が見えにくくなる。"]],["音が伝わる順序として正しいのはどれか。",["外耳道→耳小骨→鼓膜→前庭窓→蝸牛","外耳道→鼓膜→耳小骨→前庭窓→蝸牛","外耳道→鼓膜→前庭窓→耳小骨→蝸牛","鼓膜→外耳道→耳小骨→蝸牛→前庭窓"],1,"音は鼓膜を振動させ、耳小骨で増幅されて前庭窓から蝸牛のリンパに伝わる。",["鼓膜が耳小骨より先。","","耳小骨が前庭窓より先。","外耳道が最初。"]],["ヒトが聞くことのできる音の高さ(周波数)の範囲はおよそどれか。",["約20〜20000Hz","約200〜2000Hz","約2〜200Hz","約20000〜200000Hz"],0,"ヒトの可聴範囲は約20〜20000Hz。年をとると高い音から聞こえにくくなる。",["","範囲が狭すぎる。","低すぎる。","超音波の領域で、ヒトには聞こえない。"]],["音の大きさ(音圧レベル)を表す単位はどれか。",["デシベル(dB)","ヘルツ(Hz)","ミリボルト(mV)","パスカル秒"],0,"音の大きさはデシベル、音の高さ(周波数)はヘルツで表す。",["","ヘルツは音の高さの単位。","ミリボルトは電位の単位。","音の大きさの単位ではない。"]],["伝音難聴で障害される部位はどれか。",["聴覚野","蝸牛","聴神経","外耳と中耳"],3,"伝音難聴は、音を伝える外耳・中耳の障害で起こる。",["聴覚野の障害は中枢性の聴覚障害。","蝸牛の障害は感音難聴。","聴神経の障害は感音難聴。",""]],["半規管の受容器(有毛細胞)を刺激するものはどれか。",["頭の回転で生じる内リンパの流れ","耳石のずれ","鼓膜の振動","外リンパの圧の上昇"],0,"頭が回転すると半規管の内リンパが遅れて動き、膨大部稜の有毛細胞を刺激する。",["","耳石は卵形嚢・球形嚢の平衡斑にある。","鼓膜の振動は聴覚。","外リンパの圧では刺激しない。"]],["視床を中継せずに大脳へ伝わる感覚はどれか。",["味覚","視覚","聴覚","嗅覚"],3,"嗅覚は嗅球から直接大脳(嗅覚野など)へ伝わり、視床を経由しない。",["味覚は視床を中継する。","視覚は視床(外側膝状体)を中継する。","聴覚は視床(内側膝状体)を中継する。",""]],["味を感じる受容器はどれか。",["コルチ器","嗅上皮","味蕾","マイスナー小体"],2,"味蕾は主に舌乳頭にあり、味細胞が味の物質を感じる。",["コルチ器は音を感じる。","嗅上皮はにおいを感じる。","","マイスナー小体は触覚を感じる。"]],["舌の後ろ3分の1の味覚を伝える神経はどれか。",["顔面神経","舌咽神経","三叉神経","舌下神経"],1,"舌の後ろ3分の1の味覚は舌咽神経、前3分の2は顔面神経(鼓索神経)が伝える。",["顔面神経は前3分の2の味覚。","","三叉神経は舌の一般感覚(前3分の2)。","舌下神経は運動神経。"]],["皮膚の感覚点のうち、最も数が多いのはどれか。",["温点","圧点","冷点","痛点"],3,"感覚点の密度は痛点が最も高く、圧点・冷点・温点の順に少なくなる。",["温点は最も少ない。","圧点は痛点より少ない。","冷点は痛点より少ない。",""]],["温点と冷点の数について正しいのはどれか。",["冷点の方が多い","温点の方が多い","同じ数","どちらも存在しない"],0,"冷点は温点より数倍多い。",["","温点は冷点より少ない。","同じではない。","どちらも存在する。"]],["内臓の痛みを起こしやすい刺激はどれか。",["切ること","急に引き伸ばされること","焼くこと","軽く触れること"],1,"内臓は切ったり焼いたりしても痛みを感じにくいが、急な伸展・けいれん・血流の不足では強い痛みが出る。",["内臓は切っても痛みを感じにくい。","","内臓は焼いても痛みを感じにくい。","軽く触れても痛まない。"]],["体性感覚野で広い面積を占める体の部位はどれか。",["背中","手指と顔(口)","太もも","腹部"],1,"感覚の細かい手指や口唇・舌は、体性感覚野で大きな面積を占める(ホムンクルス)。",["背中は狭い。","","太ももは狭い。","腹部は狭い。"]]]},
{"id":"p12","g":"p","k":"生","name":"生殖・老化","q":[["排卵を引き起こすホルモンはどれか。",["卵胞刺激ホルモン(FSH)","プロゲステロン","黄体形成ホルモン(LH)","オキシトシン"],2,"下垂体前葉からLHが急に多く出る(LHサージ)ことで排卵が起こる。",["FSHは卵胞の発育を促す。","プロゲステロンは排卵後の黄体から出る。","","オキシトシンは子宮の収縮や射乳に働く。"]],["排卵後に基礎体温を上げるホルモンはどれか。",["エストロゲン","プロラクチン","FSH","プロゲステロン"],3,"黄体から出るプロゲステロン(黄体ホルモン)が体温を上げ、高温期になる。",["エストロゲンに体温を上げる働きはない。","プロラクチンは乳汁の産生を促す。","FSHは卵胞の発育を促す。",""]],["精巣で男性ホルモン(テストステロン)を分泌する細胞はどれか。",["セルトリ細胞","顆粒膜細胞","精祖細胞","ライディッヒ細胞(間質細胞)"],3,"精細管の間にあるライディッヒ細胞がテストステロンを分泌する。",["セルトリ細胞は精子の形成を支える。","顆粒膜細胞は卵巣の卵胞にある。","精祖細胞は精子のもとになる細胞。",""]],["男性の性染色体の組み合わせはどれか。",["XX","XO","YY","XY"],3,"ヒトの染色体は46本。性染色体は男性がXY、女性がXX。",["XXは女性。","XOはターナー症候群でみられる。","YYだけの組み合わせはない。",""]],["加齢による変化として正しいのはどれか。",["残気量が減る","肺活量が減る","収縮期血圧が下がる","基礎代謝が上がる"],1,"加齢で肺の弾力や呼吸筋の力が落ち、肺活量は減る。",["残気量は増える。","","動脈が硬くなり、収縮期血圧は上がる。","基礎代謝は下がる。"]],["月経周期の平均的な長さはどれか。",["約14日","約21日","約28日","約40日"],2,"月経周期は平均約28日(25〜38日程度が正常範囲)。",["約14日は排卵までの日数の目安。","約21日では短い。","","約40日では長い。"]],["月経周期が28日のとき、排卵はおよそいつ起こるか。",["月経開始から約7日目","月経開始から約28日目","月経開始から約21日目","月経開始から約14日目"],3,"排卵は次の月経の約14日前に起こる。28日周期なら月経開始から約14日目。",["約7日目では早すぎる。","約28日目は次の月経の直前。","約21日目は黄体期。",""]],["排卵後の子宮内膜の時期はどれか。",["分泌期","増殖期","月経期","閉経期"],0,"排卵後は黄体のプロゲステロンで子宮内膜が分泌期になり、着床に備える。",["","増殖期は排卵前(卵胞期)で、エストロゲンが働く。","月経期は内膜がはがれる時期。","閉経期は月経周期の時期ではない。"]],["月経が起こる直接の原因はどれか。",["FSHが減る","LHが急に増える","エストロゲンとプロゲステロンが急に減る","オキシトシンが増える"],2,"妊娠しないと黄体が退化して両ホルモンが減り、子宮内膜の機能層がはがれる。",["直接の原因ではない。","LHが急に増えると排卵が起こる。","","オキシトシンは関係しない。"]],["テストステロンの作用はどれか。",["排卵を起こす","乳汁をつくらせる","子宮内膜を増殖させる","男性の二次性徴を起こす"],3,"テストステロンは声変わり・ひげ・筋肉の発達など男性の二次性徴を起こし、精子形成も助ける。",["排卵を起こすのはLH。","乳汁をつくらせるのはプロラクチン。","子宮内膜を増殖させるのはエストロゲン。",""]],["受精卵が子宮内膜に着床するのは、受精からおよそいつか。",["約1日後","約7日後","約14日後","約28日後"],1,"受精卵は細胞分裂しながら子宮へ運ばれ、受精後約7日で着床する。",["約1日後ではまだ卵管にいる。","","約14日後では遅い。","約28日後では遅い。"]],["胎盤の働きでないものはどれか。",["母体と胎児の血液を直接まぜる","胎児に酸素と栄養を渡す","胎児の老廃物を母体へ渡す","ホルモンを分泌する"],0,"胎盤では母体と胎児の血液は直接まざらず、膜を通して物質が交換される。",["","酸素と栄養を渡すのは胎盤の働き。","老廃物を母体へ渡すのは胎盤の働き。","hCGなどのホルモンを分泌する。"]],["正常な妊娠期間(最終月経の開始日から数えて)はおよそどれか。",["約30週","約40週","約50週","約60週"],1,"妊娠期間は約40週(280日)。",["約30週では早産になる。","","約50週では長すぎる。","約60週では長すぎる。"]],["閉経後のホルモンの変化として正しいのはどれか。",["エストロゲンが増え、FSHが減る","エストロゲンが減り、FSHとLHが増える","プロゲステロンが増える","すべての性ホルモンが増える"],1,"卵巣の働きが止まりエストロゲンが減ると、負のフィードバックがなくなりFSH・LHが増える。",["エストロゲンは減り、FSHは増える。","","プロゲステロンは減る。","性ホルモンは減る。"]],["閉経後の女性に起こりやすいものはどれか。",["巨人症","クレチン症","骨粗鬆症","夜盲症"],2,"エストロゲンには骨を守る働きがあり、閉経後は骨量が減りやすい。",["巨人症は成長期の成長ホルモン過剰。","クレチン症は小児期の甲状腺ホルモン不足。","","夜盲症はビタミンA不足。"]],["子どもの性別を決めるものはどれか。",["精子がもつ性染色体","卵子がもつ性染色体","母親のホルモン","受精する場所"],0,"卵子はすべてX、精子はXかYをもつので、受精した精子の性染色体で性別が決まる。",["","卵子はすべてXをもつので、性別を決めない。","母親のホルモンでは決まらない。","受精する場所では決まらない。"]],["女性の二次性徴を起こす主なホルモンはどれか。",["プロラクチン","テストステロン","エストロゲン","オキシトシン"],2,"エストロゲンは乳房の発達や女性らしい体つきなどの二次性徴を起こす。",["プロラクチンは乳汁の産生。","テストステロンは男性の二次性徴。","","オキシトシンは射乳と子宮の収縮。"]],["授乳中に月経が戻りにくいことに主に関わるホルモンはどれか。",["テストステロン","オキシトシン","プロラクチン","カルシトニン"],2,"授乳でプロラクチンが多く出ると、性腺刺激ホルモンの分泌がおさえられ、排卵が起こりにくくなる。",["テストステロンは男性ホルモン。","オキシトシンは射乳に働く。","","カルシトニンは血中カルシウムを下げる。"]],["年をとると起こる変化として正しいのはどれか。",["腎血流量が増える","骨量が減る","最大心拍数が増える","低い音から聞こえにくくなる"],1,"年をとると骨量が減り、骨折しやすくなる。",["腎血流量は減る。","","最大心拍数は減る。","高い音から聞こえにくくなる。"]],["年をとると、まず聞こえにくくなる音はどれか。",["低い音","高い音","大きい音","すべての音が同時に"],1,"加齢による難聴(老人性難聴)は高い音から始まる。",["低い音は比較的保たれる。","","大きさではなく、音の高さで差が出る。","高い音から始まる。"]],["高齢者で、体重に占める割合が減るものはどれか。",["体脂肪","体内の水分","結合組織","特に変化はない"],1,"高齢者は細胞内液が減り、体重に占める水分の割合が少なくなるため、脱水になりやすい。",["体脂肪の割合はむしろ増えやすい。","","主な変化ではない。","変化がある。"]],["加齢によって最大心拍数はどう変わるか。",["増える","減る","変わらない","子どもより増える"],1,"最大心拍数は年齢とともに下がる(目安は220−年齢)。",["増えない。","","変わる。","子どもより多くはならない。"]],["加齢によって糸球体ろ過量はどう変わるか。",["低下する","増加する","変わらない","一時的に増えてから元に戻る"],0,"年をとると腎臓の働きは低下し、糸球体ろ過量も減る。薬が体に残りやすくなる。",["","増加しない。","変わる。","正しくない。"]],["高齢者に脱水が起こりやすい理由として正しいのはどれか。",["汗をかかない","のどの渇きを感じにくい","尿が濃くなりすぎる","水を吸収できない"],1,"高齢者はのどの渇きを感じにくく、体内の水分も少ないため脱水になりやすい。",["汗はかく。","","むしろ尿を濃くする力が落ちる。","水は吸収できる。"]],["細胞分裂のたびに短くなり、老化に関わる染色体の末端の部分はどれか。",["ミトコンドリア","セントロメア","リボソーム","テロメア"],3,"テロメアは細胞分裂のたびに短くなり、一定より短くなると細胞は分裂できなくなる。",["ミトコンドリアはATPをつくる。","セント function mix(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stat(ids){let n=0,c=0;ids.forEach(id=>{const r=rec[id];if(r){n++;if(r.r)c++;}});return{n,c};}
function pct(s){return s.n?Math.round(s.c/s.n*100)+'%':'—';}
function wrongIds(){return Object.keys(rec).filter(id=>Q[id]&&rec[id].r===0);}
function scopeFields(){return F.filter(f=>tab==='all'||tab==='w'||f.g===tab);}

function renderChips(){
  const box=$('#chips');
  if(tab==='w'){box.innerHTML='';box.hidden=true;return;}
  box.hidden=false;
  const fs=scopeFields();
  box.innerHTML='<button class="chip" data-f="all" aria-pressed="'+(fil==='all')+'">全分野</button>'+
    fs.map(f=>'<button class="chip" data-f="'+f.id+'" aria-pressed="'+(fil===f.id)+'">'+f.name+'</button>').join('');
}
function renderSum(){
  const ids=[].concat(...scopeFields().map(f=>f.ids));
  const s=stat(ids);
  $('#sum').innerHTML=tab==='w'
    ?'まちがえた問題 <b>'+wrongIds().length+'</b> 問'
    :'解いた問題 <b>'+s.n+'</b> / '+ids.length+'　正答率 <b>'+pct(s)+'</b>';
  const w=wrongIds().length,b=$('#wb');
  b.textContent=w;b.hidden=!w;
}
function bandRate(f){const s=stat(f.ids);return '<span class="rt'+(s.n?'':' none')+'" data-rf="'+f.id+'">'+(s.n?'正答率 '+pct(s):'未回答')+'</span>';}

function render(){
  let groups;
  if(tab==='w'){
    const w=new Set(wrongIds());
    groups=F.map(f=>({f,ids:f.ids.filter(id=>w.has(id))})).filter(x=>x.ids.length);
  }else{
    groups=scopeFields().filter(f=>fil==='all'||f.id===fil).map(f=>({f,ids:f.ids.slice()}));
  }
  if(shuf)groups.forEach(x=>mix(x.ids));
  seq=[];ses={};openId=null;
  if(!groups.length){
    list.innerHTML='<div class="empty"><div class="ic">○</div>まちがえた問題はありません。</div>';
  }else{
    const showG=tab==='all'||tab==='w';
    list.innerHTML=groups.map(({f,ids})=>{
      const rows=ids.map((id,i)=>{seq.push(id);const r=rec[id];
        return '<div class="item" id="it-'+id+'"><button class="row" data-id="'+id+'" aria-expanded="false"><span class="num">'+(i+1)+'</span><span class="qt">'+Q[id].t+'</span><span class="mk'+(r?(r.r?' ok':' ng'):'')+'"></span><span class="chev"></span></button><div class="body" hidden><div class="inner"></div></div></div>';
      }).join('');
      return '<div class="band"><span class="ic">'+f.k+'</span><span class="bn">'+(showG?'<small>'+GN[f.g]+'</small>':'')+f.name+'</span><span class="cnt">'+ids.length+'問</span>'+bandRate(f)+'</div>'+rows;
    }).join('');
  }
  renderSum();
}

/* 高さアニメーション(押した要素だけを動かす) */
function slide(el,open){
  if(el._t){clearTimeout(el._t);}
  el.style.transition='none';
  if(open){
    el.hidden=false;
    const from=el.style.height&&el.style.height!=='auto'?el.getBoundingClientRect().height:0;
    el.style.height=from+'px';el.style.overflow='hidden';
    const to=el.scrollHeight;
    el.offsetHeight;
    el.style.transition='height 1s var(--ease)';
    el.style.height=to+'px';
  }else{
    el.style.height=el.getBoundingClientRect().height+'px';el.style.overflow='hidden';
    el.offsetHeight;
    el.style.transition='height 1s var(--ease)';
    el.style.height='0px';
  }
  el._t=setTimeout(()=>{el.style.transition='';if(open){el.style.height='';el.style.overflow='';}else{el.hidden=true;el.style.height='';}el._t=null;},1020);
}
function instantClose(el){if(el._t){clearTimeout(el._t);el._t=null;}el.style.transition='';el.style.height='';el.hidden=true;}

function sessionOf(id){return ses[id]||(ses[id]={o:shuf?mix([0,1,2,3]):[0,1,2,3],ch:null});}
function resHTML(id){
  const q=Q[id],s=sessionOf(id),ok=s.ch===q.a,pos=s.o.indexOf(q.a)+1;
  const others=s.o.map((k,j)=>k===q.a?'':'<li><span class="cn">'+(j+1)+'</span><span>'+q.n[k]+'</span></li>').join('');
  const i=seq.indexOf(id),last=i===seq.length-1;
  const nx=last?(wrongIds().length&&tab!=='w'?'<button class="next" data-go="w">間違いを解き直す</button>':'<span class="end">ここまでです</span>')
              :'<button class="next" data-next="'+id+'">次の問題へ</button>';
  return '<div class="res-in"><div class="vd '+(ok?'ok':'ng')+'">'+(ok?'正解':'ちがいます')+'<span>正解は '+pos+'</span></div>'+
    '<p class="ex">'+q.e+'</p><p class="oth">ほかの選択肢</p><ul class="ot">'+others+'</ul>'+
    '<div class="acts">'+nx+'<button class="retry" data-retry="'+id+'">もう一度</button></div></div>';
}
function build(id){
  const q=Q[id],s=sessionOf(id),it=document.getElementById('it-'+id),inner=it.querySelector('.inner');
  inner.innerHTML='<ol class="chs'+(s.ch!==null?' done':'')+'">'+s.o.map((k,j)=>{
    let c='';if(s.ch!==null){if(k===q.a)c=' is-ok';else if(k===s.ch)c=' is-ng';}
    return '<li><button class="ch'+c+'" data-id="'+id+'" data-k="'+k+'"><span class="cn">'+(j+1)+'</span><span>'+q.c[k]+'</span></button></li>';
  }).join('')+'</ol><div class="res"'+(s.ch===null?' hidden':'')+'>'+(s.ch===null?'':resHTML(id))+'</div>';
}
function openItem(id){
  const it=document.getElementById('it-'+id);if(!it)return;
  build(id);
  it.classList.add('open');it.querySelector('.row').setAttribute('aria-expanded','true');
  slide(it.querySelector('.body'),true);openId=id;
}
function closeItem(id,instant){
  const it=document.getElementById('it-'+id);if(!it)return;
  it.classList.remove('open');it.querySelector('.row').setAttribute('aria-expanded','false');
  const b=it.querySelector('.body');
  instant?instantClose(b):slide(b,false);
  if(openId===id)openId=null;
}
function toggle(id){
  if(openId===id){closeItem(id);return;}
  if(openId){
    const prev=document.getElementById('it-'+openId),cur=document.getElementById('it-'+id);
    if(prev&&cur&&(prev.compareDocumentPosition(cur)&Node.DOCUMENT_POSITION_FOLLOWING)){
      const before=cur.getBoundingClientRect().top;
      closeItem(openId,true);
      const after=cur.getBoundingClientRect().top;
      window.scrollBy(0,after-before);
    }else closeItem(openId);
  }
  openItem(id);
}
function answer(id,k){
  const q=Q[id],s=sessionOf(id);if(s.ch!==null)return;
  s.ch=k;const ok=k===q.a;
  rec[id]={r:ok?1:0,n:((rec[id]||{}).n||0)+1};save();
  const it=document.getElementById('it-'+id),body=it.querySelector('.body');
  if(body._t){clearTimeout(body._t);body._t=null;body.style.transition='';body.style.height='';body.style.overflow='';}
  it.querySelector('.chs').classList.add('done');
  it.querySelectorAll('.ch').forEach(b=>{const kk=+b.dataset.k;if(kk===q.a)b.classList.add('is-ok');else if(kk===k)b.classList.add('is-ng');});
  const res=it.querySelector('.res');res.innerHTML=resHTML(id);slide(res,true);
  it.querySelector('.mk').className='mk '+(ok?'ok':'ng');
  const r=list.querySelector('[data-rf="'+q.f.id+'"]');
  if(r){const st=stat(q.f.ids);r.textContent='正答率 '+pct(st);r.classList.remove('none');}
  renderSum();
}
function goNext(id){
  const nid=seq[seq.indexOf(id)+1];if(!nid)return;
  closeItem(id,true);
  const el=document.getElementById('it-'+nid);
  const y=el.getBoundingClientRect().top+window.scrollY-document.querySelector('.tabs').offsetHeight-6;
  window.scrollTo({top:y,behavior:'smooth'});
  openItem(nid);
}

list.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('row'))toggle(t.dataset.id);
  else if(t.classList.contains('ch'))answer(t.dataset.id,+t.dataset.k);
  else if(t.dataset.next)goNext(t.dataset.next);
  else if(t.dataset.retry){const id=t.dataset.retry;ses[id]={o:shuf?mix([0,1,2,3]):[0,1,2,3],ch:null};build(id);}
  else if(t.dataset.go)setTab('w',true);
});
function setTab(t,scroll){
  tab=t;fil='all';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  renderChips();render();
  if(scroll){const y=$('main').getBoundingClientRect().top+window.scrollY-document.querySelector('.tabs').offsetHeight;if(window.scrollY>y)window.scrollTo({top:y});}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setTab(b.dataset.t,true);});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;fil=b.dataset.f;
  $('#chips').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render();});
$('#shuf').addEventListener('click',()=>{shuf=!shuf;$('#shuf').setAttribute('aria-pressed',shuf);render();});
$('#clear').addEventListener('click',()=>{if(confirm('解いた記録をすべて消しますか?')){rec={};save();render();}});
const toTop=$('#top');let tk=false;
window.addEventListener('scroll',()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{toTop.classList.toggle('on',window.scrollY>600);tk=false;});},{passive:true});
toTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
setTab('a');
</script>
</body>
